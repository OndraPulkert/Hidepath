<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050"><style>text{font-family:Arial,sans-serif;fill:#263c35}.title{font-size:38px;font-weight:bold}.sub{font-size:18px}.small{font-size:15px}.label{font-size:17px}.leather{fill:#b98355;stroke:#614c38;stroke-width:1.4}.lid{fill:#d8b587;stroke:#614c38;stroke-width:1.4}.seam{fill:none;stroke:#f2e2c6;stroke-width:1.3;stroke-dasharray:4 4}.metal{fill:#cbb27c;stroke:#725a35;stroke-width:1.2}.line{fill:none;stroke:#7d8d7c;stroke-width:1.2}</style>
<rect width="1280" height="1050" fill="#f6f1e8"/>
<text x="60" y="52" class="small">HIDEPATH / OBRAT R08-screening / KONSTRUKČNÍ POSOUZENÍ</text>
<text x="60" y="109" class="title">Jedna useň 1,2 mm. Méně vrstev.</text>
<text x="60" y="149" class="sub">Karty a bankovky v jedné kapse. Vlastní horní druk C zůstává.</text>
<text x="60" y="202" class="label">DOPORUČENÝ PROTOTYP: DVĚ ŠIRŠÍ KOMORY</text>
<text x="670" y="202" class="label">ALTERNATIVA: TŘI KOMORY, VĚTŠÍ ŠÍŘKA</text>
<g transform="translate(70 232)"><rect class="leather" width="345.6" height="288" rx="16"/><path class="lid" d="M0 12.8 Q0 0 16 0 H329.6 Q345.6 0 345.6 16 V108.80000000000001 Q345.6 121.60000000000001 332.8 121.60000000000001 L12.8 134.4 Q0 134.4 0 121.60000000000001Z"/><rect class="leather" y="153.60000000000002" width="345.6" height="134.4" rx="12.8"/><path class="seam" d="M76.80000000000001 172.8V276.8H198.4V172.8"/><path class="seam" d="M198.4 172.8V276.8H320V172.8"/><rect class="line" x="11.200000000000001" y="156.8" width="54.400000000000006" height="120" rx="6.4"/><circle class="metal" cx="38.400000000000006" cy="249.60000000000002" r="12.8"/><text class="small" x="54.400000000000006" y="254.60000000000002">A</text><circle class="metal" cx="38.400000000000006" cy="192" r="12.8"/><text class="small" x="54.400000000000006" y="197">rub B</text><circle class="metal" cx="272" cy="86.4" r="12.8"/><text class="small" x="288" y="91.4">C</text><path class="line" d="M0 308H345.6M0 303V313M345.6 303V313"/><text class="label" x="172.8" y="334" text-anchor="middle">108 × 90 mm</text></g>
<g transform="translate(690 232)"><rect class="leather" width="409.6" height="288" rx="16"/><path class="lid" d="M0 12.8 Q0 0 16 0 H393.6 Q409.6 0 409.6 16 V108.80000000000001 Q409.6 121.60000000000001 396.8 121.60000000000001 L12.8 134.4 Q0 134.4 0 121.60000000000001Z"/><rect class="leather" y="153.60000000000002" width="409.6" height="134.4" rx="12.8"/><path class="seam" d="M76.80000000000001 172.8V276.8H174.4V172.8"/><path class="seam" d="M174.4 172.8V276.8H284.8V172.8"/><path class="seam" d="M284.8 172.8V276.8H385.6V172.8"/><rect class="line" x="11.200000000000001" y="156.8" width="54.400000000000006" height="120" rx="6.4"/><circle class="metal" cx="38.400000000000006" cy="249.60000000000002" r="12.8"/><text class="small" x="54.400000000000006" y="254.60000000000002">A</text><circle class="metal" cx="38.400000000000006" cy="192" r="12.8"/><text class="small" x="54.400000000000006" y="197">rub B</text><circle class="metal" cx="320" cy="86.4" r="12.8"/><text class="small" x="336" y="91.4">C</text><path class="line" d="M0 308H409.6M0 303V313M409.6 303V313"/><text class="label" x="204.8" y="334" text-anchor="middle">128 × 90 mm</text></g>
<text x="70" y="596" class="label">4 drobné jako 2 + 2. Tvar ke schválení.</text>
<text x="690" y="596" class="label">4 drobné jako 2 + 1 + 1. Různé šířky komor.</text>
<text x="70" y="628" class="small">Místo vlevo je vyhrazené kování A a B, ne mincím.</text>
<text x="690" y="628" class="small">Původních 108 mm se třemi komorami zde nevychází.</text>
<path class="line" d="M60 664H1220"/>
<text x="60" y="707" class="label">ODSTRANĚNÁ VRSTVA: PLNÁ PŘEPÁŽKA MEZI KARTAMI A BANKOVKAMI</text>
<text x="60" y="741" class="sub">Dvě stěny společné kapsy + dvě stěny mincí + mincovní klopa = 5 vrstev v překryvu.</text>
<text x="60" y="775" class="sub">Původně 13,89 mm → nyní 12,69 mm s 1 × 50 Kč v místě měření.</text>
<text x="60" y="809" class="sub">Se dvojicí 1 + 2 Kč: 13,84 mm. Bez lepidla, vzduchu, švů a výšky kování.</text>
<text x="60" y="851" class="label">B je nově v pevném levém lemu — jeho rub nezabírá místo prostřední minci.</text>
<text x="60" y="900" class="label">KONTROLA PROSTORU A SOUČTŮ ≠ OVĚŘENÍ V KŮŽI</text>
<text x="60" y="933" class="small">Ohyby, síla druků, těsnost klopy a skutečná tloušťka čekají na fyzickou zkoušku.</text>
<text x="60" y="966" class="small">Schéma předku: B označuje vyhrazenou zónu; kresba neřeší hotové rozvinutí a délku klopy.</text>
<text x="60" y="1012" class="small">Není to střih. Obě varianty nejsou schválené výrobní projekty. Druky v obálce do Ø 12 mm nejsou výběr konkrétního výrobku.</text>
</svg>