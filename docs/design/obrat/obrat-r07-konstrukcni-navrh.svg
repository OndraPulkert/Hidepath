<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060"><defs><linearGradient id="leather" x2="0.7" y2="1"><stop stop-color="#bc773d"/><stop offset="1" stop-color="#82441f"/></linearGradient></defs><rect width="1500" height="1060" fill="#faf6ef"/><style>text{font-family:Arial,sans-serif;fill:#342a23} .h{font-size:29px;font-weight:bold}.t{font-size:18px}.s{font-size:15px}.cut{fill:url(#leather);stroke:#63391f;stroke-width:2}.st{fill:none;stroke:#f3d8ad;stroke-width:1.6;stroke-dasharray:5 4}.dim{stroke:#766e64;fill:none;stroke-width:1.4}.snap{fill:#d8b66b;stroke:#765a27;stroke-width:2}</style><text x="55" y="51" class="h">OBRAT · R08 — oprava po auditu, neověřený koncept</text><text x="55" y="82" class="t">Vzhled podle iterace 03 • jedna useň 1,2 mm • pracovní tělo 108 × 90 mm</text><text x="55" y="111" class="s">Rozměrový koncept, nikoli střih pro řezání. Prototyp ani konkrétní kování zatím nejsou ověřené.</text><text x="70" y="164" class="h">01 / ZAVŘENÁ</text><rect x="70" y="210" width="324" height="270" rx="24" class="cut"/><rect x="77" y="217" width="310" height="256" rx="19" class="st"/><path d="M92 210H372Q394 210 394 232V308Q394 324 378 324.6L92 335.2Q70 336 70 314V232Q70 210 92 210Z" class="cut"/><path d="M92 218H372Q386 218 386 232V308Q386 316 378 316.6L92 327.2Q78 328 78 314V232Q78 218 92 218Z" class="st"/><circle cx="325" cy="291" r="14" class="snap"/><text x="345" y="296" class="s">C</text><rect x="70" y="354" width="324" height="126" rx="12" class="cut"/><rect x="78" y="362" width="308" height="110" rx="8" class="st"/><path d="M 142 361 V 470 M 256 361 V 470" class="st"/><circle cx="106" cy="444" r="14" class="snap"/><text x="126" y="449" class="s">A</text><circle cx="106" cy="390" r="14" class="snap"/><text x="126" y="395" class="s">rub B</text><text x="70" y="516" class="s">Levý lem + dvě kapsy = tři pohledová pole.</text><text x="70" y="541" class="s">Klopa: vzestup doprava 4 mm; mezera 6–10 mm.</text><path d="M70 190H394 M70 184V196 M394 184V196" class="dim"/><text x="184" y="184" class="s">108 mm</text><text x="490" y="164" class="h">02 / KARTY A BANKOVKY</text><path d="M532 175L812 185.4Q834 186 834 208V463Q834 485 812 485H532Q510 485 510 463V197Q510 175 532 175Z" class="cut"/><path d="M532 183L812 193.4Q826 194 826 208V463Q826 477 812 477H532Q518 477 518 463V197Q518 183 532 183Z" class="st"/><circle cx="765" cy="220" r="14" class="snap"/><circle cx="765" cy="220" r="7" fill="#45331d"/><text x="785" y="225" class="s">C — objímka</text><rect x="540" y="293" width="255" height="180" rx="3" class="dim"/><rect x="540" y="293" width="255" height="180" rx="3" fill="#d9cfaf" stroke="#9e947a"/><text x="555" y="322" class="s">bankovky napůl</text><rect x="536" y="340" width="257" height="162" rx="9" fill="#aab6b8" stroke="#e7edea"/><rect x="536" y="353" width="257" height="162" rx="9" fill="#80969c" stroke="#e7edea"/><rect x="536" y="366" width="257" height="162" rx="9" fill="#4c6976" stroke="#e7edea"/><rect x="536" y="379" width="257" height="162" rx="9" fill="#294754" stroke="#e7edea"/><path d="M510 360H590Q610 410 635 410H710Q730 410 740 360H834V540Q834 555 819 555H525Q510 555 510 540Z" class="cut"/><circle cx="765" cy="393" r="14" class="snap"/><text x="785" y="398" class="s">C — čep</text><rect x="510" y="429" width="324" height="126" rx="12" class="cut"/><circle cx="546" cy="519" r="14" class="snap"/><text x="566" y="524" class="s">A</text><circle cx="546" cy="465" r="14" class="snap"/><text x="566" y="470" class="s">rub B</text><path d="M582 436V545 M696 436V545" class="st"/><text x="490" y="584" class="s">Společná hlavní kapsa: čtyři karty před bankovkami.</text><text x="490" y="609" class="s">Mincovní pás zůstává zapnutý. Žádná plná přepážka.</text><text x="960" y="164" class="h">03 / MINCOVNÍ MODUL</text><rect x="970" y="300" width="324" height="126" rx="12" class="cut"/><rect x="977.5" y="309" width="249" height="117" rx="5" class="cut"/><path d="M988 309V415 M1102 309V415 M1216 309V415" class="st"/><circle cx="1258" cy="336" r="14" class="snap"/><text x="1278" y="341" class="s">B</text><circle cx="1258" cy="390" r="14" class="snap"/><circle cx="1258" cy="390" r="7" fill="#45331d"/><text x="1278" y="395" class="s">A</text><rect x="970" y="210" width="324" height="90" rx="12" class="cut"/><path d="M970 300H1294" class="dim"/><circle cx="1258" cy="264" r="14" class="snap"/><circle cx="1258" cy="264" r="7" fill="#45331d"/><text x="1278" y="269" class="s">B</text><circle cx="1045" cy="355" r="29" fill="#c6bb95" stroke="#706b57"/><circle cx="1159" cy="355" r="29" fill="#c6bb95" stroke="#706b57"/><text x="960" y="476" class="s">Ohyb k tělu VLEVO; volný konec s A/B VPRAVO.</text><text x="960" y="503" class="s">Víčko navazuje na nosič bez přišívacího švu.</text><text x="960" y="530" class="s">Délka víčka a ohybů zatím nejsou stanovené.</text><text x="960" y="557" class="s">B je uvnitř, jeho rub je vidět zvenku.</text><path d="M55 646H1445" class="dim"/><text x="55" y="689" class="h">04 / DÍLY A POŘADÍ VRSTEV</text><text x="55" y="728" class="t">T1  Zadní stěna + horní klopa + boční nosič: jeden souvislý díl.</text><text x="55" y="759" class="t">T2  Přední stěna společné kapsy: přišitá k T1 po stranách a dole.</text><text x="55" y="790" class="t">T3  Plochý předek mincí: přišitý k nosiči dvěma U-švy, bez tvarovaných košíčků.</text><text x="55" y="821" class="t">Víčko mincí: integrální pokračování nosiče; rozvinutí dosud chybí.</text><text x="55" y="852" class="t">K    Kryty rubů kování ze stejné usně, jen tam, kde hrozí kontakt s obsahem.</text><text x="55" y="916" class="s">Řez zavřeným pásem: záda → obsah → předek kapsy → víčko → předek mincí → mince → nosič.</text><text x="55" y="945" class="s">Pět vrstev nad mincí. Tloušťka u A/B/C včetně kování zatím není uzavřená; maximum není známé.</text><text x="55" y="987" class="t">PŘED STŘIHEM: určit délku obou ohybů na vzorku, rozvinutí klop, skutečné druky a retenci rohů.</text><text x="55" y="1018" class="s">Panel 03 není v měřítku; nákres neudává délky klop ani polohy montážních děr pro výrobu. Ty se dopasují přes skutečný obsah.</text></svg>