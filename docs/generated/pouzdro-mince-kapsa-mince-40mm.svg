<text x="98" y="31.75" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">55 × 54,5 mm</text>
<text x="98" y="35.35" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">čárkovaný čtverec 70 × 70 = kus kůže:</text>
<text x="98" y="38.95" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">výtisk na značky nalepit na tenký karton</text>
<text x="98" y="42.55" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">(krabice od cereálií), vystřihnout po něm</text>
<text x="98" y="46.15" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">šablona s oknem: výtisk nalepit na tenký karton,</text>
<text x="98" y="49.75" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">vystřihnout po obrysu, vyseknout okno (lekce 2 a 6)</text>
<text x="98" y="53.35" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">okno Ø 32 (plná čára)</text>
<text x="98" y="56.95" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">prstenec 4 mm – držení ověřit na odřezku</text>
<text x="98" y="60.55" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">mince Ø 40 (čárkovaně)</text>
<text x="98" y="64.15" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">čerchovaně osy – na líci jen propíchnout konce,</text>
<text x="98" y="67.75" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">na RUBU spojit a protáhnout až k okraji kůže</text>
<text x="98" y="71.35" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">pata důlku Ø 44 (tečkovaně)</text>
<text x="98" y="74.95" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">šev 31 otvorů od středu dna</text>
<text x="98" y="78.55" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">otvory švu prosekat PŘED tvarováním,</text>
<text x="98" y="82.15" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">na formě vystředit podle os, obrys</text>
<text x="98" y="85.75" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">vyříznout po zaschnutí podle orýsování,</text>
<text x="98" y="89.35" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">okno vyseknout před přišitím</text>
<text x="98" y="92.95" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">na přední panel: 35,55 mm pod horní hranou,</text>
<text x="98" y="96.55" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">8,5 mm od boků, otevřenou hranou nahoru</text>
<text x="98" y="100.15" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2e7d32">šrafa G1 = lepit na RUBU kapsy: pruh 3,5 mm</text>
<text x="98" y="103.75" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2e7d32">od okraje po čáru švu, boky a dno;</text>
<text x="98" y="107.35" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2e7d32">stejný pruh na líci předního panelu (list PÁS)</text>
<text x="55" y="81.1" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#2e7d32" stroke="#ffffff" stroke-width="0.5" paint-order="stroke">G1 · lepit na RUBU</text>
<text x="55" y="26.55" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#7a7a7a" stroke="#ffffff" stroke-width="0.5" paint-order="stroke">NElepit – sem se zasouvá mince</text>
<text x="13.5" y="119.45" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#2b2b2b">OTVOR FORMY PRO DŮLEK</text>
<path class="paper-cut-forma" d="M20 122.45 H80 V182.45 H20 Z" fill="none" stroke="#7a7a7a" stroke-width="0.25" stroke-dasharray="3 2"/>
<path d="M72 152.45 A22 22 0 1 0 28 152.45 A22 22 0 1 0 72 152.45 Z" fill="none" stroke="#2b2b2b" stroke-width="0.3"/>
<path d="M48.5 152.45 L51.5 152.45 M50 150.95 L50 153.95" stroke="#2b2b2b" stroke-width="0.25"/>
<path d="M24 152.45 H76 M50 126.45 V178.45" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 1 0.6 1"/>
<text x="88" y="128.45" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">čárkovaný čtverec 6 × 6 cm: vystřihnout po něm,</text>
<text x="88" y="132.05" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">křížek os je v jeho středu</text>
<text x="88" y="135.65" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">Ø 44 = mince 40 + 2 × kůže 1,2 + vůle 1,6</text>
<text x="88" y="139.25" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">deska ≥ 74 × 74 mm, tloušťka ≥ 8 mm</text>
<text x="88" y="142.85" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">překližka, dřevo nebo HDPE; hranu otvoru zaoblit smirkem</text>
<text x="88" y="146.45" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">osy otvoru narýsovat na desce až k jejím okrajům</text>
<text x="88" y="150.05" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">kůže LÍCEM DOLŮ na formu, osy na rubu na osy desky,</text>
<text x="88" y="153.65" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">mince na rub, přiklopit deskou, svěrky</text>
<path d="M13.5 252.5 V256.5 M13.5 254.5 H63.5 M63.5 252.5 V256.5" stroke="#2b2b2b" stroke-width="0.3" fill="none"/>
<text x="66.5" y="255.5" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: 50 mm</text>
<text x="13.5" y="262.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">POUZDRO NA KARTY S VSAZENOU MINCÍ – LIST KAPSA A FORMA.</text>
<text x="13.5" y="265.7" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Tisk na A4 na 100 % (bez „přizpůsobit stránce“); samostatný list na výšku.</text>
<text x="13.5" y="268.9" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Kapsa ze samostatné kůže 1,2 mm (i když je pás silnější); kus ≥ 70 × 70 mm.</text>
<text x="13.5" y="272.1" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Plná čára = řez, tečky = otvory stehu, čárkovaně/tečkovaně = pomocné kružnice, čárkovaný čtverec = vystřihnout papír.</text>
