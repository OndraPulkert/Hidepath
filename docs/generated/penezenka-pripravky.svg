" x="10" y="114.81" width="4.5" height="61.5" fill="none" stroke="#2e7d32" stroke-width="0.15" stroke-dasharray="0.6 0.6"/><rect class="glue-outline" x="34.5" y="114.81" width="2" height="61.5" fill="none" stroke="#2e7d32" stroke-width="0.15" stroke-dasharray="0.6 0.6"/><rect class="glue-outline" x="74.5" y="114.81" width="4.5" height="61.5" fill="none" stroke="#2e7d32" stroke-width="0.15" stroke-dasharray="0.6 0.6"/></g><text x="44.5" y="180.31" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#2e7d32">lepení na rubu zrcadlově: x_rub = 69 − x</text><path d="M124 279 L131 279" fill="none" stroke="#2e7d32" stroke-width="0.25"/></g><g id="GUIDE" inkscape:groupmode="layer" inkscape:label="GUIDE"><text x="10" y="15" font-family="Helvetica, Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="start" fill="#1f1f1f">LUSK · ZKUŠEBNÍ LUSK, TRN, PODLOŽKY</text><text x="10" y="20.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" text-anchor="start" fill="#1f1f1f">ZL 69 × 144,31 · T1 29/28,5 × 6 × 122 · D2 Ø 8 · list 3/3</text><text x="200" y="15" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="end" fill="#b3261e">NÁVRH – ověřit na prototypu</text><circle cx="55.5" cy="38" r="4" fill="none" stroke="#6f6f6f" stroke-width="0.15" stroke-dasharray="0.5 0.5"/><circle cx="55.5" cy="170.31" r="4" fill="none" stroke="#6f6f6f" stroke-width="0.15" stroke-dasharray="0.5 0.5"/><text x="22.5" y="58.5" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#6f6f6f">kus karet</text><text x="55.5" y="78.5" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#6f6f6f">LUSK</text><text x="55.5" y="129.81" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#6f6f6f">LUSK</text><text x="44.5" y="30" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="bold" text-anchor="middle" fill="#1f1f1f">ZL ZKUŠEBNÍ LUSK · useň 1,2 mm · 69 × 144,31</text><path d="M91 61 L124 61" fill="none" stroke="#6f6f6f" stroke-width="0.2" stroke-dasharray="1.5 1"/><text x="107.5" y="59.8" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#6f6f6f">ústí lusku</text><text x="107.5" y="44" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#1f1f1f">T1 TRN</text><text x="107.5" y="47.5" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#6f6f6f">překližka 6</text><text x="107.5" y="51" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#6f6f6f">poutko pod fólii</text><text x="107.5" y="69" font-family="Helvetica, Arial, sans-serif" font-size="1.9" text-anchor="middle" fill="#6f6f6f">29 u ústí</text><text x="107.5" y="154" font-family="Helvetica, Arial, sans-serif" font-size="1.9" text-anchor="middle" fill="#6f6f6f">28,5 u konce</text><text x="107.5" y="162" font-family="Helvetica, Arial, sans-serif" font-size="1.9" text-anchor="middle" fill="#1f1f1f">délka 122 (hloubka 97)</text><path d="M106.3 109.5 L108.7 109.5 M107.5 108.3 L107.5 110.7" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><text x="133" y="34.5" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#6f6f6f">bok</text><text x="137.5" y="156" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#6f6f6f">konec R3</text><text x="137.5" y="128" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#6f6f6f">hrany R1</text><text x="152" y="38" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="bold" text-anchor="start" fill="#1f1f1f">D2 PODLOŽKA PRAHU Ø 8</text><path d="M156.2 47 L157.8 47 M157 46.2 L157 47.8" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M167.2 47 L168.8 47 M168 46.2 L168 47.8" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M178.2 47 L179.8 47 M179 46.2 L179 47.8" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M156.2 58 L157.8 58 M157 57.2 L157 58.8" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M167.2 58 L168.8 58 M168 57.2 L168 58.8" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M178.2 58 L179.8 58 M179 57.2 L179 58.8" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><text x="152" y="69" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">useň 1,0 nebo 1,2 mm, výsečník Ø 8,</text><text x="152" y="72.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">4 ks + 2 náhradní; líc do dutiny,</text><text x="152" y="76" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">lepí se až po tvarování (krok 16).</text><text x="152" y="79.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">mezera prahu h = t_min − 0,5…0,8</text><text x="152" y="83" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">p₁ + p₂ = c − h = 6 − h</text><text x="152" y="88.6" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">Trn T1 = forma lusku</text><text x="152" y="92.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">překližka tl. c = 6 (změřit),</text><text x="152" y="95.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">šířka 29 u ústí → 28,5 u konce,</text><text x="152" y="99.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">délka 122 = 97 + 25 na držení,</text><text x="152" y="102.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">podélné hrany R1, konec R3 přes tloušťku,</text><text x="152" y="106.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">obalit fólií, poutko na horní konec.</text><text x="152" y="109.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">nejširší trn, který lusk pojme: 30,97</text><text x="152" y="115.2" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">Zkušební lusk ZL</text><text x="152" y="118.7" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">69 × 144,31, 3 švy (dělicí uvnitř),</text><text x="152" y="122.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">stěna 66,5 = 2 × 27,5 + 1,5 + 6 + 4,</text><text x="152" y="125.7" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">průzor u 30–52,5 na obou stěnách,</text><text x="152" y="129.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">postup jako kroky 7–16 celého kusu.</text><text x="152" y="134.8" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">ZL – lepení na rubu (x_rub od hrany L)</text><text x="152" y="138.3" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">levý (líc): 64,5–69, u 5–66,5</text><text x="152" y="141.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">dělicí: 42,5–44,5, u 5–66,5</text><text x="152" y="145.3" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">pravý (líc): 0–4,5, u 5–66,5</text><text x="152" y="150.9" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">Mince (výpočet, ověřit)</text><text x="152" y="154.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">po posunu palcem vyčnívá D − a_p:</text><text x="152" y="157.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">  Ø 27,5 → 13,5 mm, Ø 20 → 6 mm</text><text x="152" y="161.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">vrácení: stáhnout pod práh o 10 mm</text><text x="152" y="167" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">Maketa karetní zóny</text><text x="152" y="170.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">4 karty + papír 2 ve fólii = 5,04 mm</text><text x="152" y="174" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">(tenčí: 3 karty + papír, 13.4 #14)</text><path d="M10 261 L60 261" fill="none" stroke="#6f6f6f" stroke-width="0.4"/><path d="M10 258.5 L10 263.5" fill="none" stroke="#6f6f6f" stroke-width="0.3"/><path d="M60 258.5 L60 263.5" fill="none" stroke="#6f6f6f" stroke-width="0.3"/><path class="calibration" d="M10 261 L60 261" stroke="#6f6f6f" stroke-width="0.01"/><text x="35" y="257.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#1f1f1f">KONTROLNÍ ÚSEČKA 50 mm</text><text x="66" y="259.5" font-family="Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="start" fill="#1f1f1f">PRINT AT 100% / ACTUAL SIZE</text><text x="66" y="263.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Tisk na 100 % (skutečná velikost), vypnout „přizpůsobit stránce“ · měřítko 1:1</text><text x="10" y="269" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#6f6f6f">Po tisku změř úsečku pravítkem: musí mít přesně 50 mm, jinak střih nepoužívej.</text><text x="10" y="273" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#6f6f6f">ZL, T1 a D2. Trn je forma lusku: jeho tloušťka určuje dutinu c, podle ní se počítají podložky.</text><text x="18.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#1f1f1f">CUT řez</text><text x="56.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#b3261e">STITCH šev a otvory</text><text x="94.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#1f5fa8">FOLD ohyb</text><text x="132.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#2e7d32">GLUE lepení</text><path d="M162 279 L169 279" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="1.5 1"/><text x="170.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#6f6f6f">GUIDE značky, osy</text></g></svg>
