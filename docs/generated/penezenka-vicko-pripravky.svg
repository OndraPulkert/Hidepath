5" fill="#b3261e"/><circle cx="20" cy="38" r="0.45" fill="#b3261e"/><circle cx="24" cy="38" r="0.45" fill="#b3261e"/><circle cx="28" cy="38" r="0.45" fill="#b3261e"/><circle cx="28" cy="42" r="0.45" fill="#b3261e"/><circle cx="28" cy="46" r="0.45" fill="#b3261e"/><path d="M46 283 L53 283" fill="none" stroke="#b3261e" stroke-width="0.25" stroke-dasharray="0.8 0.6"/></g><g id="FOLD" inkscape:groupmode="layer" inkscape:label="FOLD"><path d="M12 171.1 L123 171.1" fill="none" stroke="#1f5fa8" stroke-width="0.5"/><text x="67.5" y="169.9" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#1f5fa8">tahle hrana do ohybu: na čáru hrany vložky v 64,18 (list 1 a 2)</text><path d="M84 283 L91 283" fill="none" stroke="#1f5fa8" stroke-width="0.25" stroke-dasharray="3 1.5"/></g><g id="GLUE" inkscape:groupmode="layer" inkscape:label="GLUE"><path d="M122 283 L129 283" fill="none" stroke="#2e7d32" stroke-width="0.25"/></g><g id="GUIDE" inkscape:groupmode="layer" inkscape:label="GUIDE"><text x="8" y="13" font-family="Helvetica, Arial, sans-serif" font-size="4.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">VÍČKO · ŠABLONY A PŘÍPRAVKY</text><text x="8" y="18" font-family="Helvetica, Arial, sans-serif" font-size="2.5" text-anchor="start" fill="#1f1f1f">konec jazýčku, okénka, plíšek, proužek otvorů, vložka dna, tvarování závěsu · list 4/4</text><text x="202" y="13" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="end" fill="#b3261e">NÁVRH – ověřit na prototypu</text><circle class="magnet" cx="22" cy="45" r="4" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M20.8 45 L23.2 45 M22 43.8 L22 46.2" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M21.2 42 L22.8 42 M22 41.2 L22 42.8" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M15.386 49.5 L28.614 49.5" fill="none" stroke="#6f6f6f" stroke-width="0.15" stroke-dasharray="0.5 0.5"/><path d="M10 35 L34 35 L34 57 L10 57 Z" fill="none" stroke="#6f6f6f" stroke-width="0.15" stroke-dasharray="1.5 1"/><text x="38" y="31" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="bold" text-anchor="start" fill="#1f1f1f">ŠABLONA KONCE JAZÝČKU</text><text x="38" y="34.5" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">šířka 20, špička R10: střed oblouku 10 nad špičkou,</text><text x="38" y="37.2" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">  tj. 3 nad středem magnetu</text><text x="38" y="39.9" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">střed magnetu Ø 8 7 nad špičkou (křížek)</text><text x="38" y="42.6" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">čárkovaně: ztenčit jen posledních 2,5 mm do klínu</text><text x="38" y="45.3" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">  (magnet začíná 3 mm od špičky)</text><text x="38" y="48" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">čárkovaný obdélník: přířez L1 24 × 22 (useň 0,6),</text><text x="38" y="50.7" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">  horní hrana 10 nad středem magnetu</text><text x="38" y="53.4" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">lekce 11: křížek magnetu na značku y z rámečku,</text><text x="38" y="56.1" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">  přilepit magnet a přes něj L1</text><text x="38" y="58.8" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">lekce 11: podle obrysu R10 seříznout jazýček</text><text x="38" y="61.5" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">  i s L1 najednou</text><text x="38" y="64.2" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">lekce 11: S7 – 8 červených otvorů (U kolem magnetu),</text><text x="38" y="66.9" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="start" fill="#1f1f1f">  ≥ 2,08 mm od magnetu; propíchnout přes šablonu</text><path d="M17 81.6 L19 81.6 M18 80.6 L18 82.6" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M17 117.6 L19 117.6 M18 116.6 L18 118.6" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M18 73.6 L18 125.6" fill="none" stroke="#6f6f6f" stroke-width="0.12" stroke-dasharray="1.5 1"/><text x="18" y="128.6" font-family="Helvetica, Arial, sans-serif" font-size="1.7" text-anchor="middle" fill="#6f6f6f">mince 12 × 48</text><text x="18" y="131.1" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#6f6f6f">2 ks, jen B, Ø 12</text><path d="M40 82.6 L42 82.6 M41 81.6 L41 83.6" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M40 113.6 L42 113.6 M41 112.6 L41 114.6" fill="none" stroke="#6f6f6f" stroke-width="0.2"/><path d="M41 73.6 L41 122.6" fill="none" stroke="#6f6f6f" stroke-width="0.12" stroke-dasharray="1.5 1"/><text x="41" y="125.6" font-family="Helvetica, Arial, sans-serif" font-size="1.7" text-anchor="middle" fill="#6f6f6f">bankovky 14 × 45</text><text x="41" y="128.1" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#6f6f6f">D2 + B po G3, Ø 14</text><text x="67" y="100.1" font-family="Helvetica, Arial, sans-serif" font-size="1.7" text-anchor="middle" fill="#6f6f6f">plíšek 14 × 20,5</text><text x="67" y="102.6" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#6f6f6f">rohy R3 brusným papírem</text><path d="M86 151.1 L92 151.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 147.1 L92 147.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 143.1 L92 143.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 139.1 L92 139.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 135.1 L92 135.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 131.1 L92 131.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 127.1 L92 127.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 123.1 L92 123.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 119.1 L92 119.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 115.1 L92 115.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 111.1 L92 111.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 107.1 L92 107.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 103.1 L92 103.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 99.1 L92 99.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 95.1 L92 95.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 91.1 L92 91.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 87.1 L92 87.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 83.1 L92 83.1" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M86 97.1 L96 97.1" fill="none" stroke="#6f6f6f" stroke-width="0.2" stroke-dasharray="1 0.6"/><path d="M86 133.1 L96 133.1" fill="none" stroke="#6f6f6f" stroke-width="0.2" stroke-dasharray="1 0.6"/><path d="M86 137.1 L96 137.1" fill="none" stroke="#6f6f6f" stroke-width="0.2" stroke-dasharray="0.4 0.6"/><text x="98" y="97.7" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="start" fill="#6f6f6f">F 62</text><text x="98" y="133.7" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="start" fill="#6f6f6f">dno karet 26</text><text x="98" y="139.5" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="start" fill="#6f6f6f">S1 22</text><text x="98" y="83.7" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="start" fill="#6f6f6f">poslední 76</text><text x="98" y="151.7" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="start" fill="#6f6f6f">první 8</text><text x="91" y="73.6" font-family="Helvetica, Arial, sans-serif" font-size="1.8" font-weight="bold" text-anchor="middle" fill="#1f1f1f">PROUŽEK S4/S5</text><text x="91" y="162.1" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#6f6f6f">spodní hrana</text><text x="118" y="76.6" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" text-anchor="start" fill="#1f1f1f">Čísla pro postup (platí pro tento list)</text><text x="118" y="79.15" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">P1 1,0 · ohyb dna 1,0 · závěs 1,0</text><text x="118" y="81.7" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">D1/D2 0,6 · L1 0,6 (změřené, lekce 1)</text><text x="118" y="85.525" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">kóta P1 na listu 1 (lekce 1, 4): 231,66</text><text x="118" y="88.075" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">osa ohybu, rýha (lekce 4, 5): v 62,21</text><text x="118" y="90.625" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">hrana vložky dna (lekce 3, 4, 7): v 64,18 (1,96 za rýhou)</text><text x="118" y="93.175" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">pás závěsu (lekce 4): v 142,99–150,99</text><text x="118" y="95.725" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">G3 jen do y 80,57 (lekce 6)</text><text x="118" y="98.275" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">plíšek y 3,5–24 (lekce 8, 11)</text><text x="118" y="100.825" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">G2 y 2–26, boky G2b do y 61 (lekce 8)</text><text x="118" y="103.375" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">S6 y 25 (lekce 8)</text><text x="118" y="105.925" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">hrana víčka A / B / C (lekce 10): 53,88 / 56,56 / 62,5</text><text x="118" y="108.475" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">  při k 1,24: A 53,24 / C 63,93</text><text x="118" y="111.025" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">  k = (y_C − y_A) / 8,62</text><text x="118" y="114.85" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" text-anchor="start" fill="#1f1f1f">Značka magnetu y_m,B (lekce 11): 11,9</text><text x="118" y="117.4" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">okno lepení 11,73–12,13 (šířka 0,4 mm)</text><text x="118" y="119.95" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">značku přeměřit posuvkou od spodní hrany</text><text x="67.5" y="177.1" font-family="Helvetica, Arial, sans-serif" font-size="2" font-weight="bold" text-anchor="middle" fill="#6f6f6f">VLOŽKA DNA aspoň 111 × 25 × 1,5</text><text x="67.5" y="180.6" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#6f6f6f">2 vrstvy starých karet (2 × 0,76 = 1,52), v každé 2 karty vedle sebe (171,2 ≥ 111)</text><text x="67.5" y="183.6" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#6f6f6f">hranu do ohybu u každé karty odstřihnout rovně o 4 mm (pryč zaoblené rohy), přebytek 60,2</text><text x="67.5" y="186.6" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#6f6f6f">ustřihnout v jedné vrstvě zleva, v druhé zprava; výšku nezkracovat (~50 ≥ 25); slepit páskou; na rub B, hranou k F</text><text x="67.5" y="190.1" font-family="Helvetica, Arial, sans-serif" font-size="1.5" text-anchor="middle" fill="#6f6f6f">nebo jiný rovný pás 1,5 mm · o 5 mm na každé straně širší než díl 101</text><text x="67.5" y="193.1" font-family="Helvetica, Arial, sans-serif" font-size="1.5" text-anchor="middle" fill="#6f6f6f">po vyschnutí ohybu vysunout bokem · ověřit na odřezku V12</text><text x="131" y="172.1" font-family="Helvetica, Arial, sans-serif" font-size="2.05" font-weight="bold" text-anchor="start" fill="#1f1f1f">Tvarování závěsu (lekce 10)</text><text x="131" y="174.65" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">bez kopyta a bez opěrky: formou je</text><text x="131" y="177.2" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">peněženka s obsahem stavu B</text><text x="131" y="179.75" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">(2 staré karty + místo bankovky papír</text><text x="131" y="182.3" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">  složený na ~0,7 mm podle posuvky,</text><text x="131" y="184.85" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">  obsah pod závěsem 3,42)</text><text x="131" y="187.4" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">navlhčit jen pás závěsu, víčko zavřít</text><text x="131" y="189.95" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">přes obsah, přes noc pod knihou</text><text x="131" y="193.775" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">otevřené víčko samo nestojí,</text><text x="131" y="196.325" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">u bankovek a mincí ho drží palec</text><text x="131" y="198.875" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">ruky, která peněženku drží</text><text x="131" y="201.425" font-family="Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="start" fill="#1f1f1f">posun víčka k změřit v lekci 10</text><path d="M8 266 L58 266" fill="none" stroke="#6f6f6f" stroke-width="0.4"/><path d="M8 263.5 L8 268.5" fill="none" stroke="#6f6f6f" stroke-width="0.3"/><path d="M58 263.5 L58 268.5" fill="none" stroke="#6f6f6f" stroke-width="0.3"/><path class="calibration" d="M8 266 L58 266" stroke="#6f6f6f" stroke-width="0.01"/><text x="33" y="262.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#1f1f1f">KONTROLNÍ ÚSEČKA 50 mm</text><text x="64" y="264.5" font-family="Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="start" fill="#1f1f1f">PRINT AT 100% / ACTUAL SIZE</text><text x="64" y="268.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Tisk na 100 % (skutečná velikost), vypnout „přizpůsobit stránce“ · měřítko 1:1</text><text x="8" y="273.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#6f6f6f">Po tisku změř úsečku pravítkem: musí mít přesně 50 mm, jinak střih nepoužívej.</text><text x="8" y="277.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#6f6f6f">Šablony se lepí na tvrdý papír a vyříznou. Poloha magnetu se určuje až na hotovém kusu (lekce 11).</text><text x="16.5" y="283.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#1f1f1f">CUT řez</text><text x="54.5" y="283.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#b3261e">STITCH šev a otvory</text><text x="92.5" y="283.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#1f5fa8">FOLD ohyb</text><text x="130.5" y="283.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#2e7d32">GLUE lepení</text><path d="M160 283 L167 283" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="1.5 1"/><text x="168.5" y="283.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#6f6f6f">GUIDE značky, osy</text></g></svg>
