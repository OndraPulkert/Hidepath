<text x="118" y="52" font-family="Helvetica, Arial, sans-serif" font-size="3.2" text-anchor="middle" fill="#a2471f">SPOJ 2: (přední+vnitřní) ↔ zadní</text>
<text x="118" y="57" font-family="Helvetica, Arial, sans-serif" font-size="3" text-anchor="middle" fill="#7a7a7a">(ohyb A spojuje přední a zadní; vnitřní je uvnitř)</text>
<text x="80" y="80" font-family="Helvetica, Arial, sans-serif" font-size="3" text-anchor="middle" fill="#2b2b2b">lepidlo jen na pruh 0–3,5 mm od hrany, tečky švu v 3,5 mm</text>
<text x="80" y="85" font-family="Helvetica, Arial, sans-serif" font-size="3" text-anchor="middle" fill="#7a7a7a">rozevřít asi do pravého úhlu, ne naplocho – suchý líc by mohl prasknout</text>
<text x="80" y="90" font-family="Helvetica, Arial, sans-serif" font-size="3" text-anchor="middle" fill="#7a7a7a">před přitlačením zarovnat jehlami přes otvory</text>
<text x="80" y="96" font-family="Helvetica, Arial, sans-serif" font-size="3" text-anchor="middle" fill="#7a7a7a">lepit po jednom spoji, druhý spoj počká</text>
