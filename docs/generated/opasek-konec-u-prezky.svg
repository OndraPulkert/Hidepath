<text x="22" y="255" font-family="Helvetica, Arial, sans-serif" font-size="2.9" fill="#6a6a6a">Délku odměř na SLOŽENÉM pásku, stupnice je na zkrácení. Kůže na poutko tenčí než pás (1,2–2 mm).</text>
<text x="22" y="262" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b">1. Přenes značky na rub pásu: ohyb, drážku i všechny čtyři otvory.</text>
<text x="22" y="266.4" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b">2. Vysekni 6mm otvory pro nýty, konce drážky 8mm průbojníkem a drážku mezi nimi vyřízni nožem.</text>
<text x="22" y="270.8" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b">3. Navlékni poutko na přehnutý konec. Teprve pak ohni konec kolem přezky.</text>
<text x="22" y="275.2" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b">4. Sešroubuj oba nýty. Poutko zůstane uvězněné v kapse mezi nimi.</text>
<text x="22" y="279.6" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b">Nýty: 2 kusy, každý prochází oběma vrstvami — proto jsou otvory čtyři.</text>
<text x="22" y="284" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b">Rozměry: drážka a Ø otvorů podle generátoru CraftPoint, polohy nýtů a délka konce podle šablony BFLG.</text>
<text x="22" y="288.4" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b">Zaoblení konce a rozměry poutka jsou volba této šablony — před řezáním ověř na odřezku.</text>
</svg>