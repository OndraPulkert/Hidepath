<text x="76" y="59.8" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b">nýt ± 73,2 mm od ohybu</text>
<text x="76" y="107.5" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b">nýt ± 25,5 mm od ohybu</text>
<text x="76" y="117" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b">drážka 40 × 8 mm, ohyb ji půlí</text>
<text x="76" y="133" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#c0392b">OHYB (příčka přezky)</text>
<text x="76" y="182.35" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#1f6f43">kapsa pro poutko 47,7 mm</text>
<text x="76" y="223" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b">konec pásu 90 mm od ohybu</text>
<text x="22" y="39" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#6a6a6a">sem pokračuje hlavní pás (nahoře neřezat)</text>
<text x="22" y="228" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b">Poutko — pásek 111 × 12 mm (obvod zdvojené části 96 mm + 15 mm přeplátování)</text>
