<text x="22" y="22" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#6a6a6a">Šířka pásu 40 mm · měřítko 1:1 · tisk na A4 na 100 %, bez „přizpůsobit stránce“</text>
<text x="150" y="24" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#c0392b">KALIBRAČNÍ ČTVEREC</text>
<text x="150" y="28" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#c0392b">po vytištění přeměř 50 × 50 mm</text>
