<text x="12" y="251.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">POUZDRO NA KARTY S VSAZENOU MINCÍ – střih 1:1, tisk na A4 na 100 % (bez „přizpůsobit stránce“). NÁVRH k ověření na papíru a odřezku.</text>
<text x="12" y="255.2" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Karta 54 × 85,6 (4 ks), mince Ø 40, kůže tělo 1,5 mm, kapsa 1,2 mm. Jazyk 33,49 mm od horní hrany zadního panelu.</text>
<text x="12" y="258.6" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Plná čára = řez. Tečky = otvory stehu, rozteč 4 mm, 3,5 mm od hrany; boční švy 21 otvorů na straně jazyka, 13 na straně výřezu, počítané od ohybu.</text>
<text x="12" y="262" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">ŠABLONU OBKRESLIT NA RUB (masnou stranu) kůže – lícem ven pak vyjde jazyk zepředu vpravo a výřez s průchodkou vlevo, jako u předlohy.</text>
<text x="12" y="265.4" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Pořadí: 1 tělo · 2 kapsa: navlhčit, LÍCEM DOLŮ na formu, mince, přiklopit, svěrky, nechat zaschnout · 3 vyříznout obrys kapsy · 4 vyseknout OKNO (kapsa lícem dolů na formě,</text>
<text x="12" y="268.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">pod dno špalík) · 5 přišít kapsu na předek (3 strany) · 6 přeložit, prošít boky · 7 průchodka · 8 druk: klobouček na jazyku až po zkoušce s kartami · 9 hrany.</text>
</svg>