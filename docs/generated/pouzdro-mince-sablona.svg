<text x="224.76" y="75" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">mince Ø 40 (čárkovaně) · pata důlku Ø 44 (tečkovaně)</text>
<text x="224.76" y="78" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">šev 31 otvorů od středu dna · prosekat PŘED tvarováním</text>
<text x="224.76" y="87" font-family="Helvetica, Arial, sans-serif" font-size="2.6" text-anchor="start" fill="#2b2b2b">OTVOR FORMY PRO DŮLEK</text>
