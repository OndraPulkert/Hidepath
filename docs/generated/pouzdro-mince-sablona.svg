<text x="127" y="172" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="middle" fill="#7a7a7a">otvor Ø 44 = mince + 2 × kůže 1,2 + vůle 1,6 · deska 74 × 74, tl. ≥ 8</text>
<text x="127" y="175.1" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="middle" fill="#7a7a7a">kůže LÍCEM DOLŮ na formu, mince na rub,</text>
<text x="127" y="177.9" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="middle" fill="#7a7a7a">hranu otvoru zaoblit (R1), přiklopit deskou, stáhnout svěrkami</text>
<path d="M12 277 V281 M12 279 H62 M62 277 V281" stroke="#2b2b2b" stroke-width="0.3" fill="none"/>
<text x="12" y="276" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: tato úsečka musí měřit přesně 50 mm</text>
<text x="12" y="250.1" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">POUZDRO NA KARTY S VSAZENOU MINCÍ – střih 1:1, tisk na A4 na 100 % (bez „přizpůsobit stránce“). NÁVRH k ověření na papíru a odřezku.</text>
<text x="12" y="253.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Karta 54 × 85,6 (4 ks), mince Ø 40, kůže tělo 1,5 mm, kapsa 1,2 mm. Jazyk 35,49 mm od horní hrany zadního panelu.</text>
<text x="12" y="256.9" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Plná čára = řez. Tečky = otvory stehu, rozteč 4 mm, 3,5 mm od hrany; boční švy 21 otvorů na straně jazyka, 13 na straně výřezu, počítané od ohybu.</text>
<text x="12" y="260.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">TĚLO OBKRESLIT NA RUB (masnou stranu) kůže – lícem ven pak vyjde jazyk zepředu vpravo a výřez s průchodkou vlevo, jako u předlohy. Kapsu obkreslit na LÍC (až po vytvarování, střed na důlku).</text>
<text x="12" y="263.7" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Tečky bočních švů = POČET a poloha od ohybu; otvory nepředsekávat na rubu – po přeložení a slepení boků orýsovat 3,5 mm od hrany na líci předku a prosekat obě vrstvy najednou, počítat od ohybu.</text>
<text x="12" y="267.1" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Pořadí: 1 tělo · 2 kapsa: navlhčit, LÍCEM DOLŮ na formu, mince, přiklopit, svěrky, nechat zaschnout · 3 vyříznout obrys kapsy · 4 vyseknout OKNO (kapsa lícem dolů na formě,</text>
<text x="12" y="270.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">pod dno špalík) · 5 přišít kapsu na předek (3 strany) · 6 přeložit, prošít boky · 7 průchodka · 8 druk: klobouček na jazyku až po zkoušce s kartami, pak jazyk zkrátit · 9 hrany.</text>
</svg>