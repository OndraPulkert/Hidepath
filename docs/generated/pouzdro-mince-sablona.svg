<text x="117.5" y="75.1" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="middle" fill="#7a7a7a">pata důlku Ø 44 (tečkovaně) · šev 31 otvorů od středu dna</text>
