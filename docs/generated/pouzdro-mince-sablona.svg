<text x="122" y="163" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="middle" fill="#7a7a7a">otvor Ø 44 = mince + 2 × kůže 1,2 + vůle 1,6 · deska 64 × 64, tl. ≥ 8</text>
