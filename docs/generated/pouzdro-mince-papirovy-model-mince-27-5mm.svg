<text x="10" y="176" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">PAPÍROVÝ MODEL – vystřihnout z tvrdšího papíru (160–200 g/m²), NE z kůže. Tisk na A4 NA ŠÍŘKU na 100 %. Obrys je stejný jako na listu pásu.</text>
<text x="10" y="179.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">☐ ① ohnout vnitřní panel dozadu za přední (ohyb B)   ☐ ② přehnout zadní panel přes všechno (ohyb A)   ☐ dno slepit páskou</text>
<text x="10" y="182.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">☐ vložit 4 karty do přední kapsy a bankovky složené napůl do zadní   ☐ obě boční hrany se ohnou bez tahu</text>
<text x="10" y="186.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">☐ přehnout jazyk přes horní hranu: klobouček padne na patici (poznamenat odchylku v mm)   ☐ průchodka je vidět ve výřezu zepředu i zezadu</text>
<text x="10" y="189.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">☐ palcem vysunout kartu výřezem   ☐ jazyk nepřekrývá místo pro kapsu s mincí   → teprve pak řezat kůži (list 1 a 2).</text>
