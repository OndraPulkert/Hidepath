<text x="80" y="92" font-family="Helvetica, Arial, sans-serif" font-size="3" text-anchor="middle" fill="#7a7a7a">Ohyb B (vpravo) spojuje přední s vnitřním, ohyb A (vlevo) přední se zadním.</text>
<text x="80" y="97" font-family="Helvetica, Arial, sans-serif" font-size="3" text-anchor="middle" fill="#7a7a7a">Nejdřív vnitřní za přední (ohyb B), pak zadní přes všechno (ohyb A).</text>
