<text x="224.76" y="114" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">deska ≥ 61,5 × 61,5, tl. ≥ 8 mm, hranu otvoru zaoblit</text>
<path d="M10 160 V164 M10 162 H60 M60 160 V164" stroke="#2b2b2b" stroke-width="0.3" fill="none"/>
<text x="63" y="163" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: tato úsečka musí měřit přesně 50 mm</text>
<text x="10" y="170" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">POUZDRO NA KARTY S VSAZENOU MINCÍ – střih 1:1, tisk na A4 NA ŠÍŘKU na 100 % (bez „přizpůsobit stránce“). NÁVRH k ověření na papíru a odřezku.</text>
<text x="10" y="173.2" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Karta 54 × 85,6 (4 ks) + bankovky složené na třetiny, mince Ø 27,5, kůže tělo 1,5 mm, kapsa 1,2 mm.</text>
<text x="10" y="176.4" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Jeden pás: ZADNÍ panel + ohyb A + PŘEDNÍ panel + ohyb B + VNITŘNÍ panel (dělí karty a bankovky, nese průchodku). Po složení jsou obě boční hrany OHYBY, šije se jen dno a horní hrana zůstává otevřená.</text>
<text x="10" y="179.6" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">PÁS OBKRESLIT NA LÍC (hladkou stranu) kůže – přední panel je nakreslený tak, jak bude vidět. Jazyk pak vyjde zepředu vpravo (zezadu vlevo), výřez naproti němu.</text>
<text x="10" y="182.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Plná čára = řez, čárkovaně = ohyb, tečky = otvory stehu (rozteč 4 mm). Otvory dna se sekají až po složení, skrz všechny vrstvy najednou.</text>
<text x="10" y="186" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Pořadí: 1 pás + odřezek na kapsu · 2 důlek za mokra (kůže LÍCEM DOLŮ na formu) · 3 obrys kapsy a OKNO · 4 přišít kapsu na přední panel, patice druku · 5 složit (vnitřní za přední, zadní přes vše)</text>
<text x="10" y="189.2" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">· 6 prošít dno · 7 průchodka do vnitřního panelu a šňůrka · 8 klobouček druku až po zkoušce s kartami i bankovkami, pak jazyk zkrátit · 9 srazit a zaleštit hrany.</text>
</svg>