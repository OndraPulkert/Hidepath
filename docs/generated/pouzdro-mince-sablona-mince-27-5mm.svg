<text x="224.76" y="62.5" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">mince Ø 27,5 (čárkovaně) · pata důlku Ø 31,5 (tečkovaně)</text>
<text x="224.76" y="65.5" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">šev 23 otvorů od středu dna · prosekat PŘED tvarováním</text>
<text x="224.76" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" text-anchor="start" fill="#2b2b2b">OTVOR FORMY PRO DŮLEK</text>
