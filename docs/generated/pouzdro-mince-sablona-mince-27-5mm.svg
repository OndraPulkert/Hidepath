<text x="12" y="251" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">POUZDRO NA KARTY S VSAZENOU MINCÍ – střih 1:1, tisk na A4 na 100 % (bez „přizpůsobit stránce“).</text>
<text x="12" y="254.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">NÁVRH k ověření na papíru a odřezku. Karta 54 × 85,6, mince Ø 27,5, kůže tělo 1,5 mm, kapsa 1,2 mm.</text>
<text x="12" y="257.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Plná čára = řez. Tečky = otvory stehu, rozteč 4 mm, 3,5 mm od hrany; boční švy začínají u ohybu, aby díly lícovaly (18 otvorů na stranu).</text>
<text x="12" y="261.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Pořadí: 1 vyříznout tělo a dělicí panel · 2 kapsu: navlhčit, vytvarovat důlek ve formě přes minci, nechat zaschnout, PAK vyříznout obrys ·</text>
<text x="12" y="264.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">3 přišít kapsu na přední panel (3 strany) · 4 vyříznout okno · 5 vložit dělicí panel, přeložit, prošít boky · 6 druk · 7 hrany. Karta vyčnívá 10 mm.</text>
</svg>