<text x="22" y="24" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#6a6a6a" text-anchor="start">Měřítko 1:1 · tisk na A4 na 100 %, bez „přizpůsobit stránce“ · 4 otvory = 2 nýty</text>
<text x="146" y="18" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#c0392b" text-anchor="start">KALIBRAČNÍ ČTVEREC</text>
