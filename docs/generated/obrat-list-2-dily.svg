<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1d1d1d}
.t{font-size:5px;font-weight:bold}.h{font-size:3.6px;font-weight:bold}.s{font-size:3px}.xs{font-size:2.5px}
.id{font-size:9px;font-weight:bold;fill:#9a9a9a}
.cut{fill:none;stroke:#000;stroke-width:.3}
.seam{fill:none;stroke:#333;stroke-width:.25;stroke-dasharray:1 1}
.fold{fill:none;stroke:#1f5fa8;stroke-width:.3;stroke-dasharray:4 1 1 1}
.position{fill:none;stroke:#1d7a6c;stroke-width:.25;stroke-dasharray:2.5 1 .5 1}
.trim{fill:none;stroke:#8a5a00;stroke-width:.25;stroke-dasharray:3 2}
.glue{fill:url(#hatch);stroke:none}
.paper{fill:none;stroke:#555;stroke-width:.25;stroke-dasharray:.6 .6}
.cap{fill:none;stroke:#b0441c;stroke-width:.2;stroke-dasharray:.8 .6}
.hole{fill:#fff;stroke:#b0441c;stroke-width:.3}
.cross{stroke:#b0441c;stroke-width:.2}
</style>
<defs><pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2" stroke="#c9c9c9" stroke-width=".6"/></pattern></defs><rect width="210" height="297" fill="#fff"/><text x="15" y="19" class="t" text-anchor="start">OBRAT R11 · LIST 2 · T2, P, T3, K</text><text x="15" y="25" class="s" text-anchor="start">Tisk A4 na výšku, 100 %, bez přizpůsobení. Obě kontrolní úsečky musí měřit 50 mm.</text><text x="15" y="29" class="s" text-anchor="start">T2 a T3 přiložte na LÍC, P a K na RUB. Otvory patic vysekněte skrz list i kůži,</text><text x="15" y="33" class="s" text-anchor="start">nebo jen propíchněte (lekce 4); kroužky v rozích zářezů P vždy vysekněte.</text><g transform="translate(20 38)"><path class="glue" d="M0 35 V75 H108 V35 H103 V70 H5 V35 Z M5 37 H46 V42 H5 Z M62 37 H103 V42 H62 Z"/><path class="cut" d="M0 0 H30 C36 0 34 23 40 23 H68 C74 23 72 0 78 0 H108 V69 Q108 75 102 75 H6 Q0 75 0 69 Z"/><path class="seam" d="M3.5 3 L3.5 69 Q3.5 71.5 6 71.5 L102 71.5 Q104.5 71.5 104.5 69 L104.5 3"/><circle class="cap" cx="88" cy="10.5" r="6"/><path class="cross" d="M85 10.5H91M88 7.5V13.5"/><circle class="hole" cx="88" cy="10.5" r="0.6"/><text x="88" y="19.5" class="xs" text-anchor="middle">C – patice</text><text x="54" y="52" class="id" text-anchor="middle">T2</text><text x="54" y="57" class="s" text-anchor="middle">LÍC nahoru · přední stěna, 1 ×</text><text x="54" y="63" class="xs" text-anchor="middle">šrafa na líci: zdrsnit a přilepit P (lekce 8)</text><text x="54" y="66.5" class="xs" text-anchor="middle">rub: lepené pásy jako na T1 (boky a dno 5 mm)</text></g><text x="18.8" y="116.6" class="xs" text-anchor="end">R6</text><text x="129.2" y="116.6" class="xs" text-anchor="start">R6</text><g transform="translate(20 124)"><path class="glue" d="M0 26 V66 H108 V26 H104 V62 H4 V26 Z M40 26 H68 V62 H40 Z"/><path class="cut" d="M10.004 3.969 Q10.5 0 14.5 0 L93.5 0 Q97.5 0 97.996 3.969 L100.5 24 L100.5 26 L107 26 Q108 26 108 27 L108 60 Q108 66 102 66 L6 66 Q0 66 0 60 L0 27 Q0 26 1 26 L7.5 26 L7.5 24 Z"/><path class="fold" d="M7.5 24 H100.5"/><path class="position" d="M8.5 26 H99.5"/><path class="seam" d="M3.5 28 L3.5 60 Q3.5 62.5 6 62.5 L102 62.5 Q104.5 62.5 104.5 60 L104.5 28"/><path class="seam" d="M40.5 29 V57 M67.5 29 V57"/><circle class="hole" cx="7.5" cy="26" r="1"/><circle class="hole" cx="100.5" cy="26" r="1"/><text x="54" y="8" class="id" text-anchor="middle">P</text><text x="54" y="13" class="s" text-anchor="middle">RUB nahoru · zadní díl + víčko, 1 ×</text><text x="54" y="16.6" class="s" text-anchor="middle">šrafa = lepidlo pro T3 (rub na rub)</text><text x="54" y="22.8" class="xs" text-anchor="middle">víčko: rezerva 4 mm, seříznout na 20 mm (lekce 6)</text><text x="22" y="40" class="xs" text-anchor="middle">dutina</text><text x="86" y="40" class="xs" text-anchor="middle">dutina</text></g><text x="118.7" y="122.8" class="xs" text-anchor="start">R4</text><text x="29.3" y="122.8" class="xs" text-anchor="end">R4</text><text x="129.2" y="193.6" class="xs" text-anchor="start">R6</text><text x="18.8" y="193.6" class="xs" text-anchor="end">R6</text><text x="74" y="194.5" class="xs" text-anchor="middle">P: rohy dna R6, u zářezů R1, víčko R4, konce víčka šikmo · líc P se lepí na T2</text><g transform="translate(20 200)"><path class="cut" d="M0 1 Q0 0 1 0 L107 0 Q108 0 108 1 L108 34 Q108 40 102 40 L6 40 Q0 40 0 34 Z"/><path class="seam" d="M3.5 2 L3.5 34 Q3.5 36.5 6 36.5 L102 36.5 Q104.5 36.5 104.5 34 L104.5 2"/><path class="seam" d="M40.5 3 V31 M67.5 3 V31"/><circle class="cap" cx="54" cy="8" r="6"/><path class="cross" d="M51 8H57M54 5V11"/><circle class="hole" cx="54" cy="8" r="0.6"/><text x="54" y="17" class="xs" text-anchor="middle">B – patice</text><text x="22" y="16" class="id" text-anchor="middle">T3</text><text x="22" y="21" class="s" text-anchor="middle">LÍC nahoru</text><text x="22" y="24.6" class="s" text-anchor="middle">předek kapsy, 1 ×</text><text x="86" y="17" class="xs" text-anchor="middle">U-linii jen prorazit,</text><text x="86" y="20.5" class="xs" text-anchor="middle">šije se s tělem (lekce 8)</text></g><text x="18.8" y="243.6" class="xs" text-anchor="end">R6</text><text x="129.2" y="243.6" class="xs" text-anchor="start">R6</text><text x="74" y="244.5" class="xs" text-anchor="middle">T3: rohy dna R6, nahoře R1</text><g transform="translate(20 248)"><path class="cut" d="M0 8.5 A8.5 8.5 0 1 0 17 8.5 A8.5 8.5 0 1 0 0 8.5 Z"/><text x="8.5" y="10.5" class="id" text-anchor="middle">K</text></g><circle class="paper" cx="47.5" cy="256.5" r="6.5"/><text x="58" y="254" class="xs" text-anchor="start">K – kryt patice C, Ø 17, z kůže, 1 × (lekce 7).</text><text x="58" y="257.6" class="xs" text-anchor="start">Tečkované kolečko Ø 13 jen z papíru: měrka objímek.</text><text x="136" y="42" class="h" text-anchor="start">Pořadí</text><text x="136" y="48" class="s" text-anchor="start">1. Kroužky v rozích zářezů P a B</text><text x="139" y="52" class="s" text-anchor="start">vyseknout (nebo propíchnout, lekce 4),</text><text x="139" y="56" class="s" text-anchor="start">pak P a T3 vyříznout.</text><text x="136" y="60" class="s" text-anchor="start">2. Rub P: ohyb a ústí T3 přenést; hrany</text><text x="139" y="64" class="s" text-anchor="start">ústí T3, zářezů a víčka dokončit.</text><text x="136" y="68" class="s" text-anchor="start">3. Líc P zdrsnit v pásech pro T2 (boky,</text><text x="139" y="72" class="s" text-anchor="start">dno, horní pás) – před dělicími švy.</text><text x="136" y="76" class="s" text-anchor="start">4. Patice B do T3; T3 lepit na rub P jen</text><text x="139" y="80" class="s" text-anchor="start">na šrafu (pásy 4 mm, pole s B), přes noc.</text><text x="136" y="84" class="s" text-anchor="start">5. Dělicí švy ušít, U-linii jen prorazit.</text><text x="136" y="88" class="s" text-anchor="start">6. Víčko ohnout navlhko, seříznout,</text><text x="139" y="92" class="s" text-anchor="start">objímka B podle obtisku.</text><text x="136" y="96" class="s" text-anchor="start">7. Zkouška s pomocnou nití (lekce 6).</text><text x="136" y="100" class="s" text-anchor="start">8. T2: patice C, kryt K na rub.</text><text x="136" y="104" class="s" text-anchor="start">9. Lekce 8: líc T2 zdrsnit; T2 na T1,</text><text x="139" y="108" class="s" text-anchor="start">přes noc; pak modul na T2, přes noc;</text><text x="139" y="112" class="s" text-anchor="start">U-šev jednou nití.</text><text x="136" y="120" class="s" text-anchor="start">Polohy a ohyby jen na rubu. Na líci jen</text><text x="136" y="124" class="s" text-anchor="start">linie stehu a pásy, které zakryje P.</text><text x="136" y="137" class="h" text-anchor="start">Legenda</text><path class="cut" d="M136 142H146"/><text x="149" y="143" class="xs" text-anchor="start">řez</text><path class="seam" d="M136 147H146"/><text x="149" y="148" class="xs" text-anchor="start">linie stehu (vidličky)</text><path class="fold" d="M136 152H146"/><text x="149" y="153" class="xs" text-anchor="start">ohyb – rýsovat jen na rubu</text><path class="position" d="M136 157H146"/><text x="149" y="158" class="xs" text-anchor="start">poloha dílu – jen na rubu</text><path class="trim" d="M136 162H146"/><text x="149" y="163" class="xs" text-anchor="start">klopa po seříznutí – orientačně</text><rect class="glue" x="136" y="165" width="10" height="4"/><text x="149" y="168" class="xs" text-anchor="start">lepidlo</text><circle class="cap" cx="141" cy="172" r="2.5"/><circle class="hole" cx="141" cy="172" r="0.6"/><text x="149" y="173" class="xs" text-anchor="start">patice: střed, čárkovaně klobouček</text><circle class="hole" cx="141" cy="177" r="1"/><text x="149" y="178" class="xs" text-anchor="start">otvor Ø 2 – vyseknout před řezem</text><path class="cut" d="M122 276H172M122 274V278M172 274V278"/><text x="122" y="281" class="s" text-anchor="start">Kontrola 50 mm vodorovně</text><path class="cut" d="M184 276V226M182 276H186M182 226H186"/><text x="182" y="252" class="xs" text-anchor="end">svisle 50</text></svg>
