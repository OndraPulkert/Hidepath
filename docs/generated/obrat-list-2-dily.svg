<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1d1d1d}
.t{font-size:5px;font-weight:bold}.h{font-size:3.6px;font-weight:bold}.s{font-size:3px}.xs{font-size:2.5px}
.id{font-size:9px;font-weight:bold;fill:#9a9a9a}
.cut{fill:none;stroke:#000;stroke-width:.3}
.seam{fill:none;stroke:#333;stroke-width:.25;stroke-dasharray:1 1}
.fold{fill:none;stroke:#1f5fa8;stroke-width:.3;stroke-dasharray:4 1 1 1}
.position{fill:none;stroke:#1d7a6c;stroke-width:.25;stroke-dasharray:2.5 1 .5 1}
.trim{fill:none;stroke:#8a5a00;stroke-width:.25;stroke-dasharray:3 2}
.glue{fill:url(#hatch);stroke:none}
.cap{fill:none;stroke:#b0441c;stroke-width:.2;stroke-dasharray:.8 .6}
.hole{fill:#fff;stroke:#b0441c;stroke-width:.3}
.cross{stroke:#b0441c;stroke-width:.2}
</style>
<defs><pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2" stroke="#c9c9c9" stroke-width=".6"/></pattern></defs><rect width="210" height="297" fill="#fff"/><text x="15" y="16" class="t" text-anchor="start">OBRAT R10 · LIST 2 · T2, P, T3, K</text><text x="15" y="22" class="s" text-anchor="start">Tisk A4 na výšku, 100 %, bez přizpůsobení. Obě kontrolní úsečky musí měřit 50 mm.</text><text x="15" y="26" class="s" text-anchor="start">T2 a T3 přiložte na LÍC, P a K na RUB. Otvory patic vysekněte skrz list i kůži,</text><text x="15" y="30" class="s" text-anchor="start">nebo jen propíchněte (lekce 4); kroužek v zářezu P vždy vysekněte.</text><g transform="translate(15 36)"><path class="glue" d="M102 33 H108 V75 H102 Z"/><path class="cut" d="M0 0 H30 C36 0 34 23 40 23 H68 C74 23 72 0 78 0 H108 V69 Q108 75 102 75 H6 Q0 75 0 69 Z"/><path class="seam" d="M3.5 3 L3.5 69 Q3.5 71.5 6 71.5 L102 71.5 Q104.5 71.5 104.5 69 L104.5 3"/><circle class="cap" cx="12" cy="62.25" r="6"/><path class="cross" d="M9 62.25H15M12 59.25V65.25"/><circle class="hole" cx="12" cy="62.25" r="0.6"/><text x="18.8" y="63.25" class="xs" text-anchor="start">A – patice</text><circle class="cap" cx="88" cy="10.5" r="6"/><path class="cross" d="M85 10.5H91M88 7.5V13.5"/><circle class="hole" cx="88" cy="10.5" r="0.6"/><text x="94.8" y="11.5" class="xs" text-anchor="start">C – patice</text><text x="54" y="36" class="id" text-anchor="middle">T2</text><text x="54" y="41" class="s" text-anchor="middle">LÍC nahoru</text><text x="54" y="44.6" class="s" text-anchor="middle">přední stěna, 1 ×</text><text x="101" y="30" class="xs" text-anchor="end">konec P</text><text x="54" y="52" class="xs" text-anchor="middle">rub: lepené pásy jako na T1 (bok a dno 5 mm, vpravo 6 mm)</text></g><text x="13.8" y="114.6" class="xs" text-anchor="end">R6</text><text x="124.2" y="114.6" class="xs" text-anchor="start">R6</text><text x="126.2" y="120.8" class="xs" text-anchor="start">R4</text><text x="126.2" y="191.6" class="xs" text-anchor="start">R6</text><text x="13.8" y="191.6" class="xs" text-anchor="end">R6</text><text x="70" y="192.5" class="xs" text-anchor="middle">P: rohy u zářezu R1 a R4, konec víčka šikmo</text><text x="113.5" y="238" class="xs" text-anchor="start">T3: rohy R2, u ústí R1</text><g transform="translate(15 122)"><path class="glue" d="M0 24 H6 V66 H0 Z"/><path class="glue" d="M8.5 26 H12.5 V65 H8.5 Z"/><path class="glue" d="M8.5 62 H87.5 V66 H8.5 Z"/><path class="glue" d="M83.5 26 H87.5 V65 H83.5 Z"/><path class="glue" d="M83.5 26 H104 V44 H83.5 Z"/><path class="cut" d="M0 25 Q0 24 1 24 L7.5 24 L9.586 3.978 Q10 0 14 0 L106 0 Q110 0 110 4 L110 60 Q110 66 104 66 L6 66 Q0 66 0 60 Z"/><path class="fold" d="M7.5 24 H110"/><path class="seam" d="M3.5 27 V62.5"/><path class="position" d="M104 26 L8.5 26 L8.5 66 L87.5 66 L87.5 44 L104 44 Z"/><circle class="hole" cx="7.5" cy="23" r="1"/><text x="30" y="9" class="id" text-anchor="middle">P</text><text x="30" y="14" class="s" text-anchor="middle">RUB nahoru · pás + víčko, 1 ×</text><text x="104" y="10" class="xs" text-anchor="end">VÍČKO · objímka B podle obtisku</text><text x="106" y="62" class="xs" text-anchor="end">A podle obtisku</text><text x="47" y="53" class="xs" text-anchor="middle">T3: lepit jen šrafu (pásy 4 mm a jazýček)</text></g><text x="18" y="120.5" class="xs" text-anchor="start">závěs (šije se s tělem)</text><text x="123" y="120.5" class="xs" text-anchor="end">volný konec · A</text><g transform="translate(15 199)"><path class="cut" d="M95.5 1 Q95.5 0 94.5 0 L1 0 Q0 0 0 1 L0 38 Q0 40 2 40 L77 40 Q79 40 79 38 L79 20 Q79 18 81 18 L93.5 18 Q95.5 18 95.5 16 Z"/><path class="seam" d="M3.5 3 V36.5 H75.5 V3"/><path class="seam" d="M39.5 3 V36.5"/><circle class="cap" cx="87.5" cy="8" r="6"/><path class="cross" d="M84.5 8H90.5M87.5 5V11"/><circle class="hole" cx="87.5" cy="8" r="0.6"/><text x="94.3" y="9" class="xs" text-anchor="start">B – patice</text><text x="21" y="18" class="id" text-anchor="middle">T3</text><text x="21" y="23" class="s" text-anchor="middle">LÍC nahoru</text><text x="21" y="26.6" class="s" text-anchor="middle">předek mincí, 1 ×</text></g><g transform="translate(15 244)"><path class="cut" d="M0 6.5 A6.5 6.5 0 1 0 13 6.5 A6.5 6.5 0 1 0 0 6.5 Z"/><text x="6.5" y="8.5" class="id" text-anchor="middle">K</text></g><g transform="translate(32 242)"><path class="cut" d="M0 8.5 A8.5 8.5 0 1 0 17 8.5 A8.5 8.5 0 1 0 0 8.5 Z"/><text x="8.5" y="10.5" class="id" text-anchor="middle">K</text></g><text x="53" y="249" class="xs" text-anchor="start">K – kryty patic: Ø 13 na A, Ø 17 na C (lekce 7);</text><text x="53" y="253" class="xs" text-anchor="start">menší kolečko K slouží i na kontrolu objímek</text><text x="130" y="40" class="h" text-anchor="start">Pořadí</text><text x="130" y="46" class="s" text-anchor="start">1. Kroužek v zářezu P vyseknout, B vyseknout</text><text x="130" y="50" class="s" text-anchor="start">    nebo propíchnout (lekce 4), pak P a T3 vyříznout.</text><text x="130" y="54" class="s" text-anchor="start">2. Ústí T3 a víčko: hrany dokončit.</text><text x="130" y="58" class="s" text-anchor="start">3. Patice B do jazýčku T3.</text><text x="130" y="62" class="s" text-anchor="start">4. T3 přilepit do polohy na rubu P,</text><text x="130" y="66" class="s" text-anchor="start">    lepidlo v pásech 4 mm a na jazýček.</text><text x="130" y="70" class="s" text-anchor="start">5. Šít švy dutin T3.</text><text x="130" y="74" class="s" text-anchor="start">6. Víčko ohnout k T3, B podle obtisku.</text><text x="130" y="78" class="s" text-anchor="start">7. T2: patice A a C, kryty K.</text><text x="130" y="82" class="s" text-anchor="start">8. Tělo: konec P na zdrsněný pruh T2.</text><text x="130" y="86" class="s" text-anchor="start"></text><text x="130" y="90" class="s" text-anchor="start">Na líci nic nepropichujte:</text><text x="130" y="94" class="s" text-anchor="start">polohy a ohyby jen na rubu,</text><text x="130" y="98" class="s" text-anchor="start">otvory patic zmizí pod kováním.</text><text x="130" y="107" class="h" text-anchor="start">Legenda</text><path class="cut" d="M130 112H140"/><text x="144" y="113" class="s" text-anchor="start">řez</text><path class="seam" d="M130 117H140"/><text x="144" y="118" class="s" text-anchor="start">linie stehu (vidličky)</text><path class="fold" d="M130 122H140"/><text x="144" y="123" class="s" text-anchor="start">ohyb – rýsovat jen na rubu</text><path class="position" d="M130 127H140"/><text x="144" y="128" class="s" text-anchor="start">poloha dílu – jen na rubu</text><path class="trim" d="M130 132H140"/><text x="144" y="133" class="s" text-anchor="start">klopa po seříznutí – orientačně</text><rect class="glue" x="130" y="135" width="10" height="4"/><text x="144" y="138" class="s" text-anchor="start">lepidlo</text><circle class="cap" cx="135" cy="142" r="2.5"/><circle class="hole" cx="135" cy="142" r="0.6"/><text x="144" y="143" class="s" text-anchor="start">střed otvoru patice (čárkovaně klobouček)</text><circle class="hole" cx="135" cy="147" r="1"/><text x="144" y="148" class="s" text-anchor="start">odlehčovací otvor Ø 2 – vyseknout před řezem</text><path class="cut" d="M122 280H172M122 278V282M172 278V282"/><text x="122" y="285" class="s" text-anchor="start">Kontrola 50 mm vodorovně</text><path class="cut" d="M184 280V230M182 280H186M182 230H186"/><text x="182" y="256" class="xs" text-anchor="end">svisle 50</text></svg>
