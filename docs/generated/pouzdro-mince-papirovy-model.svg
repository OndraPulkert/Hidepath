<text x="246.728" y="15.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#2b2b2b">ZAPSAT PŘI ZKOUŠCE</text>
<text x="246.728" y="18.9" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">1 klobouček: kolik mm od značky,</text>
<text x="249.228" y="22.3" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">kterým směrem, kolik jazyka zbývá</text>
<text x="249.228" y="25.7" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">(cíl 11 + rezerva)</text>
<text x="246.728" y="29.1" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">2 karta ve výřezu (cíl 19 mm)</text>
<text x="246.728" y="32.5" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">3 bankovky: které jdou napůl</text>
<text x="249.228" y="35.9" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">a kolik přečnívají (mm)</text>
<text x="246.728" y="39.3" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">4 konec jazyka ↔ kapsa (mm)</text>
<text x="246.728" y="42.7" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="start" fill="#7a7a7a">5 počet karet a tloušťka bankovek</text>
<text x="56" y="152.5" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="middle" fill="#2b2b2b">ZADNÍ PANEL</text>
