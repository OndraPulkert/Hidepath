<text x="144.63" y="152.5" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="middle" fill="#2b2b2b">PŘEDNÍ PANEL</text>
<text x="144.63" y="155.9" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="middle" fill="#7a7a7a">tahle strana ven (zepředu)</text>
<text x="226.55" y="152.5" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="middle" fill="#2b2b2b">VNITŘNÍ PANEL</text>
<text x="226.55" y="155.9" font-family="Helvetica, Arial, sans-serif" font-size="2.1" text-anchor="middle" fill="#7a7a7a">dělí karty a bankovky</text>
<path d="M13.5 165.5 V169.5 M13.5 167.5 H63.5 M63.5 165.5 V169.5" stroke="#2b2b2b" stroke-width="0.3" fill="none"/>
<text x="66.5" y="168.5" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: 50 mm</text>
<text x="13.5" y="175.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">PAPÍROVÝ MODEL – NE z kůže. Tisk na A4 NA ŠÍŘKU na 100 %, obrys je stejný jako list pásu. Výtisk nalepit na tenký karton (krabice od cereálií), aby model po složení a naplnění držel tvar.</text>
<text x="13.5" y="178.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Model pro: mince Ø 27,5, kůže tělo 1,5 mm (ohyb B ztenčit na 1 mm).</text>
<text x="13.5" y="182.3" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Prokáže: polohu jazyka a kloboučku, výřez, vytahování karty a místo pro kapsu. Neprokáže přídavky ohybů (papír je tenčí než kůže): ohyby jen přehnout do smyčky, nepřekládat na ostro.</text>
<text x="13.5" y="185.7" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">☐ ① vnitřní panel dozadu za přední (ohyb B)   ☐ ② zadní přes všechno (ohyb A); dno na dno   ☐ dno slepit páskou podél čáry švu   ☐ vložit 4 karty vpředu a bankovky napůl vzadu</text>
<text x="13.5" y="189.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">☐ před ohybem ① propíchnout oba křížky u šipky a na kartonu je spojit tužkou: na tu čáru dosedne okraj vnitřního panelu   ☐ okraj zadního panelu ke smyčce ohybu B</text>
<text x="13.5" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">☐ přehnout jazyk přes horní hranu, patici propíchnout do jazyka a změřit odchylku od kloboučku</text>
<text x="13.5" y="195.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">☐ palcem vysunout kartu výřezem   ☐ konec jazyka je nad místem pro kapsu   → výsledky zapsat vpravo nahoře, teprve pak řezat kůži (listy PÁS a KAPSA).</text>
</svg>