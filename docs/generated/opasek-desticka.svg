     Otvory Ø 2 mm = znacici, neslucovat a nezvetsovat.
     Otvor Ø 4 mm v rohu = zaveseni.
     Vrstva "cut" (#000000) = REZ, vrstva "engrave" (#0000ff) = GRAVIROVANI.
