<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><title>Cvičný proužek pro lekci 4 – pouzdro s vsazenou mincí, kůže 1,2 mm</title><rect width="210" height="297" fill="#ffffff"/><text x="10" y="15" font-family="Helvetica, Arial, sans-serif" font-size="4.4" font-weight="bold" text-anchor="start" fill="#2b2b2b">CVIČNÝ PROUŽEK PRO LEKCI 4 – SKLÁDÁNÍ A ŠEV TŘÍ VRSTEV</text><text x="10" y="20.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" text-anchor="start" fill="#2b2b2b">Pouzdro s vsazenou mincí · KŮŽE TĚLA 1,2 mm · ohyby se neztenčují · cvičný odřezek, ne díl pouzdra</text><text x="10" y="27" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#2b2b2b">Postup (lekce 4) – stejně jako u pásu v lekci 5</text><text x="10" y="31" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">1. Tiskněte na 100 % a změřte kontrolní úsečku dole: přesně 50 mm. Tloušťka kůže v nadpisu musí sedět na vaši kůži.</text><text x="10" y="34.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">2. Proužek vystřihněte nůžkami nahrubo po čárkované čáře (okraj asi 1,5 cm), jen dole přesně po plné dolní čáře obrysu.</text><text x="10" y="37.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">3. Dolní hranu listu přiložte přesně na rovnou dolní hranu kusu kůže (kus i proužek jsou 40 mm vysoké), po délce obrys vystřeďte.</text><text x="10" y="41.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">4. Přilepte ho maskovací páskou na LÍC kůže – páska jen na okrajích papíru, mimo plnou čáru.</text><text x="10" y="44.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">5. Pravítkem ověřte, že kroužky na koncích čáry švu leží 3,5 mm od dolní hrany kůže; když ne, list přiložte znovu.</text><text x="10" y="48" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">6. Šídlem propíchněte skrz papír i kůži všechny kroužky (konce čar ohybů a čáry švu) a všechny tečky dna – musí být vidět i na rubu.</text><text x="10" y="51.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">7. Řežte nožem skrz papír i kůži po plné čáře, s ocelovým pravítkem. Pásku strhávejte pomalu.</text><text x="10" y="54.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">8. Na RUBU spojte propíchnuté konce čar ohybů tužkou podle pravítka.</text><path class="rough-margin" d="M10 62 H154.35 V132 H10 Z" fill="none" stroke="#7a7a7a" stroke-width="0.25" stroke-dasharray="3 2"/><text x="12" y="66" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#7a7a7a">okraj na vystřižení ~1,5 cm · LÍC</text><path class="outline" d="M25 77 H139.35 V117 H25 Z" fill="none" stroke="#2b2b2b" stroke-width="0.3"/><path class="fold" d="M55 77 L55 117" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M70.69 77 L70.69 117" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M100.69 77 L100.69 117" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M109.35 77 L109.35 117" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><text x="62.845" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">OHYB A 15,69</text><text x="105.02" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">OHYB B 8,66</text><path class="seam" d="M25 113.5 L139.35 113.5" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="0.8 1.2"/><circle class="hole" cx="30" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="34" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="38" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="42" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="46" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="50" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="75.69" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="79.69" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="83.69" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="87.69" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="91.69" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="95.69" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="114.35" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="118.35" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="122.35" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="126.35" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="130.35" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="134.35" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="prick" cx="55" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="55" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="70.69" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="70.69" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="100.69" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="100.69" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="109.35" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="109.35" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="26" cy="113.5" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="138.35" cy="113.5" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><text x="40" y="90" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">ZADNÍ</text><text x="40" y="94.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="40" y="99" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z RUBU</text><text x="85.69" y="90" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">PŘEDNÍ</text><text x="85.69" y="94.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="85.69" y="99" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z LÍCE</text><text x="124.35" y="90" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">VNITŘNÍ</text><text x="124.35" y="94.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="124.35" y="99" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z RUBU</text><text x="82.175" y="122" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">PROUŽEK 114,35 × 40 mm · šev 3,5 mm od dolní hrany · 6 otvorů na panel</text><text x="82.175" y="125.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">rozteč 4 mm, krajní otvor 5 mm od čáry ohybu i od konce</text><text x="10" y="140" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#2b2b2b">Čísla z modelu pásu pro kůži 1,2 mm</text><text x="10" y="144.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Tři panely po 30 mm, ohyb A 15,69 mm (mezi zadním a předním), ohyb B 8,66 mm (mezi předním a vnitřním).</text><text x="10" y="147.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Ohyby jsou stejně široké jako na listu PÁS pro kůži 1,2 mm – závisí na tloušťce kůže a obsahu, ne na délce panelu.</text><text x="10" y="151.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Dohromady 114,35 mm (lekce 4: asi 114 mm = 90 + 15,7 + 8,7).</text><text x="10" y="154.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Otvory: (30 − 2 × 3,5) / 4 = 5,75 → 5 celých mezer, 6 otvorů; řada vystředěná na panelu, krajní 5 mm od čáry ohybu i od konce.</text><text x="10" y="158.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Tečky na sousedních panelech jsou zrcadlené přes střed ohybu, takže po složení lícují.</text><text x="10" y="161.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Prosekat naplocho: PŘEDNÍ panel z LÍCE, ZADNÍ a VNITŘNÍ z RUBU (ohyb panel převrátí).</text><text x="10" y="165.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Kůže 1,2 mm: ohyby se neztenčují, kroky ztenčení v lekci 4 přeskočte.</text><text x="10" y="168.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Kus kůže asi 130 × 40 mm (lekce 4): dolní čára obrysu na dolní hraně kůže, po délce vystředit, na každém konci zbude asi 7,8 mm</text><text x="10" y="172.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">rezervy – hodí se na zkoušku barvy na hrany (lekce 4).</text><path d="M10 262.5 V267.5 M60 262.5 V267.5" stroke="#2b2b2b" stroke-width="0.3" fill="none"/><path class="calibration" d="M10 265 L60 265" stroke="#2b2b2b" stroke-width="0.4" fill="none"/><text x="35" y="261.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#2b2b2b">KONTROLNÍ ÚSEČKA 50 mm</text><text x="66" y="266" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: tato úsečka musí měřit přesně 50 mm</text><text x="10" y="273" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#2b2b2b">Tisk na A4 na výšku na 100 % (skutečná velikost), vypnout „přizpůsobit stránce“ · měřítko 1:1</text><path d="M10 279 L17 279" stroke="#2b2b2b" stroke-width="0.3" fill="none"/><text x="18.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#2b2b2b">řez</text><path d="M28 279 L35 279" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2" fill="none"/><text x="36.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">ohyb / okraj papíru</text><circle cx="70" cy="279" r="0.45" fill="#2b2b2b"/><text x="71.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">otvor dna</text><circle cx="92" cy="279" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><text x="94" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">propíchnout šídlem, na rubu spojit</text></svg>
