<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><title>Cvičný proužek pro lekci 4 – pouzdro s vsazenou mincí, kůže 1,2 mm</title><rect width="210" height="297" fill="#ffffff"/><text x="13.5" y="18.5" font-family="Helvetica, Arial, sans-serif" font-size="4.4" font-weight="bold" text-anchor="start" fill="#2b2b2b">CVIČNÝ PROUŽEK PRO LEKCI 4 – SKLÁDÁNÍ A ŠEV TŘÍ VRSTEV</text><text x="13.5" y="24" font-family="Helvetica, Arial, sans-serif" font-size="2.6" text-anchor="start" fill="#2b2b2b">Pouzdro s vsazenou mincí · KŮŽE TĚLA 1,2 mm · ohyby se neztenčují · cvičný odřezek, ne díl pouzdra</text><text x="13.5" y="30.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#2b2b2b">Postup (lekce 4) – stejně jako u pásu v lekci 5</text><text x="13.5" y="34.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">1. Tiskněte na 100 % a změřte kontrolní úsečku dole: přesně 50 mm. Tloušťka kůže v nadpisu musí sedět na vaši kůži.</text><text x="13.5" y="37.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">2. List vystřihněte nůžkami po čárkované čáře – je velký jako kus kůže (130 × 50 mm).</text><text x="13.5" y="41.3" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">3. Položte ho na LÍC kůže hranami na hrany (u většího kusu obrys vystřeďte – kroužky musí ležet na kůži).</text><text x="13.5" y="44.7" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">4. Na obou koncích přelepte maskovací páskou hranu papíru i kůže a pásku přehněte na rub – mimo plnou čáru a kroužky.</text><text x="13.5" y="48.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">5. Šídlem propíchněte skrz papír i kůži všechny kroužky (za čarou řezu, v odpadu) a všechny tečky dna – musí být vidět i na rubu.</text><text x="13.5" y="51.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">6. Kůži i s listem otočte. Na RUBU spojte kroužky tužkou podle pravítka: čáry ohybů vedou přes celý proužek.</text><text x="13.5" y="54.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">7. Otočte zpět a řežte nožem skrz papír i kůži po plné čáře, s ocelovým pravítkem. Vpichy odejdou s odpadem.</text><text x="13.5" y="58.3" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">8. Pásku strhávejte pomalu.</text><path class="rough-margin" d="M40 70 H170 V120 H40 Z" fill="none" stroke="#7a7a7a" stroke-width="0.25" stroke-dasharray="3 2"/><text x="40" y="68.5" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#7a7a7a">vystřihnout po čárkované čáře = kus kůže 130 × 50 mm · LÍC</text><path class="outline" d="M47.825 75 H162.175 V115 H47.825 Z" fill="none" stroke="#2b2b2b" stroke-width="0.3"/><path class="fold" d="M77.825 75 L77.825 115" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M93.515 75 L93.515 115" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M123.515 75 L123.515 115" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M132.175 75 L132.175 115" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><text x="85.67" y="66" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">OHYB A 15,69</text><text x="127.845" y="66" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">OHYB B 8,66</text><path class="seam" d="M47.825 111.5 L162.175 111.5" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="0.8 1.2"/><circle class="hole" cx="52.825" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="56.825" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="60.825" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="64.825" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="68.825" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="72.825" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="98.515" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="102.515" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="106.515" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="110.515" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="114.515" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="118.515" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="137.175" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="141.175" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="145.175" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="149.175" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="153.175" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="157.175" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="prick" cx="77.825" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="77.825" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="93.515" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="93.515" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="123.515" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="123.515" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="132.175" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="132.175" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><text x="62.825" y="88" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">ZADNÍ</text><text x="62.825" y="92.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="62.825" y="97" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z RUBU</text><text x="108.515" y="88" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">PŘEDNÍ</text><text x="108.515" y="92.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="108.515" y="97" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z LÍCE</text><text x="147.175" y="88" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">VNITŘNÍ</text><text x="147.175" y="92.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="147.175" y="97" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z RUBU</text><text x="105" y="124" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">PROUŽEK 114,35 × 40 mm · šev 3,5 mm od dolní hrany · 6 otvorů na panel</text><text x="105" y="127.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">rozteč 4 mm, krajní otvor 5 mm od čáry ohybu i od konce</text><text x="13.5" y="134" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#2b2b2b">Čísla z modelu pásu pro kůži 1,2 mm</text><text x="13.5" y="138.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Tři panely po 30 mm, ohyb A 15,69 mm (mezi zadním a předním), ohyb B 8,66 mm (mezi předním a vnitřním).</text><text x="13.5" y="141.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Ohyby jsou stejně široké jako na listu PÁS pro kůži 1,2 mm – závisí na tloušťce kůže a obsahu, ne na délce panelu.</text><text x="13.5" y="145.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Dohromady 114,35 mm (lekce 4: asi 114 mm = 90 + 15,7 + 8,7).</text><text x="13.5" y="148.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Otvory: (30 − 2 × 3,5) / 4 = 5,75 → 5 celých mezer, 6 otvorů; řada vystředěná na panelu, krajní 5 mm od čáry ohybu i od konce.</text><text x="13.5" y="152.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Tečky na sousedních panelech jsou zrcadlené přes střed ohybu, takže po složení lícují.</text><text x="13.5" y="155.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Prosekat naplocho: PŘEDNÍ panel z LÍCE, ZADNÍ a VNITŘNÍ z RUBU (ohyb panel převrátí).</text><text x="13.5" y="159.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Kůže 1,2 mm: ohyby se neztenčují, kroky ztenčení v lekci 4 přeskočte.</text><text x="13.5" y="162.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Kus kůže asi 130 × 50 mm (lekce 4) = čárkovaný obdélník: nahoře i dole zbude 5 mm na kroužky, na každém konci asi</text><text x="13.5" y="166.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">7,8 mm na pásku přehnutou na rub; odřezky z konců se hodí na zkoušku barvy na hrany (lekce 4).</text><path d="M13.5 259 V264 M63.5 259 V264" stroke="#2b2b2b" stroke-width="0.3" fill="none"/><path class="calibration" d="M13.5 261.5 L63.5 261.5" stroke="#2b2b2b" stroke-width="0.4" fill="none"/><text x="38.5" y="258.3" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#2b2b2b">KONTROLNÍ ÚSEČKA 50 mm</text><text x="69.5" y="262.5" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: tato úsečka musí měřit přesně 50 mm</text><text x="13.5" y="269.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#2b2b2b">Tisk na A4 na výšku na 100 % (skutečná velikost), vypnout „přizpůsobit stránce“ · měřítko 1:1</text><path d="M13.5 275.5 L20.5 275.5" stroke="#2b2b2b" stroke-width="0.3" fill="none"/><text x="22" y="276.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#2b2b2b">řez</text><path d="M31.5 275.5 L38.5 275.5" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2" fill="none"/><text x="40" y="276.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">ohyb / okraj papíru</text><circle cx="73.5" cy="275.5" r="0.45" fill="#2b2b2b"/><text x="75" y="276.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">otvor dna</text><circle cx="95.5" cy="275.5" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><text x="97.5" y="276.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">kroužky za čarou řezu = propíchnout do odpadu, na rubu spojit před řezem</text></svg>
