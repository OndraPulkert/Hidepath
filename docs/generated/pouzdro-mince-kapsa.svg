<circle cx="37.5" cy="41" r="22" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="0.8 1.2"/>
<path d="M36 41 L39 41 M37.5 39.5 L37.5 42.5" stroke="#2b2b2b" stroke-width="0.25"/>
<text x="71" y="18" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">55 × 54,5 mm</text>
<text x="71" y="21.6" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">okno Ø 32 (plná čára)</text>
<text x="71" y="25.2" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">mince Ø 40 (čárkovaně)</text>
<text x="71" y="28.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">pata důlku Ø 44 (tečkovaně)</text>
<text x="71" y="32.4" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">šev 31 otvorů od středu dna</text>
<text x="71" y="36" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">otvory švu prosekat PŘED tvarováním,</text>
<text x="71" y="39.6" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">obrys vyříznout až po zaschnutí,</text>
<text x="71" y="43.2" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">okno vyseknout před přišitím</text>
<text x="71" y="46.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">na přední panel: 35,55 mm pod horní hranou,</text>
<text x="71" y="50.4" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">8,5 mm od boků, otevřenou hranou nahoru</text>
<text x="10" y="87" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#2b2b2b">OTVOR FORMY PRO DŮLEK</text>
<path d="M54 110.5 A22 22 0 1 0 10 110.5 A22 22 0 1 0 54 110.5 Z" fill="none" stroke="#2b2b2b" stroke-width="0.3"/>
<path d="M30.5 110.5 L33.5 110.5 M32 109 L32 112" stroke="#2b2b2b" stroke-width="0.25"/>
<text x="60" y="94.5" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">Ø 44 = mince 40 + 2 × kůže 1,2 + vůle 1,6</text>
<text x="60" y="98.1" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">deska ≥ 74 × 74 mm, tloušťka ≥ 8 mm</text>
<text x="60" y="101.7" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">překližka, dřevo nebo HDPE; hranu otvoru zaoblit smirkem</text>
<text x="60" y="105.3" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">kůže LÍCEM DOLŮ na formu, mince na rub, přiklopit deskou, svěrky</text>
<path d="M10 256 V260 M10 258 H60 M60 256 V260" stroke="#2b2b2b" stroke-width="0.3" fill="none"/>
<text x="63" y="259" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: 50 mm</text>
<text x="10" y="266" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">POUZDRO NA KARTY S VSAZENOU MINCÍ – LIST KAPSA A FORMA.</text>
<text x="10" y="269.2" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Tisk na A4 NA VÝŠKU na 100 % (bez „přizpůsobit stránce“).</text>
<text x="10" y="272.4" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Kapsa z kůže 1,2 mm; odřezek ≥ 70 × 70 mm.</text>
<text x="10" y="275.6" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Plná čára = řez, tečky = otvory stehu, čárkovaně/tečkovaně = pomocné kružnice.</text>
</svg>