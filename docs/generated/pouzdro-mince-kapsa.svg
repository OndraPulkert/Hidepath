<text x="72.5" y="27.25" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">42,5 × 42 mm</text>
<text x="72.5" y="30.85" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">čárkovaný čtverec 57,5 × 57,5 = kus kůže:</text>
<text x="72.5" y="34.45" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">výtisk na značky vystřihnout po něm</text>
<text x="72.5" y="38.05" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">okno Ø 20 (plná čára)</text>
<text x="72.5" y="41.65" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">prstenec 3,75 mm – držení ověřit na odřezku</text>
<text x="72.5" y="45.25" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">mince Ø 27,5 (čárkovaně)</text>
<text x="72.5" y="48.85" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">čerchovaně osy – na líci jen propíchnout konce,</text>
<text x="72.5" y="52.45" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">na RUBU spojit a protáhnout až k okraji kůže</text>
<text x="72.5" y="56.05" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">pata důlku Ø 31,5 (tečkovaně)</text>
<text x="72.5" y="59.65" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">šev 23 otvorů od středu dna</text>
<text x="72.5" y="63.25" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">otvory švu prosekat PŘED tvarováním,</text>
<text x="72.5" y="66.85" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">na formě vystředit podle os, obrys</text>
<text x="72.5" y="70.45" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">vyříznout po zaschnutí podle orýsování,</text>
<text x="72.5" y="74.05" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">okno vyseknout před přišitím</text>
<text x="72.5" y="77.65" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">na přední panel: 41,8 mm pod horní hranou,</text>
<text x="72.5" y="81.25" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">14,75 mm od boků, otevřenou hranou nahoru</text>
<text x="72.5" y="84.85" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2e7d32">šrafa G1 = lepit na RUBU kapsy: pruh 3,5 mm</text>
<text x="72.5" y="88.45" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2e7d32">od okraje po čáru švu, boky a dno;</text>
<text x="72.5" y="92.05" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2e7d32">stejný pruh na líci předního panelu (list PÁS)</text>
<text x="38.75" y="64.1" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#2e7d32" stroke="#ffffff" stroke-width="0.5" paint-order="stroke">G1 · lepit na RUBU</text>
<text x="38.75" y="22.05" font-family="Helvetica, Arial, sans-serif" font-size="1.8" text-anchor="middle" fill="#7a7a7a" stroke="#ffffff" stroke-width="0.5" paint-order="stroke">NElepit – sem se zasouvá mince</text>
<text x="10" y="104.15" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#2b2b2b">OTVOR FORMY PRO DŮLEK</text>
<path class="paper-cut-forma" d="M10 107.15 H60 V157.15 H10 Z" fill="none" stroke="#7a7a7a" stroke-width="0.25" stroke-dasharray="3 2"/>
<path d="M50.75 132.15 A15.75 15.75 0 1 0 19.25 132.15 A15.75 15.75 0 1 0 50.75 132.15 Z" fill="none" stroke="#2b2b2b" stroke-width="0.3"/>
<path d="M33.5 132.15 L36.5 132.15 M35 130.65 L35 133.65" stroke="#2b2b2b" stroke-width="0.25"/>
<path d="M15.25 132.15 H54.75 M35 112.4 V151.9" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 1 0.6 1"/>
<text x="65" y="113.15" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">čárkovaný čtverec 5 × 5 cm: vystřihnout po něm,</text>
<text x="65" y="116.75" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">křížek os je v jeho středu</text>
<text x="65" y="120.35" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">Ø 31,5 = mince 27,5 + 2 × kůže 1,2 + vůle 1,6</text>
<text x="65" y="123.95" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">deska ≥ 61,5 × 61,5 mm, tloušťka ≥ 8 mm</text>
<text x="65" y="127.55" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">překližka, dřevo nebo HDPE; hranu otvoru zaoblit smirkem</text>
<text x="65" y="131.15" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">osy otvoru narýsovat na desce až k jejím okrajům</text>
<text x="65" y="134.75" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">kůže LÍCEM DOLŮ na formu, osy na rubu na osy desky,</text>
<text x="65" y="138.35" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">mince na rub, přiklopit deskou, svěrky</text>
<path d="M10 256 V260 M10 258 H60 M60 256 V260" stroke="#2b2b2b" stroke-width="0.3" fill="none"/>
<text x="63" y="259" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: 50 mm</text>
<text x="10" y="266" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">POUZDRO NA KARTY S VSAZENOU MINCÍ – LIST KAPSA A FORMA.</text>
<text x="10" y="269.2" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Tisk na A4 na 100 % (bez „přizpůsobit stránce“); samostatný list na výšku.</text>
<text x="10" y="272.4" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Kapsa ze samostatné kůže 1,2 mm (i když je pás silnější); kus ≥ 57,5 × 57,5 mm.</text>
<text x="10" y="275.6" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Plná čára = řez, tečky = otvory stehu, čárkovaně/tečkovaně = pomocné kružnice, čárkovaný čtverec = vystřihnout papír.</text>
