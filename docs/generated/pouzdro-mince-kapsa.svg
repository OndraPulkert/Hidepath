<circle cx="31.25" cy="52.5" r="0.45" fill="#2b2b2b"/><circle cx="27.25" cy="52.5" r="0.45" fill="#2b2b2b"/><circle cx="35.25" cy="52.5" r="0.45" fill="#2b2b2b"/><circle cx="23.25" cy="52.5" r="0.45" fill="#2b2b2b"/><circle cx="39.25" cy="52.5" r="0.45" fill="#2b2b2b"/><circle cx="19.25" cy="52.5" r="0.45" fill="#2b2b2b"/><circle cx="43.25" cy="52.5" r="0.45" fill="#2b2b2b"/><circle cx="15.261" cy="52.388" r="0.45" fill="#2b2b2b"/><circle cx="47.239" cy="52.388" r="0.45" fill="#2b2b2b"/><circle cx="13.5" cy="49.177" r="0.45" fill="#2b2b2b"/><circle cx="49" cy="49.177" r="0.45" fill="#2b2b2b"/><circle cx="13.5" cy="45.177" r="0.45" fill="#2b2b2b"/><circle cx="49" cy="45.177" r="0.45" fill="#2b2b2b"/><circle cx="13.5" cy="41.177" r="0.45" fill="#2b2b2b"/><circle cx="49" cy="41.177" r="0.45" fill="#2b2b2b"/><circle cx="13.5" cy="37.177" r="0.45" fill="#2b2b2b"/><circle cx="49" cy="37.177" r="0.45" fill="#2b2b2b"/><circle cx="13.5" cy="33.177" r="0.45" fill="#2b2b2b"/><circle cx="49" cy="33.177" r="0.45" fill="#2b2b2b"/><circle cx="13.5" cy="29.177" r="0.45" fill="#2b2b2b"/><circle cx="49" cy="29.177" r="0.45" fill="#2b2b2b"/><circle cx="13.5" cy="25.177" r="0.45" fill="#2b2b2b"/><circle cx="49" cy="25.177" r="0.45" fill="#2b2b2b"/>
<path d="M41.25 34.75 A10 10 0 1 0 21.25 34.75 A10 10 0 1 0 41.25 34.75 Z" fill="none" stroke="#2b2b2b" stroke-width="0.3"/>
<circle cx="31.25" cy="34.75" r="13.75" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="2 1.5"/>
<circle cx="31.25" cy="34.75" r="15.75" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="0.8 1.2"/>
<path d="M29.75 34.75 L32.75 34.75 M31.25 33.25 L31.25 36.25" stroke="#2b2b2b" stroke-width="0.25"/>
<path d="M6 34.75 H56.5 M31.25 14 V60" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 1 0.6 1"/>
<text x="58.5" y="18" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">42,5 × 42 mm</text>
<text x="58.5" y="21.6" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">okno Ø 20 (plná čára)</text>
<text x="58.5" y="25.2" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">prstenec 3,75 mm – držení ověřit na odřezku</text>
<text x="58.5" y="28.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">mince Ø 27,5 (čárkovaně)</text>
<text x="58.5" y="32.4" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">čerchovaně osy – protáhnout až k okraji kůže</text>
<text x="58.5" y="36" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">pata důlku Ø 31,5 (tečkovaně)</text>
<text x="58.5" y="39.6" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">šev 23 otvorů od středu dna</text>
<text x="58.5" y="43.2" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">otvory švu prosekat PŘED tvarováním,</text>
<text x="58.5" y="46.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">na formě vystředit podle os, obrys</text>
<text x="58.5" y="50.4" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">vyříznout po zaschnutí podle orýsování,</text>
<text x="58.5" y="54" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">okno vyseknout před přišitím</text>
<text x="58.5" y="57.6" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">na přední panel: 41,8 mm pod horní hranou,</text>
<text x="58.5" y="61.2" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">14,75 mm od boků, otevřenou hranou nahoru</text>
<text x="10" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="2.8" text-anchor="start" fill="#2b2b2b">OTVOR FORMY PRO DŮLEK</text>
<path d="M41.5 91.75 A15.75 15.75 0 1 0 10 91.75 A15.75 15.75 0 1 0 41.5 91.75 Z" fill="none" stroke="#2b2b2b" stroke-width="0.3"/>
<path d="M24.25 91.75 L27.25 91.75 M25.75 90.25 L25.75 93.25" stroke="#2b2b2b" stroke-width="0.25"/>
<path d="M6 91.75 H45.5 M25.75 75.5 V111.5" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 1 0.6 1"/>
<text x="47.5" y="82" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">Ø 31,5 = mince 27,5 + 2 × kůže 1,2 + vůle 1,6</text>
<text x="47.5" y="85.6" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">deska ≥ 61,5 × 61,5 mm, tloušťka ≥ 8 mm</text>
<text x="47.5" y="89.2" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">překližka, dřevo nebo HDPE; hranu otvoru zaoblit smirkem</text>
<text x="47.5" y="92.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">osy otvoru narýsovat na desce až k jejím okrajům</text>
<text x="47.5" y="96.4" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">kůže LÍCEM DOLŮ na formu, osy na kůži na osy desky,</text>
<text x="47.5" y="100" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#7a7a7a">mince na rub, přiklopit deskou, svěrky</text>
<path d="M10 256 V260 M10 258 H60 M60 256 V260" stroke="#2b2b2b" stroke-width="0.3" fill="none"/>
<text x="63" y="259" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: 50 mm</text>
<text x="10" y="266" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">POUZDRO NA KARTY S VSAZENOU MINCÍ – LIST KAPSA A FORMA.</text>
<text x="10" y="269.2" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Tisk na A4 na 100 % (bez „přizpůsobit stránce“); samostatný list na výšku.</text>
<text x="10" y="272.4" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Kapsa ze samostatné kůže 1,2 mm (i když je pás silnější); kus ≥ 57,5 × 57,5 mm.</text>
<text x="10" y="275.6" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">Plná čára = řez, tečky = otvory stehu, čárkovaně/tečkovaně = pomocné kružnice.</text>
</svg>