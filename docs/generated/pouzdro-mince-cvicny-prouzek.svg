<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><title>Cvičný proužek pro lekci 4 – pouzdro s vsazenou mincí, kůže 1,5 mm</title><rect width="210" height="297" fill="#ffffff"/><text x="10" y="15" font-family="Helvetica, Arial, sans-serif" font-size="4.4" font-weight="bold" text-anchor="start" fill="#2b2b2b">CVIČNÝ PROUŽEK PRO LEKCI 4 – SKLÁDÁNÍ A ŠEV TŘÍ VRSTEV</text><text x="10" y="20.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" text-anchor="start" fill="#2b2b2b">Pouzdro s vsazenou mincí · KŮŽE TĚLA 1,5 mm · ohyb B se ztenčuje na 1 mm · cvičný odřezek, ne díl pouzdra</text><text x="10" y="27" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#2b2b2b">Postup (lekce 4) – stejně jako u pásu v lekci 5</text><text x="10" y="31" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">1. Tiskněte na 100 % a změřte kontrolní úsečku dole: přesně 50 mm. Tloušťka kůže v nadpisu musí sedět na vaši kůži.</text><text x="10" y="34.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">2. Proužek vystřihněte nůžkami nahrubo po čárkované čáře (okraj asi 1,5 cm), jen dole přesně po plné dolní čáře obrysu.</text><text x="10" y="37.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">3. Dolní hranu listu přiložte přesně na rovnou dolní hranu kusu kůže (kus i proužek jsou 40 mm vysoké), po délce obrys vystřeďte.</text><text x="10" y="41.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">4. Přilepte ho maskovací páskou na LÍC kůže – páska jen na okrajích papíru, mimo plnou čáru.</text><text x="10" y="44.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">5. Pravítkem ověřte, že kroužky na koncích čáry švu leží 3,5 mm od dolní hrany kůže; když ne, list přiložte znovu.</text><text x="10" y="48" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">6. Šídlem propíchněte skrz papír i kůži všechny kroužky (konce čar ohybů a čáry švu, okraje šrafy) a všechny tečky dna – musí být vidět i na rubu.</text><text x="10" y="51.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">7. Řežte nožem skrz papír i kůži po plné čáře, s ocelovým pravítkem. Pásku strhávejte pomalu.</text><text x="10" y="54.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">8. Na RUBU spojte propíchnuté kroužky tužkou podle pravítka: konce čar ohybů a okraje šrafy (pásmo ztenčení).</text><path class="rough-margin" d="M10 62 H156.55 V132 H10 Z" fill="none" stroke="#7a7a7a" stroke-width="0.25" stroke-dasharray="3 2"/><text x="12" y="66" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#7a7a7a">okraj na vystřižení ~1,5 cm · LÍC</text><path d="M98.63 115 L100.63 117 M98.63 113 L102.63 117 M98.63 111 L104.63 117 M98.63 109 L106.63 117 M98.63 107 L108.63 117 M98.63 105 L110.63 117 M98.63 103 L112.63 117 M98.63 101 L114.55 116.92 M98.63 99 L114.55 114.92 M98.63 97 L114.55 112.92 M98.63 95 L114.55 110.92 M98.63 93 L114.55 108.92 M98.63 91 L114.55 106.92 M98.63 89 L114.55 104.92 M98.63 87 L114.55 102.92 M98.63 85 L114.55 100.92 M98.63 83 L114.55 98.92 M98.63 81 L114.55 96.92 M98.63 79 L114.55 94.92 M98.63 77 L114.55 92.92 M100.63 77 L114.55 90.92 M102.63 77 L114.55 88.92 M104.63 77 L114.55 86.92 M106.63 77 L114.55 84.92 M108.63 77 L114.55 82.92 M110.63 77 L114.55 80.92 M112.63 77 L114.55 78.92" stroke="#b9c3bc" stroke-width="0.3" fill="none"/><rect class="skive-zone" x="98.63" y="77" width="15.92" height="40" fill="none" stroke="#b9c3bc" stroke-width="0.2"/><path class="outline" d="M25 77 H141.55 V117 H25 Z" fill="none" stroke="#2b2b2b" stroke-width="0.3"/><path class="fold" d="M55 77 L55 117" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M71.63 77 L71.63 117" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M101.63 77 L101.63 117" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M111.55 77 L111.55 117" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><text x="63.315" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">OHYB A 16,63</text><text x="106.59" y="74.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">OHYB B 9,92</text><path class="seam" d="M25 113.5 L141.55 113.5" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="0.8 1.2"/><circle class="hole" cx="30" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="34" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="38" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="42" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="46" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="50" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="76.63" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="80.63" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="84.63" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="88.63" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="92.63" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="96.63" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="116.55" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="120.55" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="124.55" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="128.55" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="132.55" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="136.55" cy="113.5" r="0.45" fill="#2b2b2b"/><circle class="prick" cx="55" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="55" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="71.63" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="71.63" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="101.63" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="101.63" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="111.55" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="111.55" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="26" cy="113.5" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="140.55" cy="113.5" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="98.63" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="98.63" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="114.55" cy="78" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="114.55" cy="116" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><text x="40" y="90" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">ZADNÍ</text><text x="40" y="94.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="40" y="99" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z RUBU</text><text x="86.63" y="90" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">PŘEDNÍ</text><text x="86.63" y="94.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="86.63" y="99" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z LÍCE</text><text x="126.55" y="90" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">VNITŘNÍ</text><text x="126.55" y="94.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="126.55" y="99" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z RUBU</text><text x="83.275" y="122" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">PROUŽEK 116,55 × 40 mm · šev 3,5 mm od dolní hrany · 6 otvorů na panel</text><text x="83.275" y="125.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">rozteč 4 mm, krajní otvor 5 mm od čáry ohybu i od konce</text><text x="10" y="140" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#2b2b2b">Čísla z modelu pásu pro kůži 1,5 mm</text><text x="10" y="144.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Tři panely po 30 mm, ohyb A 16,63 mm (mezi zadním a předním), ohyb B 9,92 mm (mezi předním a vnitřním).</text><text x="10" y="147.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Ohyby jsou stejně široké jako na listu PÁS pro kůži 1,5 mm – závisí na tloušťce kůže a obsahu, ne na délce panelu.</text><text x="10" y="151.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Dohromady 116,55 mm (lekce 4: asi 117 mm = 90 + 16,6 + 9,9).</text><text x="10" y="154.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Otvory: (30 − 2 × 3,5) / 4 = 5,75 → 5 celých mezer, 6 otvorů; řada vystředěná na panelu, krajní 5 mm od čáry ohybu i od konce.</text><text x="10" y="158.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Tečky na sousedních panelech jsou zrcadlené přes střed ohybu, takže po složení lícují.</text><text x="10" y="161.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Prosekat naplocho: PŘEDNÍ panel z LÍCE, ZADNÍ a VNITŘNÍ z RUBU (ohyb panel převrátí).</text><text x="10" y="165.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Šrafa = ohyb B 9,92 mm a 3 mm na obě strany (asi 16 mm): ztenčit z rubu na 1 mm jako v lekci 3.</text><text x="10" y="168.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Kus kůže asi 130 × 40 mm (lekce 4): dolní čára obrysu na dolní hraně kůže, po délce vystředit, na každém konci zbude asi 6,7 mm</text><text x="10" y="172.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">rezervy – hodí se na zkoušku barvy na hrany (lekce 4).</text><path d="M10 262.5 V267.5 M60 262.5 V267.5" stroke="#2b2b2b" stroke-width="0.3" fill="none"/><path class="calibration" d="M10 265 L60 265" stroke="#2b2b2b" stroke-width="0.4" fill="none"/><text x="35" y="261.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#2b2b2b">KONTROLNÍ ÚSEČKA 50 mm</text><text x="66" y="266" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: tato úsečka musí měřit přesně 50 mm</text><text x="10" y="273" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#2b2b2b">Tisk na A4 na výšku na 100 % (skutečná velikost), vypnout „přizpůsobit stránce“ · měřítko 1:1</text><path d="M10 279 L17 279" stroke="#2b2b2b" stroke-width="0.3" fill="none"/><text x="18.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#2b2b2b">řez</text><path d="M28 279 L35 279" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2" fill="none"/><text x="36.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">ohyb / okraj papíru</text><circle cx="70" cy="279" r="0.45" fill="#2b2b2b"/><text x="71.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">otvor dna</text><circle cx="92" cy="279" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><text x="94" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">propíchnout šídlem, na rubu spojit</text><rect x="145" y="277.5" width="6" height="3" fill="none" stroke="#b9c3bc" stroke-width="0.6"/><text x="152.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">ztenčit z rubu</text></svg>
