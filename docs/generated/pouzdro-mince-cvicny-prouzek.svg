<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><title>Cvičný proužek pro lekci 4 – pouzdro s vsazenou mincí, kůže 1,5 mm</title><rect width="210" height="297" fill="#ffffff"/><text x="10" y="15" font-family="Helvetica, Arial, sans-serif" font-size="4.4" font-weight="bold" text-anchor="start" fill="#2b2b2b">CVIČNÝ PROUŽEK PRO LEKCI 4 – SKLÁDÁNÍ A ŠEV TŘÍ VRSTEV</text><text x="10" y="20.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" text-anchor="start" fill="#2b2b2b">Pouzdro s vsazenou mincí · KŮŽE TĚLA 1,5 mm · ohyb B se ztenčuje na 1 mm · cvičný odřezek, ne díl pouzdra</text><text x="10" y="27" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#2b2b2b">Postup (lekce 4) – stejně jako u pásu v lekci 5</text><text x="10" y="31" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">1. Tiskněte na 100 % a změřte kontrolní úsečku dole: přesně 50 mm. Tloušťka kůže v nadpisu musí sedět na vaši kůži.</text><text x="10" y="34.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">2. List vystřihněte nůžkami po čárkované čáře – je velký jako kus kůže (130 × 50 mm).</text><text x="10" y="37.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">3. Položte ho na LÍC kůže hranami na hrany (u většího kusu obrys vystřeďte – kroužky musí ležet na kůži).</text><text x="10" y="41.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">4. Na obou koncích přelepte maskovací páskou hranu papíru i kůže a pásku přehněte na rub – mimo plnou čáru a kroužky.</text><text x="10" y="44.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">5. Šídlem propíchněte skrz papír i kůži všechny kroužky (za čarou řezu, v odpadu) a všechny tečky dna – musí být vidět i na rubu.</text><text x="10" y="48" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">6. Kůži i s listem otočte. Na RUBU spojte kroužky tužkou podle pravítka: čáry ohybů a okraje šrafy (pásmo ztenčení) vedou přes celý proužek.</text><text x="10" y="51.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">7. Otočte zpět a řežte nožem skrz papír i kůži po plné čáře, s ocelovým pravítkem. Vpichy odejdou s odpadem.</text><text x="10" y="54.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">8. Pásku strhávejte pomalu.</text><path class="rough-margin" d="M40 70 H170 V120 H40 Z" fill="none" stroke="#7a7a7a" stroke-width="0.25" stroke-dasharray="3 2"/><text x="40" y="68.5" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#7a7a7a">vystřihnout po čárkované čáře = kus kůže 130 × 50 mm · LÍC</text><path d="M120.355 113 L122.355 115 M120.355 111 L124.355 115 M120.355 109 L126.355 115 M120.355 107 L128.355 115 M120.355 105 L130.355 115 M120.355 103 L132.355 115 M120.355 101 L134.355 115 M120.355 99 L136.275 114.92 M120.355 97 L136.275 112.92 M120.355 95 L136.275 110.92 M120.355 93 L136.275 108.92 M120.355 91 L136.275 106.92 M120.355 89 L136.275 104.92 M120.355 87 L136.275 102.92 M120.355 85 L136.275 100.92 M120.355 83 L136.275 98.92 M120.355 81 L136.275 96.92 M120.355 79 L136.275 94.92 M120.355 77 L136.275 92.92 M120.355 75 L136.275 90.92 M122.355 75 L136.275 88.92 M124.355 75 L136.275 86.92 M126.355 75 L136.275 84.92 M128.355 75 L136.275 82.92 M130.355 75 L136.275 80.92 M132.355 75 L136.275 78.92 M134.355 75 L136.275 76.92" stroke="#b9c3bc" stroke-width="0.3" fill="none"/><rect class="skive-zone" x="120.355" y="75" width="15.92" height="40" fill="none" stroke="#b9c3bc" stroke-width="0.2"/><path class="outline" d="M46.725 75 H163.275 V115 H46.725 Z" fill="none" stroke="#2b2b2b" stroke-width="0.3"/><path class="fold" d="M76.725 75 L76.725 115" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M93.355 75 L93.355 115" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M123.355 75 L123.355 115" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><path class="fold" d="M133.275 75 L133.275 115" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2"/><text x="85.04" y="66" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">OHYB A 16,63</text><text x="128.315" y="66" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">OHYB B 9,92</text><path class="seam" d="M46.725 111.5 L163.275 111.5" fill="none" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="0.8 1.2"/><circle class="hole" cx="51.725" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="55.725" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="59.725" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="63.725" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="67.725" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="71.725" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="98.355" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="102.355" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="106.355" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="110.355" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="114.355" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="118.355" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="138.275" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="142.275" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="146.275" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="150.275" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="154.275" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="hole" cx="158.275" cy="111.5" r="0.45" fill="#2b2b2b"/><circle class="prick" cx="76.725" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="76.725" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="93.355" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="93.355" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="123.355" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="123.355" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="133.275" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="133.275" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="120.355" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="120.355" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="136.275" cy="73" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><circle class="prick" cx="136.275" cy="117" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><text x="61.725" y="88" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">ZADNÍ</text><text x="61.725" y="92.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="61.725" y="97" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z RUBU</text><text x="108.355" y="88" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">PŘEDNÍ</text><text x="108.355" y="92.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="108.355" y="97" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z LÍCE</text><text x="148.275" y="88" font-family="Helvetica, Arial, sans-serif" font-size="2.8" font-weight="bold" text-anchor="middle" fill="#2b2b2b">VNITŘNÍ</text><text x="148.275" y="92.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">30 mm</text><text x="148.275" y="97" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">otvory z RUBU</text><text x="105" y="124" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">PROUŽEK 116,55 × 40 mm · šev 3,5 mm od dolní hrany · 6 otvorů na panel</text><text x="105" y="127.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#7a7a7a">rozteč 4 mm, krajní otvor 5 mm od čáry ohybu i od konce</text><text x="10" y="134" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#2b2b2b">Čísla z modelu pásu pro kůži 1,5 mm</text><text x="10" y="138.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Tři panely po 30 mm, ohyb A 16,63 mm (mezi zadním a předním), ohyb B 9,92 mm (mezi předním a vnitřním).</text><text x="10" y="141.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Ohyby jsou stejně široké jako na listu PÁS pro kůži 1,5 mm – závisí na tloušťce kůže a obsahu, ne na délce panelu.</text><text x="10" y="145.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Dohromady 116,55 mm (lekce 4: asi 117 mm = 90 + 16,6 + 9,9).</text><text x="10" y="148.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Otvory: (30 − 2 × 3,5) / 4 = 5,75 → 5 celých mezer, 6 otvorů; řada vystředěná na panelu, krajní 5 mm od čáry ohybu i od konce.</text><text x="10" y="152.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Tečky na sousedních panelech jsou zrcadlené přes střed ohybu, takže po složení lícují.</text><text x="10" y="155.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Prosekat naplocho: PŘEDNÍ panel z LÍCE, ZADNÍ a VNITŘNÍ z RUBU (ohyb panel převrátí).</text><text x="10" y="159.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Šrafa = ohyb B 9,92 mm a 3 mm na obě strany (asi 16 mm): ztenčit z rubu na 1 mm jako v lekci 3.</text><text x="10" y="162.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">Kus kůže asi 130 × 50 mm (lekce 4) = čárkovaný obdélník: nahoře i dole zbude 5 mm na kroužky, na každém konci asi</text><text x="10" y="166.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#7a7a7a">6,7 mm na pásku přehnutou na rub; odřezky z konců se hodí na zkoušku barvy na hrany (lekce 4).</text><path d="M10 262.5 V267.5 M60 262.5 V267.5" stroke="#2b2b2b" stroke-width="0.3" fill="none"/><path class="calibration" d="M10 265 L60 265" stroke="#2b2b2b" stroke-width="0.4" fill="none"/><text x="35" y="261.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#2b2b2b">KONTROLNÍ ÚSEČKA 50 mm</text><text x="66" y="266" font-family="Helvetica, Arial, sans-serif" font-size="2.4" text-anchor="start" fill="#2b2b2b">KONTROLA MĚŘÍTKA: tato úsečka musí měřit přesně 50 mm</text><text x="10" y="273" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#2b2b2b">Tisk na A4 na výšku na 100 % (skutečná velikost), vypnout „přizpůsobit stránce“ · měřítko 1:1</text><path d="M10 279 L17 279" stroke="#2b2b2b" stroke-width="0.3" fill="none"/><text x="18.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#2b2b2b">řez</text><path d="M28 279 L35 279" stroke="#7a7a7a" stroke-width="0.2" stroke-dasharray="3 2" fill="none"/><text x="36.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">ohyb / okraj papíru</text><circle cx="70" cy="279" r="0.45" fill="#2b2b2b"/><text x="71.5" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">otvor dna</text><circle cx="92" cy="279" r="0.8" fill="none" stroke="#2b2b2b" stroke-width="0.25"/><text x="94" y="279.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">kroužky za čarou řezu = propíchnout do odpadu, na rubu spojit před řezem</text><rect x="10" y="282.5" width="6" height="3" fill="none" stroke="#b9c3bc" stroke-width="0.6"/><text x="17.5" y="284.8" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#7a7a7a">ztenčit z rubu</text></svg>
