<text x="71" y="107.5" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b" text-anchor="start">nýt ± 25,5 mm od ohybu</text>
<text x="71" y="117" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b" text-anchor="start">ovál 25 × 6 mm, ohyb ho půlí</text>
<text x="71" y="133" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#c0392b" text-anchor="start">OHYB (příčka přezky) · propíchněte oba kroužky</text>
<text x="71" y="149" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#1f6f43" text-anchor="start">můstek u oválu 10 mm</text>
<text x="71" y="182.35" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#1f6f43" text-anchor="start">kapsa pro poutko 47,7 mm (světlá 37,7 mm)</text>
<text x="71" y="223" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b" text-anchor="start">konec pásu 90 mm od ohybu</text>
<text x="71" y="83.65" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#6a6a6a" text-anchor="start">šedé: 2. dvojice, značí se až skrz 1. dvojici</text>
<text x="22" y="39" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#6a6a6a" text-anchor="start">sem pokračuje hlavní pás (nahoře neřezat)</text>
<text x="22" y="228" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Poutko — pásek 110 × 12 mm, obepíná 3 vrstvy: přehnutý konec, pás pod ním a volný konec pásku</text>
<text x="22" y="254" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">obvod 3 vrstev 91 mm + 3,8 mm na tloušťku poutka 1,2 mm + 15 mm přeplátování</text>
