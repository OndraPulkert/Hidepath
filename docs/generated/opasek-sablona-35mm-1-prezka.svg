<text x="71" y="59.8" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b" text-anchor="start">nýt ± 73,2 mm od ohybu</text>
<text x="71" y="107.5" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b" text-anchor="start">nýt ± 25,5 mm od ohybu</text>
<text x="71" y="117" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b" text-anchor="start">drážka 25 × 6 mm, ohyb ji půlí</text>
<text x="71" y="133" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#c0392b" text-anchor="start">OHYB (příčka přezky)</text>
<text x="71" y="149" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#1f6f43" text-anchor="start">můstek u drážky 10 mm</text>
<text x="71" y="182.35" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#1f6f43" text-anchor="start">kapsa pro poutko 47,7 mm (světlá 37,7 mm)</text>
<text x="71" y="223" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b" text-anchor="start">konec pásu 90 mm od ohybu</text>
<text x="22" y="39" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#6a6a6a" text-anchor="start">sem pokračuje hlavní pás (nahoře neřezat)</text>
<text x="22" y="228" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Poutko — pásek 101 × 12 mm (obvod zdvojené části 86 mm + 15 mm přeplátování)</text>
