<text x="22" y="258" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">1. Přenes značky na rub pásu: ohyb, drážku i všechny čtyři otvory.</text>
<text x="22" y="262.2" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">2. Vysekni 6mm otvory pro nýty i konce drážky (stejný průbojník), drážku mezi nimi vyřízni nožem.</text>
<text x="22" y="266.4" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">3. Navlékni poutko na přehnutý konec. Teprve pak ohni konec kolem přezky.</text>
<text x="22" y="270.6" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">4. Sešroubuj oba nýty. Poutko zůstane uvězněné v kapse mezi nimi.</text>
<text x="22" y="274.8" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Nýty: 2 kusy, každý prochází oběma vrstvami — proto jsou otvory čtyři.</text>
<text x="22" y="279" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Rozměry z šablony Black Flag Leather Goods (jeden zdroj, ať se nemíchají rozteče).</text>
<text x="22" y="283.2" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Délka poutka a zaoblení konce jsou spočítané, ne ověřené — vyzkoušej na odřezku.</text>
</svg>