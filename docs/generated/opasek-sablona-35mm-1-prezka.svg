<text x="112" y="249.2" font-family="Helvetica, Arial, sans-serif" font-size="2.6" fill="#7a7a7a" text-anchor="middle">90</text>
<line x1="122" y1="244" x2="122" y2="246" stroke="#7a7a7a" stroke-width="0.2"/>
