<line x1="65" y1="126.3" x2="65" y2="151.3" stroke="#1f6f43" stroke-width="0.3"/><line x1="63" y1="126.3" x2="67" y2="126.3" stroke="#1f6f43" stroke-width="0.3"/><line x1="63" y1="151.3" x2="67" y2="151.3" stroke="#1f6f43" stroke-width="0.3"/>
<text x="73" y="48.469" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b" text-anchor="start">hrot 32,9 mm</text>
<text x="73" y="36" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#c0392b" text-anchor="start">vrchol zaoblený r = 4 mm (není ostrý hrot)</text>
<text x="73" y="138.8" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#1f6f43" text-anchor="start">rozteč 25 mm</text>
<text x="73" y="173.3" font-family="Helvetica, Arial, sans-serif" font-size="3.4" fill="#c0392b" text-anchor="start">PROSTŘEDNÍ DÍRKA = vaše míra</text>
<text x="73" y="178.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#c0392b" text-anchor="start">144,3 mm od hrotu</text>
<text x="73" y="182.8" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#c0392b" text-anchor="start">nastavení ± 50 mm (2 dírky sem i tam)</text>
<text x="73" y="227.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">poslední dírka 194,3 mm od hrotu</text>
<text x="26" y="243.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#6a6a6a" text-anchor="start">sem pokračuje hlavní pás (dole neřezat)</text>
<text x="26" y="248.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Dírky Ø 5 mm, 5 kusů, rozteč 25 mm.</text>
<text x="26" y="252.5" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Vrchol je oblouk r = 4 mm, boky jsou na něj tečné — odměřeno z PDF CraftPoint, ne ostrý hrot.</text>
<text x="26" y="256.7" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">CELKOVÁ DÉLKA PÁSU = naměřený obvod + 234,3 mm</text>
<text x="26" y="260.9" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">   (90 mm přehnutý konec u přezky + 144,3 mm od hrotu k prostřední dírce)</text>
<text x="26" y="265.1" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Obvod měřte na stávajícím opasku od ohybu u přezky k dírce, kterou nosíte.</text>
<text x="26" y="269.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Bez opasku: krejčovský metr provlékněte poutky kalhot a utáhněte na pohodlí.</text>
<text x="26" y="273.5" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Dírky vysekněte až po zkoušce na těle. Špičku uřízněte jako poslední.</text>
<text x="26" y="277.7" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Rozvržení odměřeno z PDF generátoru CraftPoint; shodné pro obvod 85 i 95 cm.</text>
</svg>