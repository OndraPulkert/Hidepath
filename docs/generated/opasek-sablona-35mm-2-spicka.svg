<text x="13" y="92.15" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#1f6f43" text-anchor="end">94,3 mm</text>
<line x1="61" y1="139.3" x2="61" y2="164.3" stroke="#1f6f43" stroke-width="0.3"/><line x1="59" y1="139.3" x2="63" y2="139.3" stroke="#1f6f43" stroke-width="0.3"/><line x1="59" y1="164.3" x2="63" y2="164.3" stroke="#1f6f43" stroke-width="0.3"/>
<text x="71" y="61.469" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#2b2b2b" text-anchor="start">hrot 32,9 mm</text>
<text x="71" y="49" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#c0392b" text-anchor="start">vrchol zaoblený r = 4 mm (není ostrý hrot)</text>
<text x="71" y="151.8" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#1f6f43" text-anchor="start">rozteč 25 mm</text>
<text x="71" y="186.3" font-family="Helvetica, Arial, sans-serif" font-size="3.4" fill="#c0392b" text-anchor="start">PROSTŘEDNÍ DÍRKA = tvoje míra</text>
<text x="71" y="191.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#c0392b" text-anchor="start">144,3 mm od hrotu</text>
<text x="71" y="195.8" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#c0392b" text-anchor="start">nastavení ± 50 mm (2 dírky sem i tam)</text>
<text x="71" y="240.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">poslední dírka 194,3 mm od hrotu</text>
<text x="22" y="256.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#6a6a6a" text-anchor="start">sem pokračuje hlavní pás (dole neřezat)</text>
<text x="22" y="261.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Dírky Ø 4,5 mm, 5 kusů, rozteč 25 mm.</text>
<text x="22" y="265.5" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Vrchol je oblouk r = 4 mm, boky jsou na něj tečné — odměřeno z PDF CraftPoint, ne ostrý hrot.</text>
<text x="22" y="269.7" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">CELKOVÁ DÉLKA PÁSU = naměřený obvod + 234,3 mm</text>
<text x="22" y="273.9" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">   (90 mm přehnutý konec u přezky + 144,3 mm od hrotu k prostřední dírce)</text>
<text x="22" y="278.1" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Obvod měř na stávajícím opasku od ohybu u přezky k dírce, kterou nosíš.</text>
<text x="22" y="282.3" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Bez opasku: provlékni poutky kalhot krejčovský metr a utáhni na pohodlí.</text>
<text x="22" y="286.5" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Dírky děruj až po zkoušce na těle. Špičku odřízni jako poslední krok.</text>
<text x="22" y="290.7" font-family="Helvetica, Arial, sans-serif" font-size="3" fill="#2b2b2b" text-anchor="start">Rozvržení odměřeno z PDF generátoru CraftPoint; shodné pro obvod 85 i 95 cm.</text>
</svg>