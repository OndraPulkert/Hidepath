<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1d1d1d}
.t{font-size:5px;font-weight:bold}.h{font-size:3.6px;font-weight:bold}.s{font-size:3px}.xs{font-size:2.5px}
.id{font-size:9px;font-weight:bold;fill:#9a9a9a}
.cut{fill:none;stroke:#000;stroke-width:.3}
.seam{fill:none;stroke:#333;stroke-width:.25;stroke-dasharray:1 1}
.fold{fill:none;stroke:#1f5fa8;stroke-width:.3;stroke-dasharray:4 1 1 1}
.position{fill:none;stroke:#1d7a6c;stroke-width:.25;stroke-dasharray:2.5 1 .5 1}
.trim{fill:none;stroke:#8a5a00;stroke-width:.25;stroke-dasharray:3 2}
.glue{fill:url(#hatch);stroke:none}
.cap{fill:none;stroke:#b0441c;stroke-width:.2;stroke-dasharray:.8 .6}
.hole{fill:#fff;stroke:#b0441c;stroke-width:.3}
.cross{stroke:#b0441c;stroke-width:.2}
</style>
<defs><pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2" stroke="#c9c9c9" stroke-width=".6"/></pattern></defs><rect width="210" height="297" fill="#fff"/><text x="15" y="16" class="t" text-anchor="start">OBRAT R10 · LIST 1 · T1 záda a klopa</text><text x="15" y="22" class="s" text-anchor="start">Tisk A4 na výšku, 100 %, bez přizpůsobení. Obě kontrolní úsečky musí měřit 50 mm.</text><text x="15" y="26" class="s" text-anchor="start">List přiložte na RUB kůže. Šikmá hrana klopy pak po přehnutí stoupá doprava, jak má.</text><g transform="translate(51 36)"><path class="glue" d="M0 71 V146 H108 V71 H102 V141 H5 V71 Z"/><path class="cut" d="M0 8 Q0 0 7.995 0.296 L100.005 3.704 Q108 4 108 12 L108 140 Q108 146 102 146 L6 146 Q0 146 0 140 Z"/><path class="fold" d="M0 56 H108"/><path class="seam" d="M3.5 74 L3.5 140 Q3.5 142.5 6 142.5 L102 142.5 Q104.5 142.5 104.5 140 L104.5 74"/><path class="trim" d="M0 6 L108 10"/><text x="54" y="102" class="id" text-anchor="middle">T1</text><text x="54" y="107" class="s" text-anchor="middle">RUB nahoru</text><text x="54" y="110.6" class="s" text-anchor="middle">záda + klopa, 1 ×</text></g><text x="49.8" y="34.8" class="xs" text-anchor="end">R8</text><text x="160.2" y="38.8" class="xs" text-anchor="start">R8</text><text x="49.8" y="185.6" class="xs" text-anchor="end">R6</text><text x="160.2" y="185.6" class="xs" text-anchor="start">R6</text><text x="166" y="44" class="h" text-anchor="start">Šablona rohu klopy</text><text x="166" y="48" class="xs" text-anchor="start">karton, vystřihnout po plné</text><text x="166" y="51" class="xs" text-anchor="start">čáře; lekce 9: oba rohy</text><text x="166" y="54" class="xs" text-anchor="start">klopy po seříznutí</text><path class="cut" d="M176 58H192V82H168V66A8 8 0 0 1 176 58Z"/><path class="cross" d="M176 58v2.5M168 66h2.5"/><text x="182" y="72" class="h" text-anchor="middle">R8</text><text x="166" y="87" class="xs" text-anchor="start">Ryska = začátek oblouku.</text><text x="166" y="90" class="xs" text-anchor="start">Rovné hrany na bok</text><text x="166" y="93" class="xs" text-anchor="start">a hranu klopy.</text><text x="105" y="188" class="s" text-anchor="middle">108 mm · klopa 56 mm vlevo, 52 mm vpravo od ohybu (s rezervou 6 mm)</text><text x="15" y="196" class="h" text-anchor="start">Postup s listem</text><text x="15" y="201" class="s" text-anchor="start">1. Řežte po plné čáře, klopa má rezervu. Ohyb a lepené pásy rýsujte jen na rubu.</text><text x="15" y="205" class="s" text-anchor="start">2. Linii stehu veďte kružítkem 3,5 mm od hrany.</text><text x="15" y="209" class="s" text-anchor="start">3. Nejdřív obtisk C, pak klopu seřízněte přes obsah (lekce 9): mezera nad pásem 6 mm vlevo, 10 mm vpravo.</text><text x="15" y="213" class="s" text-anchor="start">4. Potom ozdobný šev klopy 3,5 mm od hrany (3 mm před ohybem končí) a objímka C.</text><text x="15" y="223" class="h" text-anchor="start">Legenda</text><path class="cut" d="M15 228H25"/><text x="29" y="229" class="s" text-anchor="start">řez</text><path class="seam" d="M15 233H25"/><text x="29" y="234" class="s" text-anchor="start">linie stehu (vidličky)</text><path class="fold" d="M15 238H25"/><text x="29" y="239" class="s" text-anchor="start">ohyb – rýsovat jen na rubu</text><path class="position" d="M15 243H25"/><text x="29" y="244" class="s" text-anchor="start">poloha dílu – jen na rubu</text><path class="trim" d="M15 248H25"/><text x="29" y="249" class="s" text-anchor="start">klopa po seříznutí – orientačně</text><rect class="glue" x="15" y="251" width="10" height="4"/><text x="29" y="254" class="s" text-anchor="start">lepidlo</text><circle class="cap" cx="20" cy="258" r="2.5"/><circle class="hole" cx="20" cy="258" r="0.6"/><text x="29" y="259" class="s" text-anchor="start">střed otvoru patice (čárkovaně klobouček)</text><circle class="hole" cx="20" cy="263" r="1"/><text x="29" y="264" class="s" text-anchor="start">odlehčovací otvor Ø 2 – vyseknout před řezem</text><path class="cut" d="M122 280H172M122 278V282M172 278V282"/><text x="122" y="285" class="s" text-anchor="start">Kontrola 50 mm vodorovně</text><path class="cut" d="M184 280V230M182 280H186M182 230H186"/><text x="182" y="256" class="xs" text-anchor="end">svisle 50</text></svg>
