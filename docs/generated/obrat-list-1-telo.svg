<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1d1d1d}
.t{font-size:5px;font-weight:bold}.h{font-size:3.6px;font-weight:bold}.s{font-size:3px}.xs{font-size:2.5px}
.id{font-size:9px;font-weight:bold;fill:#9a9a9a}
.cut{fill:none;stroke:#000;stroke-width:.3}
.seam{fill:none;stroke:#333;stroke-width:.25;stroke-dasharray:1 1}
.fold{fill:none;stroke:#1f5fa8;stroke-width:.3;stroke-dasharray:4 1 1 1}
.position{fill:none;stroke:#1d7a6c;stroke-width:.25;stroke-dasharray:2.5 1 .5 1}
.trim{fill:none;stroke:#8a5a00;stroke-width:.25;stroke-dasharray:3 2}
.glue{fill:url(#hatch);stroke:none}
.paper{fill:none;stroke:#555;stroke-width:.25;stroke-dasharray:.6 .6}
.cap{fill:none;stroke:#b0441c;stroke-width:.2;stroke-dasharray:.8 .6}
.hole{fill:#fff;stroke:#b0441c;stroke-width:.3}
.cross{stroke:#b0441c;stroke-width:.2}
</style>
<defs><pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2" stroke="#c9c9c9" stroke-width=".6"/></pattern></defs><rect width="210" height="297" fill="#fff"/><text x="15" y="19" class="t" text-anchor="start">ŠIKMINA · LIST 1 · T1 záda a klopa</text><text x="15" y="25" class="s" text-anchor="start">Tisk A4 na výšku, 100 %, bez přizpůsobení. Obě kontrolní úsečky musí měřit 50 mm.</text><text x="15" y="29" class="s" text-anchor="start">List přiložte na RUB kůže. Šikmá hrana klopy pak po přehnutí stoupá doprava, jak má.</text><g transform="translate(20 36)"><path class="glue" d="M0 71 V146 H108 V71 H103 V141 H5 V71 Z"/><path class="cut" d="M0 8 Q0 0 7.995 0.296 L100.005 3.704 Q108 4 108 12 L108 140 Q108 146 102 146 L6 146 Q0 146 0 140 Z"/><path class="fold" d="M0 56 H108"/><path class="seam" d="M3.5 74 L3.5 140 Q3.5 142.5 6 142.5 L102 142.5 Q104.5 142.5 104.5 140 L104.5 74"/><path class="trim" d="M0 6 L108 10"/><text x="54" y="102" class="id" text-anchor="middle">T1</text><text x="54" y="107" class="s" text-anchor="middle">RUB nahoru</text><text x="54" y="110.6" class="s" text-anchor="middle">záda + klopa, 1 ×</text></g><text x="18.8" y="34.8" class="xs" text-anchor="end">R8</text><text x="129.2" y="38.8" class="xs" text-anchor="start">R8</text><text x="18.8" y="185.6" class="xs" text-anchor="end">R6</text><text x="129.2" y="185.6" class="xs" text-anchor="start">R6</text><text x="142" y="44" class="h" text-anchor="start">Šablona rohu klopy</text><text x="142" y="48" class="xs" text-anchor="start">karton, vystřihnout po plné čáře;</text><text x="142" y="51" class="xs" text-anchor="start">lekce 9: oba rohy klopy</text><text x="142" y="54" class="xs" text-anchor="start">po seříznutí</text><path class="cut" d="M152 60H168V84H144V68A8 8 0 0 1 152 60Z"/><path class="cross" d="M152 60v2.5M144 68h2.5"/><text x="158" y="74" class="h" text-anchor="middle">R8</text><text x="142" y="90" class="xs" text-anchor="start">Ryska = začátek oblouku.</text><text x="142" y="93" class="xs" text-anchor="start">Rovné hrany na bok a hranu klopy.</text><text x="74" y="188" class="s" text-anchor="middle">108 mm · klopa 56 mm vlevo, 52 mm vpravo od ohybu (s rezervou 6 mm)</text><text x="15" y="198" class="h" text-anchor="start">Postup s listem</text><text x="15" y="203" class="s" text-anchor="start">1. Řežte po plné čáře, klopa má rezervu. Ohyb a lepené pásy (5 mm) rýsujte jen na rubu.</text><text x="15" y="207" class="s" text-anchor="start">2. Linii stehu veďte kružítkem 3,5 mm od hrany.</text><text x="15" y="211" class="s" text-anchor="start">3. Nejdřív obtisk C, pak klopu seřízněte přes obsah (lekce 9). Mezera mezi hranou klopy</text><text x="18" y="215" class="s" text-anchor="start">a hřbetem ohybu víčka: cíl 6,5 mm, 15 mm od levého boku (lekce 9).</text><text x="15" y="219" class="s" text-anchor="start">4. Potom ozdobný šev klopy 3,5 mm od hrany (3 mm před ohybem končí) a objímka C.</text><text x="20" y="231" class="h" text-anchor="start">Legenda</text><path class="cut" d="M20 236H30"/><text x="33" y="237" class="xs" text-anchor="start">řez</text><path class="seam" d="M20 241H30"/><text x="33" y="242" class="xs" text-anchor="start">linie stehu (vidličky)</text><path class="fold" d="M20 246H30"/><text x="33" y="247" class="xs" text-anchor="start">ohyb – rýsovat jen na rubu</text><path class="position" d="M20 251H30"/><text x="33" y="252" class="xs" text-anchor="start">poloha dílu – jen na rubu</text><path class="trim" d="M20 256H30"/><text x="33" y="257" class="xs" text-anchor="start">klopa po seříznutí – orientačně</text><rect class="glue" x="20" y="259" width="10" height="4"/><text x="33" y="262" class="xs" text-anchor="start">lepidlo</text><path class="cut" d="M122 276H172M122 274V278M172 274V278"/><text x="122" y="281" class="s" text-anchor="start">Kontrola 50 mm vodorovně</text><path class="cut" d="M184 276V226M182 276H186M182 226H186"/><text x="182" y="252" class="xs" text-anchor="end">svisle 50</text></svg>
