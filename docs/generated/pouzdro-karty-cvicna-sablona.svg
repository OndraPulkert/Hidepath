<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="210mm" height="297mm" viewBox="0 0 210 297"><title>Cvičná šablona – pouzdro na karty, lekce 2</title><rect width="210" height="297" fill="#ffffff"/><g id="CUT" inkscape:groupmode="layer" inkscape:label="CUT"><path class="outline" d="M28.5 62.5 L88.5 62.5 L88.5 102.5 L28.5 102.5 Z" fill="none" stroke="#1f1f1f" stroke-width="0.3"/><path class="outline" d="M28.5 135.5 L78.5 135.5 A10 10 0 0 1 88.5 145.5 L88.5 175.5 L28.5 175.5 Z" fill="none" stroke="#1f1f1f" stroke-width="0.3"/><path class="outline" d="M28.5 208.5 L48.5 208.5 L48.5 210.5 A10 10 0 0 0 68.5 210.5 L68.5 208.5 L88.5 208.5 L88.5 248.5 L28.5 248.5 Z" fill="none" stroke="#1f1f1f" stroke-width="0.3"/><path d="M13.5 279.5 L20.5 279.5" fill="none" stroke="#1f1f1f" stroke-width="0.3"/></g><g id="GUIDE" inkscape:groupmode="layer" inkscape:label="GUIDE"><text x="13.5" y="18.5" font-family="Helvetica, Arial, sans-serif" font-size="4.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">CVIČNÁ ŠABLONA – ŘEZ PODLE PŘILEPENÉ ŠABLONY</text><text x="13.5" y="23.5" font-family="Helvetica, Arial, sans-serif" font-size="2.5" text-anchor="start" fill="#1f1f1f">Pouzdro na karty · lekce 2 Rovný řez kůže · tři tvary na odřezek, ne díly pouzdra</text><text x="13.5" y="29.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">Postup – stejně jako u šablony pouzdra v lekci 5</text><text x="13.5" y="33.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">1. Tiskněte na 100 % a změřte kontrolní úsečku dole: přesně 50 mm.  2. Každý tvar vystřihněte nůžkami</text><text x="13.5" y="36.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">nahrubo po čárkované čáře.  3. Položte ho na rub odřezku a přilepte maskovací páskou na okraji, mimo plnou čáru,</text><text x="13.5" y="40.3" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">z několika stran.  4. Řežte nožem skrz papír i kůži po plné čáře, 2–3 lehké tahy: rovné strany s pravítkem,</text><text x="13.5" y="43.7" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">roh bez pravítka, výřez nakonec krátkými rovnými řezy od čáry k čáře.  5. Pásku strhávejte pomalu. Nic nepropichujte.</text><path class="rough-margin" d="M13.5 47.5 H103.5 V117.5 H13.5 Z" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="3 2"/><text x="15.5" y="52" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#6f6f6f">okraj na vystřižení ~1,5 cm</text><text x="58.5" y="83.5" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#6f6f6f">1</text><text x="58.5" y="89.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#6f6f6f">60 × 40 mm</text><text x="108.5" y="55.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">1 · Obdélník 60 × 40 mm – rovné řezy</text><text x="108.5" y="59.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Všechny čtyři strany řežte s ocelovým pravítkem</text><text x="108.5" y="62.7" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">položeným hranou přesně na plnou čáru.</text><text x="108.5" y="66" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Pravítko leží na tvaru (na dílu, který zůstane),</text><text x="108.5" y="69.3" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">ne na odpadu – když nůž ujede, poškodí odpad.</text><text x="108.5" y="72.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Nůž kolmo k podložce, 2–3 lehké tahy,</text><text x="108.5" y="75.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">řez veďte směrem od volné ruky.</text><path class="rough-margin" d="M13.5 120.5 H103.5 V190.5 H13.5 Z" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="3 2"/><text x="15.5" y="125" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#6f6f6f">okraj na vystřižení ~1,5 cm</text><text x="58.5" y="156.5" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#6f6f6f">2</text><text x="58.5" y="162.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#6f6f6f">60 × 40 mm</text><path d="M78.5 134.5 L78.5 131.5" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M89.5 145.5 L92.5 145.5" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><text x="108.5" y="128.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">2 · Obdélník 60 × 40 mm, roh R10 – oblouk</text><text x="108.5" y="132.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Rovné strany s pravítkem po čáru oblouku</text><text x="108.5" y="135.7" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">(krátké čárky vně obrysu = začátek a konec oblouku).</text><text x="108.5" y="139" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Oblouk řežte pomalu bez pravítka, krátkými tahy,</text><text x="108.5" y="142.3" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">volná ruka otáčí kůží, ne nožem.</text><text x="108.5" y="145.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Přechod z rovné do oblouku má být plynulý,</text><text x="108.5" y="148.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">bez zubu; 2–3 lehké tahy jako u rovných stran.</text><path class="rough-margin" d="M13.5 193.5 H103.5 V263.5 H13.5 Z" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="3 2"/><text x="15.5" y="198" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#6f6f6f">okraj na vystřižení ~1,5 cm</text><text x="58.5" y="229.5" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#6f6f6f">3</text><text x="58.5" y="235.5" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#6f6f6f">60 × 40 mm</text><path class="notch-end" d="M48.5 207.5 L48.5 204.5" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path class="notch-end" d="M68.5 207.5 L68.5 204.5" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><text x="46.5" y="206.5" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="end" fill="#6f6f6f">konec rovného řezu</text><text x="108.5" y="201.5" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">3 · Obdélník 60 × 40 mm s výřezem 20 × 12 mm</text><text x="108.5" y="205.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Výřez na delší straně, dno R10 (vydutý oblouk).</text><text x="108.5" y="208.7" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Krátké čárky nad hranou = konce výřezu: rovný řez</text><text x="108.5" y="212" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">horní hrany veďte s pravítkem jen k nim.</text><text x="108.5" y="215.3" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Nic nepropichujte: vpich na čáře nechá v hraně zoubek.</text><text x="108.5" y="218.6" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Výřez až nakonec, nasekejte ho na</text><text x="108.5" y="221.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">krátké rovné řezy, každý od čáry k čáře (lekce 5).</text><text x="108.5" y="229.2" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">Na odřezek</text><text x="108.5" y="233.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Zbytek juchtové A5 (asi 210 × 80 mm): tvary vedle sebe</text><text x="108.5" y="236.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">po delší straně, 5 mm od kraje, 10 mm od sebe</text><text x="108.5" y="239.7" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">= 210 × 40 mm kůže (s papírovým okrajem</text><text x="108.5" y="243" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">70 mm na výšku); jeden tvar po druhém.</text><path d="M13.5 272 L63.5 272" fill="none" stroke="#6f6f6f" stroke-width="0.4"/><path d="M13.5 269.5 L13.5 274.5" fill="none" stroke="#6f6f6f" stroke-width="0.3"/><path d="M63.5 269.5 L63.5 274.5" fill="none" stroke="#6f6f6f" stroke-width="0.3"/><path class="calibration" d="M13.5 272 L63.5 272" fill="none" stroke="#6f6f6f" stroke-width="0.01"/><text x="38.5" y="268.8" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#1f1f1f">KONTROLNÍ ÚSEČKA 50 mm</text><text x="69.5" y="270.5" font-family="Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="start" fill="#1f1f1f">PRINT AT 100% / ACTUAL SIZE</text><text x="69.5" y="274.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Tisk na 100 % (skutečná velikost), vypnout „přizpůsobit stránce“ · měřítko 1:1</text><text x="22" y="280.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#1f1f1f">CUT řez nožem</text><path d="M58.5 279.5 L65.5 279.5" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="3 2"/><text x="67" y="280.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#6f6f6f">GUIDE okraj na vystřižení nůžkami</text><path d="M138.5 278 L138.5 281" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><text x="141" y="280.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#6f6f6f">krátká čárka = konec řezu, nepropichovat</text></g></svg>
