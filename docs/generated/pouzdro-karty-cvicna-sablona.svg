<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="210mm" height="297mm" viewBox="0 0 210 297"><title>Cvičná šablona – pouzdro na karty, lekce 2</title><rect width="210" height="297" fill="#ffffff"/><g id="CUT" inkscape:groupmode="layer" inkscape:label="CUT"><path class="outline" d="M23 58 L83 58 L83 98 L23 98 Z" fill="none" stroke="#1f1f1f" stroke-width="0.3"/><path class="outline" d="M23 131 L73 131 A10 10 0 0 1 83 141 L83 171 L23 171 Z" fill="none" stroke="#1f1f1f" stroke-width="0.3"/><path class="outline" d="M23 204 L43 204 L43 206 A10 10 0 0 0 63 206 L63 204 L83 204 L83 244 L23 244 Z" fill="none" stroke="#1f1f1f" stroke-width="0.3"/><path d="M8 284.5 L15 284.5" fill="none" stroke="#1f1f1f" stroke-width="0.3"/></g><g id="GUIDE" inkscape:groupmode="layer" inkscape:label="GUIDE"><text x="8" y="13" font-family="Helvetica, Arial, sans-serif" font-size="4.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">CVIČNÁ ŠABLONA – ŘEZ PODLE PŘILEPENÉ ŠABLONY</text><text x="8" y="18" font-family="Helvetica, Arial, sans-serif" font-size="2.5" text-anchor="start" fill="#1f1f1f">Pouzdro na karty · lekce 2 Rovný řez kůže · tři tvary na odřezek, ne díly pouzdra</text><text x="8" y="25" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">Postup – stejně jako u šablony pouzdra v lekci 5</text><text x="8" y="29.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">1. Tiskněte na 100 % a změřte kontrolní úsečku dole: přesně 50 mm.  2. Každý tvar vystřihněte nůžkami</text><text x="8" y="32.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">nahrubo po čárkované čáře.  3. Položte ho na rub odřezku a přilepte maskovací páskou na okraji, mimo plnou čáru,</text><text x="8" y="36.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">z několika stran.  4. Šídlem propíchněte tečky.  5. Řežte nožem skrz papír i kůži po plné čáře, 2–3 lehké tahy:</text><text x="8" y="40" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">rovné strany s pravítkem, roh bez pravítka, výřez nakonec krátkými rovnými řezy od čáry k čáře.  6. Pásku strhávejte pomalu.</text><path class="rough-margin" d="M8 43 H98 V113 H8 Z" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="3 2"/><text x="10" y="47.5" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#6f6f6f">okraj na vystřižení ~1,5 cm</text><text x="53" y="79" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#6f6f6f">1</text><text x="53" y="85" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#6f6f6f">60 × 40 mm</text><text x="103" y="51" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">1 · Obdélník 60 × 40 mm – rovné řezy</text><text x="103" y="54.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Všechny čtyři strany řežte s ocelovým pravítkem</text><text x="103" y="58.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">položeným hranou přesně na plnou čáru.</text><text x="103" y="61.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Pravítko leží na tvaru (na dílu, který zůstane),</text><text x="103" y="64.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">ne na odpadu – když nůž ujede, poškodí odpad.</text><text x="103" y="68.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Nůž kolmo k podložce, 2–3 lehké tahy,</text><text x="103" y="71.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">řez veďte směrem od volné ruky.</text><path class="rough-margin" d="M8 116 H98 V186 H8 Z" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="3 2"/><text x="10" y="120.5" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#6f6f6f">okraj na vystřižení ~1,5 cm</text><text x="53" y="152" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#6f6f6f">2</text><text x="53" y="158" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#6f6f6f">60 × 40 mm</text><path d="M73 130 L73 127" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><path d="M84 141 L87 141" fill="none" stroke="#6f6f6f" stroke-width="0.25"/><text x="103" y="124" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">2 · Obdélník 60 × 40 mm, roh R10 – oblouk</text><text x="103" y="127.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Rovné strany s pravítkem po čáru oblouku</text><text x="103" y="131.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">(krátké čárky vně obrysu = začátek a konec oblouku).</text><text x="103" y="134.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Oblouk řežte pomalu bez pravítka, krátkými tahy,</text><text x="103" y="137.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">volná ruka otáčí kůží, ne nožem.</text><text x="103" y="141.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Přechod z rovné do oblouku má být plynulý,</text><text x="103" y="144.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">bez zubu; 2–3 lehké tahy jako u rovných stran.</text><path class="rough-margin" d="M8 189 H98 V259 H8 Z" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="3 2"/><text x="10" y="193.5" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="start" fill="#6f6f6f">okraj na vystřižení ~1,5 cm</text><text x="53" y="225" font-family="Helvetica, Arial, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#6f6f6f">3</text><text x="53" y="231" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="middle" fill="#6f6f6f">60 × 40 mm</text><circle class="prick" cx="43" cy="204" r="0.7" fill="#1f1f1f"/><circle class="prick" cx="63" cy="204" r="0.7" fill="#1f1f1f"/><text x="41" y="202" font-family="Helvetica, Arial, sans-serif" font-size="2" text-anchor="end" fill="#6f6f6f">propíchnout</text><text x="103" y="197" font-family="Helvetica, Arial, sans-serif" font-size="2.6" font-weight="bold" text-anchor="start" fill="#1f1f1f">3 · Obdélník 60 × 40 mm s výřezem 20 × 12 mm</text><text x="103" y="200.9" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Výřez na delší straně, dno R10 (vydutý oblouk).</text><text x="103" y="204.2" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Nejdřív šídlem propíchněte obě tečky skrz papír</text><text x="103" y="207.5" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">do kůže – dokud je šablona přilepená.</text><text x="103" y="210.8" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Pak rovné strany s pravítkem, výřez až nakonec:</text><text x="103" y="214.1" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">krátké rovné řezy, každý od čáry k čáře (lekce 5).</text><text x="103" y="217.4" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Po sejmutí šablony musí být tečky vidět na rubu.</text><path d="M8 267.5 L58 267.5" fill="none" stroke="#6f6f6f" stroke-width="0.4"/><path d="M8 265 L8 270" fill="none" stroke="#6f6f6f" stroke-width="0.3"/><path d="M58 265 L58 270" fill="none" stroke="#6f6f6f" stroke-width="0.3"/><path class="calibration" d="M8 267.5 L58 267.5" stroke="#6f6f6f" stroke-width="0.01"/><text x="33" y="264.3" font-family="Helvetica, Arial, sans-serif" font-size="2.4" font-weight="bold" text-anchor="middle" fill="#1f1f1f">KONTROLNÍ ÚSEČKA 50 mm</text><text x="64" y="266" font-family="Helvetica, Arial, sans-serif" font-size="3.4" font-weight="bold" text-anchor="start" fill="#1f1f1f">PRINT AT 100% / ACTUAL SIZE</text><text x="64" y="270" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Tisk na 100 % (skutečná velikost), vypnout „přizpůsobit stránce“ · měřítko 1:1</text><text x="8" y="275" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">Na zbytek juchtové A5 (asi 210 × 80 mm): tvary vedle sebe po delší straně, 5 mm od kraje,</text><text x="8" y="279" font-family="Helvetica, Arial, sans-serif" font-size="2.3" text-anchor="start" fill="#1f1f1f">10 mm od sebe = 210 × 40 mm kůže (s papírovým okrajem 70 mm na výšku); jeden tvar po druhém.</text><text x="16.5" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#1f1f1f">CUT řez nožem</text><path d="M53 284.5 L60 284.5" fill="none" stroke="#6f6f6f" stroke-width="0.25" stroke-dasharray="3 2"/><text x="61.5" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#6f6f6f">GUIDE okraj na vystřižení nůžkami</text><circle cx="133" cy="284.5" r="0.7" fill="#1f1f1f"/><text x="135.5" y="285.3" font-family="Helvetica, Arial, sans-serif" font-size="2.2" text-anchor="start" fill="#6f6f6f">tečka = propíchnout šídlem</text></g></svg>
