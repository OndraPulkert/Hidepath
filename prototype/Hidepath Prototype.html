document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"229fa88d-7f76-4e10-8e8b-c9924a525eb6\"><\u002Fscript>\n<script src=\"39ecf0a9-0529-4b5a-ab0b-f62dc13d5a02\"><\u002Fscript>\n<style>\n:root{\n--hp-canvas:#F4EFE6;--hp-parchment:#E7DCCB;--hp-paper:#FBF8F2;--hp-cognac:#A85F32;--hp-cognac-deep:#7E4423;--hp-cognac-tint:#F1E1D3;--hp-leather:#2B211C;--hp-forest:#33483B;--hp-forest-tint:#E1E7E0;--hp-brass:#B08A57;--hp-success:#5E7A5B;--hp-success-tint:#E4EBE1;--hp-ink-2:#6B5F57;--hp-line:rgba(43,33,28,.14);--hp-line-strong:rgba(43,33,28,.34);\n--hp-serif:\"Spectral\",Georgia,serif;--hp-sans:\"Albert Sans\",system-ui,sans-serif;--hp-r:10px;--hp-r-lg:16px;\n--color-bg:var(--hp-canvas);--color-surface:var(--hp-paper);--color-text:var(--hp-leather);--color-accent:var(--hp-cognac);--color-accent-600:#8F5029;--color-accent-700:var(--hp-cognac-deep);--color-accent-100:var(--hp-cognac-tint);--color-accent-800:#5A3018;--color-accent-2:var(--hp-forest);--color-accent-2-100:var(--hp-forest-tint);--color-accent-2-800:#22302A;--color-divider:var(--hp-line);\n--font-heading:var(--hp-serif);--font-heading-weight:500;--font-body:var(--hp-sans);--radius-md:var(--hp-r);--radius-lg:var(--hp-r-lg)}\nbody{margin:0;background:var(--hp-canvas);color:var(--hp-leather);font-family:var(--hp-sans);-webkit-font-smoothing:antialiased;font-size:15px}\nh1,h2,h3,h4{letter-spacing:0;line-height:1.15}\na{color:var(--hp-cognac)}a:hover{color:var(--hp-cognac-deep)}\nbutton{font-family:inherit;cursor:pointer}\ninput,textarea{font-family:inherit}\n.card,.dialog{border-radius:var(--hp-r-lg)}\n.btn{font-family:var(--hp-sans);font-weight:600;font-size:15px;min-height:44px;padding:10px 20px;border-radius:var(--hp-r)}\n.tag,.seg,.input{border-radius:var(--hp-r)}\n.btn-primary{color:#fff}\n.btn-secondary{border-color:var(--hp-line-strong)}\n.washed{filter:saturate(.72) contrast(.92) brightness(1.04)}\n@keyframes hpIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n\n<!-- ═══ NAV ═══ -->\n<sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ true }}\">\n<header class=\"nav\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:14px clamp(16px,4vw,48px);border-bottom:1px solid var(--hp-line);background:var(--hp-canvas);position:sticky;top:0;z-index:5\">\n  <a href=\"#\" sc-camel-on-click=\"{{ goDashboard }}\" style=\"display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--hp-leather);margin-right:auto\">\n    <span style=\"font-family:var(--hp-serif);font-weight:600;font-size:22px;letter-spacing:.01em\">Hidepath<\u002Fspan>\n    <span style=\"font-family:var(--hp-serif);font-style:italic;font-size:13px;color:var(--hp-ink-2)\">From first cut to finished craft.<\u002Fspan>\n  <\u002Fa>\n  <nav style=\"display:flex;gap:4px;flex-wrap:wrap\">\n    <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"4\">\n      <button sc-camel-on-click=\"{{ n.go }}\" style=\"{{ n.style }}\" style-hover=\"background:var(--hp-parchment)\">{{ n.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n<\u002Fheader>\n<\u002Fsc-if>\n\n<main style=\"flex:1;width:100%;max-width:1200px;margin:0 auto;padding:clamp(16px,3vw,40px) clamp(16px,4vw,48px) 96px;box-sizing:border-box\">\n\n<!-- ═══ 1 ONBOARDING ═══ -->\n<sc-if value=\"{{ is.onboarding }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Onboarding\" style=\"max-width:920px;margin:0 auto;animation:hpIn .35s ease\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:28px\">\n    <div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font-family:var(--hp-serif);font-weight:600;font-size:22px\">Hidepath<\u002Fspan><span style=\"font-family:var(--hp-serif);font-style:italic;font-size:13px;color:var(--hp-ink-2)\">From first cut to finished craft.<\u002Fspan><\u002Fdiv>\n    <span style=\"font-size:12px;color:var(--hp-ink-2);letter-spacing:.06em;text-transform:uppercase\">Krok {{ obStep }} ze 2<\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ ob1 }}\" hint-placeholder-val=\"{{ true }}\">\n  <h1 style=\"font-family:var(--hp-serif);font-weight:500;font-size:clamp(32px,4.5vw,48px);margin:0 0 12px;text-wrap:pretty\">Vyrobíte si první kožený výrobek. Krok za krokem, od nákupu po poslední steh.<\u002Fh1>\n  <p style=\"font-size:17px;color:var(--hp-ink-2);max-width:60ch;margin:0 0 36px;line-height:1.55\">Nepotřebujete žádné zkušenosti ani nástroje. Hidepath vám řekne, co přesně koupit, jak si připravit stůl a co udělat právě teď.<\u002Fp>\n  <h2 style=\"font-family:var(--hp-serif);font-weight:500;font-size:22px;margin:0 0 14px\">Vyberte první projekt<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n    <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ p.pick }}\" disabled=\"{{ p.disabled }}\" style=\"{{ p.style }}\" style-hover=\"border-color:var(--hp-cognac)\">\n        <div style=\"height:150px;border-radius:var(--hp-r);overflow:hidden\" class=\"washed\"><image-slot id=\"{{ p.slot }}\" shape=\"rounded\" radius=\"10\" placeholder=\"{{ p.photo }}\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><span style=\"font-family:var(--hp-serif);font-size:21px;font-weight:500\">{{ p.name }}<\u002Fspan><span style=\"{{ p.badgeStyle }}\">{{ p.badge }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:13px;color:var(--hp-ink-2)\">\n          <div><div style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase\">Obtížnost<\u002Fdiv><div style=\"color:var(--hp-leather);font-weight:600\">{{ p.level }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase\">Čas<\u002Fdiv><div style=\"color:var(--hp-leather);font-weight:600\">{{ p.time }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase\">Vybavení<\u002Fdiv><div style=\"color:var(--hp-leather);font-weight:600\">{{ p.cost }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ ob2 }}\" hint-placeholder-val=\"{{ false }}\">\n  <h1 style=\"font-family:var(--hp-serif);font-weight:500;font-size:clamp(30px,4vw,42px);margin:0 0 12px\">Co už máte doma?<\u002Fh1>\n  <p style=\"font-size:16px;color:var(--hp-ink-2);max-width:60ch;margin:0 0 28px\">Tyhle věci se běžně najdou v domácnosti. Zaškrtněte, co máte, a nákupní seznam se o to zkrátí. Cokoliv jde později změnit.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:32px\">\n    <sc-for list=\"{{ homeItems }}\" as=\"h\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ h.toggle }}\" style=\"{{ h.style }}\" style-hover=\"border-color:var(--hp-cognac)\">\n        <span style=\"{{ h.boxStyle }}\">{{ h.mark }}<\u002Fspan>\n        <span style=\"text-align:left\"><div style=\"font-weight:600;font-size:15px\">{{ h.name }}<\u002Fdiv><div style=\"font-size:13px;color:var(--hp-ink-2)\">{{ h.hint }}<\u002Fdiv><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center\">\n    <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ finishOnboarding }}\">Připravit můj plán<\u002Fbutton>\n    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ obBack }}\">Zpět<\u002Fbutton>\n    <span style=\"font-size:13px;color:var(--hp-ink-2)\">Máte {{ homeCount }} z {{ homeTotal }} běžných věcí<\u002Fspan>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ═══ 2 DASHBOARD ═══ -->\n<sc-if value=\"{{ is.dashboard }}\" hint-placeholder-val=\"{{ true }}\">\n<section data-screen-label=\"Dashboard\" style=\"animation:hpIn .35s ease\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px\">\n    <div>\n      <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2);margin-bottom:6px\">Projekt 01 · Pouzdro na karty<\u002Fdiv>\n      <h1 style=\"font-family:var(--hp-serif);font-weight:500;font-size:clamp(28px,3.5vw,40px);margin:0\">Dobrý den. Jste ve fázi <em style=\"color:var(--hp-cognac)\">{{ phaseName }}<\u002Fem>.<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:28px;flex-wrap:wrap\">\n      <div><div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">Celá cesta<\u002Fdiv><div style=\"font-family:var(--hp-serif);font-size:28px;font-weight:500;line-height:1.1\">{{ overallPct }} %<\u002Fdiv><div style=\"font-size:12px;color:var(--hp-ink-2)\">fáze {{ phaseN }} ze 6<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">Aktuální fáze · {{ phaseName }}<\u002Fdiv><div style=\"font-family:var(--hp-serif);font-size:28px;font-weight:500;line-height:1.1;color:var(--hp-cognac)\">{{ phasePct }} %<\u002Fdiv><div style=\"font-size:12px;color:var(--hp-ink-2)\">{{ phaseDetail }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- journey rail -->\n  <ol style=\"list-style:none;margin:0 0 28px;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px\">\n    <sc-for list=\"{{ phases }}\" as=\"ph\" hint-placeholder-count=\"6\">\n      <li style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"{{ ph.barStyle }}\"><span style=\"{{ ph.fillStyle }}\"><\u002Fspan><\u002Fspan>\n        <span style=\"display:flex;gap:8px;align-items:baseline\"><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--hp-ink-2)\">{{ ph.code }}<\u002Fspan><span style=\"{{ ph.labelStyle }}\">{{ ph.name }}<\u002Fspan><\u002Fspan>\n      <\u002Fli>\n    <\u002Fsc-for>\n  <\u002Fol>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:stretch\">\n    <!-- continue card -->\n    <article class=\"card\" style=\"grid-column:span 2;grid-row:span 2;background:var(--hp-leather);color:var(--hp-canvas);padding:28px;border-radius:var(--hp-r-lg);display:flex;flex-direction:column;gap:18px;min-height:320px;position:relative;overflow:hidden\">\n      <div style=\"position:absolute;inset:auto -40px -60px auto;width:320px;height:320px;border-radius:50%;border:1px dashed rgba(244,239,230,.18)\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:auto -80px -110px auto;width:420px;height:420px;border-radius:50%;border:1px dashed rgba(244,239,230,.12)\"><\u002Fdiv>\n      <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-brass)\">Pokračovat tam, kde jsem skončil<\u002Fdiv>\n      <h2 style=\"font-family:var(--hp-serif);font-weight:500;font-size:clamp(26px,3vw,34px);margin:0;max-width:22ch;text-wrap:pretty\">{{ nextTask.title }}<\u002Fh2>\n      <p style=\"margin:0;font-size:15px;color:rgba(244,239,230,.78);max-width:52ch;line-height:1.55\">{{ nextTask.body }}<\u002Fp>\n      <div style=\"margin-top:auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center;position:relative\">\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ nextTask.go }}\">{{ nextTask.cta }}<\u002Fbutton>\n        <span style=\"font-size:13px;color:rgba(244,239,230,.6)\">{{ nextTask.meta }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <!-- equipment -->\n    <button sc-camel-on-click=\"{{ goShop }}\" class=\"card\" style=\"text-align:left;border:1px solid var(--hp-line);background:var(--hp-paper);padding:22px;gap:10px;cursor:pointer\" style-hover=\"border-color:var(--hp-cognac)\">\n      <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">Vybavení<\u002Fdiv>\n      <div style=\"font-family:var(--hp-serif);font-size:30px;font-weight:500\">{{ haveCount }} <span style=\"font-size:18px;color:var(--hp-ink-2)\">z {{ totalCount }} položek připraveno<\u002Fspan><\u002Fdiv>\n      <div style=\"height:6px;border-radius:3px;background:var(--hp-parchment);overflow:hidden\"><div style=\"{{ readyBarStyle }}\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--hp-ink-2)\">{{ orderedCount }} objednáno · {{ wantCount }} k nákupu · nezbytné: {{ essentialReady }}<\u002Fdiv>\n    <\u002Fbutton>\n\n    <!-- budget -->\n    <div class=\"card\" style=\"border:1px solid var(--hp-line);background:var(--hp-paper);padding:22px;gap:10px\">\n      <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">Orientační zbývající rozpočet<\u002Fdiv>\n      <div style=\"font-family:var(--hp-serif);font-size:30px;font-weight:500\">{{ remainingBudget }}<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--hp-ink-2)\">Nezbytné {{ remainingEssential }} · doporučené {{ remainingRecommended }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- project preview -->\n    <button sc-camel-on-click=\"{{ goProject }}\" class=\"card\" style=\"text-align:left;border:1px solid var(--hp-line);background:var(--hp-paper);padding:0;overflow:hidden;cursor:pointer;gap:0\" style-hover=\"border-color:var(--hp-cognac)\">\n      <div style=\"height:160px\" class=\"washed\"><image-slot id=\"dash-project\" shape=\"rect\" placeholder=\"Fotka hotového pouzdra na karty, detail stehu\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"padding:16px 20px 20px;display:flex;flex-direction:column;gap:4px\">\n        <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">První projekt<\u002Fdiv>\n        <div style=\"font-family:var(--hp-serif);font-size:22px;font-weight:500\">Pouzdro na karty<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--hp-ink-2)\">Začátečník · 4–6 h · 6 lekcí · šablona 1:1<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fbutton>\n\n    <!-- shortcuts -->\n    <div class=\"card\" style=\"border:1px solid var(--hp-line);background:var(--hp-paper);padding:22px;gap:12px\">\n      <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">Kam dál<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <button sc-camel-on-click=\"{{ goShop }}\" style=\"display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--hp-line);border-radius:8px;background:transparent;font-size:15px;font-weight:500;color:var(--hp-leather)\" style-hover=\"background:var(--hp-parchment)\"><span>Nákupní seznam<\u002Fspan><span style=\"color:var(--hp-ink-2);font-size:13px\">{{ wantCount }} k nákupu →<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goWorkshop }}\" style=\"display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--hp-line);border-radius:8px;background:transparent;font-size:15px;font-weight:500;color:var(--hp-leather)\" style-hover=\"background:var(--hp-parchment)\"><span>Moje dílna<\u002Fspan><span style=\"color:var(--hp-ink-2);font-size:13px\">{{ haveCount }} položek →<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goProject }}\" style=\"display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--hp-line);border-radius:8px;background:transparent;font-size:15px;font-weight:500;color:var(--hp-leather)\" style-hover=\"background:var(--hp-parchment)\"><span>Lekce<\u002Fspan><span style=\"color:var(--hp-ink-2);font-size:13px\">{{ doneLessons }} z {{ totalLessons }} hotovo →<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ═══ 3 SHOPPING LIST ═══ -->\n<sc-if value=\"{{ is.shop }}\" hint-placeholder-val=\"{{ false }}\">\n<section data-screen-label=\"Nákupní seznam\" style=\"animation:hpIn .35s ease\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:start\">\n    <div style=\"grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px\">\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2);margin-bottom:6px\">Pouzdro na karty · Vybavení<\u002Fdiv>\n        <h1 style=\"font-family:var(--hp-serif);font-weight:500;font-size:clamp(28px,3.5vw,40px);margin:0\">Nákupní seznam<\u002Fh1>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:4px;flex-wrap:wrap;padding:4px;border:1px solid var(--hp-line);border-radius:var(--hp-r);background:var(--hp-paper)\" role=\"tablist\" aria-label=\"Filtr podle stavu\">\n        <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ f.set }}\" style=\"{{ f.style }}\" style-hover=\"background:var(--hp-parchment)\">{{ f.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- readiness -->\n    <aside class=\"card\" style=\"grid-column:1/-1;border:1px solid var(--hp-line);background:var(--hp-paper);padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;align-items:center\">\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">Připravenost na první lekci<\u002Fdiv>\n        <div style=\"font-family:var(--hp-serif);font-size:34px;font-weight:500;line-height:1.1\">{{ readyPct }} %<\u002Fdiv>\n        <div style=\"height:8px;border-radius:4px;background:var(--hp-parchment);overflow:hidden;margin-top:8px;display:flex\"><div style=\"{{ readyBarStyle }}\"><\u002Fdiv><div style=\"{{ orderedBarStyle }}\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--hp-ink-2);margin-top:6px\">Tmavá část = mám · světlá = objednáno<\u002Fdiv>\n      <\u002Fdiv>\n      <div><div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">Nezbytné<\u002Fdiv><div style=\"font-family:var(--hp-serif);font-size:26px;font-weight:500\">{{ essentialReady }}<\u002Fdiv><div style=\"font-size:13px;color:var(--hp-ink-2)\">bez nich nelze začít šít<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">Očekávané náklady<\u002Fdiv><div style=\"font-family:var(--hp-serif);font-size:26px;font-weight:500\">{{ remainingBudget }}<\u002Fdiv><div style=\"font-size:13px;color:var(--hp-ink-2)\">za položky, které ještě nemáte<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:14px;color:var(--hp-ink-2);line-height:1.5;max-width:34ch\">{{ shopHint }}<\u002Fdiv>\n    <\u002Faside>\n\n    <!-- groups -->\n    <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n      <div style=\"{{ g.style }}\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--hp-line-strong);margin-bottom:8px\">\n          <h2 style=\"font-family:var(--hp-serif);font-weight:500;font-size:22px;margin:0\">{{ g.title }}<\u002Fh2>\n          <span style=\"font-size:13px;color:var(--hp-ink-2)\">{{ g.sub }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ g.empty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:18px 0;font-size:14px;color:var(--hp-ink-2)\">Žádná polo :var(--hp-ink-2);text-wrap:pretty\">Dvě kapsy na čtyři až šest karet, ručně šité sedlářským stehem. Malý projekt, na kterém se naučíte všechno, co potřebujete pro peněženku nebo pásek.<\u002Fp>\n      <\u002Fdiv>\n      <dl style=\"margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px\">\n        <div><dt style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--hp-ink-2)\">Obtížnost<\u002Fdt><dd style=\"margin:2px 0 0;font-family:var(--hp-serif);font-size:20px\">Začátečník<\u002Fdd><\u002Fdiv>\n        <div><dt style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--hp-ink-2)\">Čas výroby<\u002Fdt><dd style=\"margin:2px 0 0;font-family:var(--hp-serif);font-size:20px\">4–6 hodin<\u002Fdd><\u002Fdiv>\n        <div><dt style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--hp-ink-2)\">Vybavení<\u002Fdt><dd style=\"margin:2px 0 0;font-family:var(--hp-serif);font-size:20px\">{{ haveCount }} / {{ totalCount }}<\u002Fdd><\u002Fdiv>\n      <\u002Fdl>\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2);margin-bottom:8px\">Naučíte se<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{ techniques }}\" as=\"t\" hint-placeholder-count=\"5\"><span style=\"padding:6px 12px;border:1px solid var(--hp-line-strong);border-radius:8px;font-size:13px\">{{ t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goNextLesson }}\">{{ projectCta }}<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ downloadTemplate }}\">Stáhnout šablonu 1:1 (PDF)<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goShop }}\">Potřebné vybavení<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ toast }}\" hint-placeholder-val= --hp-r);background:var(--hp-canvas);position:relative;overflow:hidden\">\n          <div style=\"position:absolute;left:14%;top:14%;width:72%;height:44%;border:1.5px solid var(--hp-leather);border-radius:8px\"><\u002Fdiv>\n          <div style=\"position:absolute;left:14%;top:44%;width:72%;height:42%;border:1.5px solid var(--hp-leather);border-radius:8px;background:rgba(43,33,28,.04)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:18%;top:50%;width:64%;height:0;border-top:1.5px dashed var(--hp-cognac)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:18%;top:50%;width:0;height:32%;border-left:1.5px dashed var(--hp-cognac)\"><\u002Fdiv>\n          <div style=\"position:absolute;right:18%;top:50%;width:0;height:32%;border-left:1.5px dashed var(--hp-cognac)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:18%;bottom:14%;width:64%;height:0;border-top:1.5px dashed var(--hp-cognac)\"><\u002Fdiv>\n          <div style=\"position:absolute;right:8px;bottom:6px;font-family:ui-monospace,monospace;font-size:10px;color:var(--hp-ink-2)\">100 × 70 mm · 2 díly · rozteč 3,85 mm · nit 0,6 mm<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;color:var(--hp-ink-2)\">Tisk na A4 bez přizpůsobení velikosti. Kontrolní úsečka 50 mm na okraji.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"border:1px solid var(--hp-line);background:var(--hp-paper);padding:20px;gap:8px\">\n        <div style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hp-ink-2)\">Potřebné vybavení<\u002Fdiv>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ equipmentList }}\" as=\"e\" hint-placeholder-count=\"6\"><li style=\"display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--hp-line)\"><span style=\"{{ e.style }}\">{{ e.name }}<\u002Fspan><span style=\"{{ e.stateStyle }}\">{{ e.state }}<\u002Fspan><\u002Fli><\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;onboarding&quot;,&quot;dashboard&quot;,&quot;shop&quot;,&quot;item&quot;,&quot;workshop&quot;,&quot;lesson&quot;,&quot;project&quot;],&quot;section&quot;:&quot;Prototyp&quot;},&quot;showEnglishTerms&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Obsah&quot;}}\">\nconst ITEMS = [\n {id:'leather',cat:'Materiál',group:'ess',name:'Kůže – třísločiněná hovězina 1,2–1,5 mm',en:'Veg-tan leather',why:'Z ní pouzdro vzniká. Tloušťka 1,2–1,5 mm se dobře řeže i šije a drží tvar.',lo:350,hi:600,photo:'Kus přírodní třísločiněné kůže, povrch zblízka',projects:['Pouzdro na karty','Klíčenka','Peněženka bifold']},\n {id:'knife',cat:'Řezání',group:'ess',name:'Odlamovací nůž s novou čepelí',en:'Utility knife',why:'Na rovné řezy kůže. Stačí kvalitní odlamovací nůž, kožařský nůž nepotřebujete.',lo:80,hi:250,photo:'Odlamovací nůž na řezací podložce',projects:['Všechny projekty']},\n {id:'ruler',cat:'Řezání',group:'ess',name:'Kovové pravítko 30 cm',en:'Steel ruler',why:'Vede čepel při řezu. Plastové pravítko nůž poškodí a zkřiví řez.',lo:60,hi:150,photo:'Ocelové pravítko na kůži',projects:['Všechny projekty']},\n {id:'mat',cat:'Řezání',group:'ess',name:'Řezací podložka A3',en:'Cutting mat',why:'Chrání stůl a čepel. A3 stačí na všechny první projekty.',lo:200,hi:400,photo:'Zelená řezací podložka s mřížkou',projects:['Všechny projekty']},\n {id:'irons',cat:'Šití',group:'ess',name:'Děrovací vidličky 3,85 mm',en:'Pricking irons / stitching chisels',why:'Prorazí řadu pravidelných otvorů pro steh. Bez nich nejde ručně šít rovně.',lo:400,hi:1200,photo:'Sada děrovacích vidliček 2 a 6 hrotů',projects:['Pouzdro na karty','Peněženka bifold','Pásek na hodinky']},\n {id:'needles',cat:'Šití',group:'ess',name:'Sedlářské jehly, 2 ks',en:'Harness needles',why:'Tupé jehly s velkým očkem, na sedlářský steh potřebujete dvě najednou.',lo:50,hi:120,photo:'Dvě sedlářské jehly s nití',projects:['Všechny šité projekty']},\n {id:'thread',cat:'Šití',group:'ess',name:'Voskovaná nit 0,6 mm',en:'Waxed thread',why:'Polyesterová voskovaná nit drží uzly a neroztřepí se. Přibližně 0,6 mm sedí k rozteči 3,85 mm.',lo:120,hi:250,photo:'Cívka voskované nitě, přírodní odstín',projects:['Všechny šité projekty']},\n {id:'maul',cat:'Šití',group:'ess',name:'Palička',en:'Maul / mallet',why:'Na vidličky se tluče paličkou z plastu nebo hrubé kůže, kovové kladivo hroty zničí.',lo:250,hi:600,photo:'Kožařská palička na stole',projects:['Všechny šité projekty']},\n {id:'glue',cat:'Lepení',group:'rec',name:'Kontaktní lepidlo na kůži',en:'Contact cement',why:'Přidrží díly u sebe před děrováním, aby se neposunuly. Jde nahradit oboustrannou páskou.',lo:100,hi:200,photo:'Tuba kontaktního lepidla',projects:['Pouzdro na karty','Peněženka bifold']},\n {id:'tokonole',cat:'Úprava hran',group:'rec',name:'Pasta na hrany + leštítko',en:'Tokonole + burnisher',why:'Zahladí a zaleští řezané hrany. Bez toho pouzdro funguje, ale vypadá nedodělaně.',lo:200,hi:350,photo:'Dřevěné leštítko a kelímek pasty',projects:['Všechny projekty']},\n {id:'divider',cat:'Šití',group:'rec',name:'Rýsovací kružítko',en:'Wing divider',why:'Vyrýsuje linii stehu ve stálé vzdálenosti od hrany. Nahradí ho pravítko a tupé šídlo.',lo:150,hi:400,photo:'Kovové rýsovací kružítko',projects:['Peněženka bifold','Pásek na hodinky']},\n {id:'beveler',cat:'Úprava hran',group:'later',name:'Ořezávač hran',en:'Edge beveler',why:'Srazí ostrou hranu do oblouku. Pro první projekt stačí hrany jen zaleštit.',lo:300,hi:700,photo:'Ořezávač hran velikost 1',projects:['Peněženka bifold','Pásek na hodinky']},\n];\nconst IRONS_DETAIL = {\n purpose:'Děrovací vidličky vytlačí do kůže řadu šikmých otvorů ve stejné rozteči. Sedlářský steh se pak šije právě těmito otvory, takže je rovný a pravidelný i bez cviku. Použijete je na každém šitém projektu.',\n spec:[['Rozteč','3,85 mm (přibližně 7 stehů na palec)'],['Nit','voskovaná, přibližně 0,6 mm'],['Sada','2 hroty na rohy + 6 hrotů na rovné úseky'],['Tvar hrotu','diamantový nebo šikmý „francouzský“, leštěný'],['Materiál','nástrojová ocel, ne pozink'],['Podložka','tvrdý plast (HDPE) pod kůži, ne řezací podložka']],\n watch:['Rozteč se udává různě: 3,85 mm mezi hroty odpovídá asi 7 SPI. Neplést s šířkou hrotu.','Neleštěné hroty kůži trhají místo řezání a steh je pak roztřepený.','Tlučte paličkou, ne kovovým kladivem. Hroty se jinak ohnou.','Kupte obě velikosti (2 a 6). S jednou velikostí rohy nevyjdou.'],\n avoid:[{what:'Sedlářské kolečko + šídlo',why:'pro začátečníka pomalé a nepravidelné, hodí se až později'},{what:'Vidličky s plochými širokými hroty (lacing chisel)',why:'jsou na tkanice, ne na šití, otvory jsou příliš velké'},{what:'Rozteč 3 mm s nití 0,6 mm',why:'k jemné rozteči patří tenčí nit 0,4–0,5 mm; pro první projekt zůstaňte u 3,85 mm a 0,6 mm'},{what:'Sady s jediným hrotem',why:'otvory nevyjdou rovnoměrně'}],\n alts:[{what:'Poloviční sada 2 + 4 hroty',why:'ušetří asi 200 Kč, rovné úseky děrujete na více úderů'},{what:'Půjčit si na první projekt',why:'kožařské dílny a kurzy někdy půjčují, ověřte rozteč 3,85 mm'}],\n links:[{name:'Sada vidliček 3,85 mm, 2 + 6 hrotů, leštěná ocel',note:'Střední třída, doporučeno pro začátek',price:'690 Kč'},{name:'Vidličky 3,85 mm francouzský styl, sada 2 + 6',note:'Vyšší třída, jemnější šikmý steh',price:'1 190 Kč'},{name:'Základní sada 3,85 mm, 2 + 4 hroty',note:'Nejlevnější použitelná varianta',price:'420 Kč'}],\n};\nconst GENERIC_DETAIL = (it)=>({\n purpose:it.why,\n spec:[['Pro pouzdro na karty','základní varianta stačí'],['Cena','od '+fmt(it.lo)]],\n watch:['Podrobný průvodce pro tuto položku se připravuje. Zatím platí: kupte základní, ale značkovou variantu.'],\n avoid:[{what:'Nejlevnější sady „vše v jednom“',why:'obsahují nástroje špatné kvality, které stejně vyměníte'}],\n alts:[{what:'Domácí varianta',why:'pokud věc máte, použijte ji; kupujte až když nestačí'}],\n links:[{name:'Doporučená varianta',note:'Obchod s kožařskými potřebami',price:fmt(it.lo)+'–'+fmt(it.hi)}],\n});\nconst LESSONS = [\n {id:'L1',phase:'Příprava místa',title:'Příprava pracovního místa',time:'15 min',videoLen:'2:40',goal:'Mít stůl, na kterém se dá bezpečně řezat a bušit, a všechno po ruce.',needs:['mat','maul','knife','ruler'],photo:'Uklizený stůl s podložkou, nástroje vyrovnané u okraje',\n  steps:[['Vyberte pevný stůl','Kuchyňský stůl stačí, pokud se neviklá. Vratké desky rozhodí děrování.'],['Položte řezací podložku','Mřížkou nahoru, kratší stranou k sobě. Pod ni nic nedávejte.'],['Připravte tvrdou podložku na děrování','Kus HDPE nebo tvrdý plastový blok vedle řezací podložky. Do řezací podložky se neděruje.'],['Světlo zleva nebo zepředu','Stín ruky nesmí padat na linii řezu.'],['Nástroje vpravo, materiál vlevo','Nebo naopak pro leváky. Nůž vždy se zasunutou čepelí.']],\n  mistakes:['Řezání na dřevěné desce bez podložky','Děrování do měkké řezací podložky, hroty se zabořují a kůže se trhá'],safety:['Čepel po každém řezu zasuňte.','Malé děti a zvířata mimo dosah stolu, odřezky čepelí do plechovky.'],\n  checks:['Podložka leží celá na desce a neklouže.','Tvrdá děrovací podložka je připravená vedle.','Nůž má novou čepel a zasouvá se.']},\n {id:'L2',phase:'Trénink na odřezku',title:'Rovný řez kůže',time:'20 min',videoLen:'4:10',goal:'Uříznout rovný proužek 20 × 100 mm na jeden až dva tahy s kolmou hranou.',needs:['leather','knife','ruler','mat'],photo:'Ruka vede odlamovací nůž podél ocelového pravítka na kůži',\n  steps:[['Narýsujte linii','Tupou stranou šídla nebo tužkou lehce na líc kůže. Nekreslit fixem.'],['Přitiskněte pravítko celou dlaní','Prsty mimo hranu pravítka. Pravítko leží na té části kůže, kterou chcete zachovat.'],['První tah lehce','Jen prořízněte povrch. Vede čepel, ne síla.'],['Druhý tah skrz','Čepel drží stejný úhel, ruka tahá k sobě, ne od sebe.'],['Zkontrolujte hranu','Kolmá, bez „schodu“. Pokud je šikmá, čepel jste nakláněli.']],\n  mistakes:['Řez na jeden silný tah, čepel uteče ze směru','Pravítko na odpadové straně, uklouznutí pak zničí díl','Tupá čepel: hranu trhá, měňte ji po každých 5–6 řezech'],safety:['Čepel vždy táhněte směrem od druhé ruky.','Prsty nikdy nepřesahují hranu pravítka.'],\n  checks:['Proužek má obě strany rovnoběžné, rozdíl do 0,5 mm.','Hrana je kolmá, žádný šikmý sráz.','Řez šel skrz najednou, nebylo nutné „dořezávat“.']},\n {id:'L3',phase:'Trénink na odřezku',title:'Děrování vidličkami',time:'20 min',videoLen:'5:05',goal:'Vyrazit rovnou řadu otvorů s roztečí 3,85 mm, 3,5 mm od hrany, bez vynechání a zdvojení.',needs:['leather','irons','maul','divider'],photo:'Děrovací vidlička s 6 hroty přiložená k rýsované lince, palička nad ní',\n  steps:[['Vyrýsujte linii stehu','Kružítkem nastaveným na 3,5 mm táhněte podél hrany. Bez kružítka: pravítko a tupé šídlo.'],['Přiložte 6hrotovou vidličku','Hroty přesně na linii, první hrot na začátku řady. Vidličku držte kolmo, dívejte se ze strany.'],['Dva až tři údery paličkou','Střední síla. Hroty musí projít skrz, ne jen vtisknout.'],['Vytáhněte kolmo','Lehce zakývat dopředu-dozadu ve směru řady, ne do strany.'],['Posuňte a zahákněte','Poslední hrot vložte do posledního vyraženého otvoru. Tím drží rozteč.'],['Rohy 2hrotovou vidličkou','Kratší nástroj dostane řadu až k rohu a do zaoblení.']],\n  mistakes:['Nakloněná vidlička: otvory na rubu utečou od linie','Slabé údery: hroty neprojdou a jehla se pak nedostane skrz','Zapomenuté zaháknutí posledního hrotu, rozteč se rozjede'],safety:['Podložte tvrdou podložkou, ne rukou.','Palička jen na hlavu vidličky; prsty držte pod úrovní úderu.'],\n  checks:['Otvory jsou skrz, na rubu vidíte světlo v každém.','Řada je v jedné linii i na rubu.','Vzdálenost od hrany je všude stejná, 3,5 mm.']},\n {id:'L4',phase:'Trénink na odřezku',title:'Sedlářský steh na odřezku',time:'40 min',videoLen:'9:30',goal:'Prošít 10 otvorů dvěma jehlami tak, aby steh z obou stran vypadal stejně.',needs:['leather','needles','thread','irons'],photo:'Dvě ruce se dvěma jehlami, nit prochází otvorem, detail šikmých stehů',\n  steps:[['Odměřte nit','Délka řady × 4, plus 30 cm. Navlékněte jehly na oba konce a nit v očku zajistěte propíchnutím.'],['Začněte druhým otvorem','Provlékněte nit tak, aby byly obě strany stejně dlouhé.'],['Vždy stejné pořadí','Levá jehla první skrz otvor, pravá za ní tím stejným otvorem, pod nití. Pořadí neměňte.'],['Utáhněte stejnou silou','Obě ruce tahají od sebe, ne nahoru. Steh se lehce nakloní, to je správně.'],['Zakončení','Poslední dva otvory prošijte zpátky, nit ustřihněte u kůže a zbytek zatlačte.']],\n  mistakes:['Střídání pořadí jehel: steh na jedné straně „leží“ a na druhé „stojí“','Různé utažení: řada je zvlněná','Propíchnutá nit jehlou v otvoru, nit se pak trhá'],safety:['Jehly jsou tupé, ale při protahování tlačte vždy směrem od sebe.'],\n  checks:['Všech 10 stehů je nakloněno stejným směrem.','Rub vypadá skoro jako líc.','Řadu jde utáhnout, aniž by se něco párá.']},\n {id:'L5',phase:'Výroba pouzdra',title:'Přenesení šablony a řezání dílů',time:'30 min',videoLen:'6:15',goal:'Mít dva přesné díly podle šablony 1:1.',needs:['leather','knife','ruler','mat'],photo:'Papírová šablona přilepená na kůži, vedle vyříznuté díly',\n  steps:[['Vytiskněte šablonu 1:1','Zkontrolujte kontrolní úsečku 50 mm pravítkem.'],['Přilepte šablonu na kůži','Malířskou páskou, na líc. Díly orientujte podél hřbetu kůže.'],['Obřízněte podle šablony','Rovné strany s pravítkem, rohy dořízněte ve dvou tazích.'],['Označte linii stehu','Podle šablony přeneste značky začátku a konce řady.']],\n  mistakes:['Tisk „přizpůsobit na stránku“ šablonu zmenší','Řezání rohů jedním obloukem, raději dva krátké tahy'],safety:['Stejná pravidla jako při tréninku řezu.'],\n  checks:['Oba díly mají stejné rozměry, přiložené k sobě lícují.','Značky stehu jsou na obou dílech na stejném místě.']},\n {id:'L6',phase:'Výroba pouzdra',title:'Lepení, děrování a šití pouzdra',time:'90 min',videoLen:'14:00',goal:'Sešít oba díly do hotového pouzdra a upravit hrany.',needs:['glue','irons','maul','needles','thread','tokonole'],photo:'Rozešité pouzdro na stole, jehly zapíchnuté v kůži',\n  steps:[['Nalepte díly k sobě','Tenká vrstva lepidla jen v šířce stehu na obou dílech, nechat zavadnout, přitisknout.'],['Vyrýsujte a vyděrujte','Jako v tréninku, začněte od horní hrany kapsy.'],['Šijte v jednom tahu','Sedlářským stehem po třech stranách. Horní hrana zůstává otevřená.'],['Zahlaďte hrany','Lehce zbrousit, pasta, leštítko. Několik průchodů.']],\n  mistakes:['Příliš mnoho lepidla, vytéká do stehu','Hrany brousit až po sešití, ne před'],safety:['Lepidlo používejte při otevřeném okně.'],\n  checks:['Karta vklouzne do kapsy s mírným odporem.','Steh je bez vynechání a na rubu úhledný.','Hrany jsou hladké a lesklé.']},\n];\nconst PHASES = ['Výběr projektu','Vybavení','Příprava místa','Trénink na odřezku','Výroba pouzdra','Hodnocení'];\nconst STATES = [['want','Chci koupit','Chci'],['ordered','Objednáno','Objed.'],['have','Mám','Mám']];\nconst HOME = [\n {id:'ruler',name:'Kovové pravítko',hint:'Alespoň 30 cm, ocelové'},\n {id:'knife',name:'Odlamovací nůž',hint:'S náhradními čepelemi'},\n {id:'mat',name:'Řezací podložka',hint:'Zelená podložka s mřížkou'},\n {id:'maul',name:'Palička',hint:'Gumová nebo plastová, ne kovové kladivo'},\n {id:'glue',name:'Kontaktní lepidlo',hint:'Např. Chemoprén'},\n];\nconst fmt = n => n.toLocaleString('cs-CZ') + ' Kč';\nconst KEY = 'hidepath.v1';\nconst DEFAULT_STATUS = {leather:'have',knife:'have',ruler:'have',mat:'have',needles:'have',thread:'have',maul:'have',glue:'have',irons:'ordered',tokonole:'want',divider:'want',beveler:'want'};\n\nclass Component extends DCLogic {\n constructor(p){\n  super(p);\n  let saved={};\n  try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}\n  const screen = p.screen || saved.screen || 'dashboard';\n  this.state = {\n   screen, itemId: p.itemId || saved.itemId || 'irons', lessonId: p.lessonId || saved.lessonId || 'L2',\n   status: saved.status || {...DEFAULT_STATUS}, done: saved.done || {L1:true},\n   checks: saved.checks || {}, meta: saved.meta || {}, editing:null, filter:'all', obStep:1, home:{}, toast:'',\n  };\n }\n persist(){ const {screen,itemId,lessonId,status,done,checks,meta}=this.state; try{localStorage.setItem(KEY,JSON.stringify({screen,itemId,lessonId,status,done,checks,meta}))}catch(e){} }\n set(patch){ this.setState(patch, ()=>this.persist()); }\n go(screen, extra={}){ this.set({screen,toast:'',...extra}); window.scrollTo(0,0); }\n pill(on, extra=''){ return `min-height:44px;padding:0 16px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid ${on?'var(--hp-leather)':'transparent'};background:${on?'var(--hp-leather)':'transparent'};color:${on?'var(--hp-canvas)':'var(--hp-leather)'};${extra}`; }\n renderVals(){\n  const S=this.state, st=S.status, showEn = this.props.showEnglishTerms ?? true;\n  const is={[S.screen]:true};\n  const go=(s,extra)=>()=>this.go(s,extra);\n  const setStatus=(id,v)=>()=>this.set({status:{...st,[id]:v}});\n  const mid=it=>Math.round((it.lo+it.hi)/2);\n  const haveCount=ITEMS.filter(i=>st[i.id]==='have').length, orderedCount=ITEMS.filter(i=>st[i.id]==='ordered').length, wantCount=ITEMS.length-haveCount-orderedCount;\n  const ess=ITEMS.filter(i=>i.group==='ess'), essHave=ess.filter(i=>st[i.id]==='have').length;\n  const rem=g=>ITEMS.filter(i=>st[i.id]!=='have'&&(g?i.group===g:true)).reduce((a,i)=>a+mid(i),0);\n  const doneCount=LESSONS.filter(l=>S.done[l.id]).length;\n  const readyPct=Math.round(haveCount/ITEMS.length*100), ordPct=Math.round(orderedCount/ITEMS.length*100);\n  const isEss=n=>
