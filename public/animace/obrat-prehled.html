<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBRAT — dva druky</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        background: #faf6ef;
        color: #342a23;
        font: 18px system-ui;
      }
      main {
        max-width: 900px;
        margin: auto;
        padding: 24px 16px;
      }
      button {
        font: inherit;
        padding: 10px 12px;
        margin: 4px;
        border: 1px solid #986e4a;
        border-radius: 8px;
        background: white;
        color: #342a23;
      }
      button[aria-pressed='true'] {
        background: #75431e;
        color: white;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      text {
        font-family: system-ui, sans-serif;
        fill: #342a23;
      }
      .leather {
        fill: #a9672f;
        stroke: #5e3519;
        stroke-width: 2;
      }
      .inner {
        fill: #c58a52;
        stroke: #5e3519;
        stroke-width: 2;
      }
      .t3 {
        fill: #b47640;
        stroke: #5e3519;
        stroke-width: 1.5;
      }
      .seam {
        fill: none;
        stroke: #f2d6ab;
        stroke-width: 1.4;
        stroke-dasharray: 5 4;
      }
      .snap {
        fill: #d8b66b;
        stroke: #765a27;
        stroke-width: 2;
      }
      .hole {
        fill: #4a3620;
      }
      #flap {
        transition: transform 0.6s;
        transform-box: view-box;
        transform-origin: 0 130px;
      }
      svg.cards #flap {
        transform: scaleY(-1);
      }
      .state {
        transition: opacity 0.4s;
      }
      @media (prefers-reduced-motion: reduce) {
        #flap,
        .state {
          transition: none;
        }
      }
      #caption {
        min-height: 84px;
      }
      a {
        color: #75431e;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/projects/obrat-wallet" data-back>← Zpět do lekce</a>
      <h1>OBRAT · dva druky</h1>
      <p>Schéma R11 podle rozměrů střihu. Pohyb je názorný, ohyb kůže nesimuluje.</p>
      <div role="group" aria-label="Stav peněženky">
        <button data-state="closed" aria-pressed="true">Zavřená</button
        ><button data-state="cards" aria-pressed="false">Otevřené C</button
        ><button data-state="coins" aria-pressed="false">Otevřené B</button>
      </div>
      <svg viewBox="0 20 360 370" role="img" aria-labelledby="caption" class="closed">
        <!-- záda T1 (zavřený pohled; 1 mm = 2,4 px, tělo x 40–299, y 130–346) -->
        <path d="M40 130H299.2V332Q299.2 346 285 346H54Q40 346 40 332Z" class="leather" />
        <!-- bankovky a karty v kapse -->
        <rect x="66.7" y="156.4" width="205.8" height="181.2" fill="#ddd3b5" stroke="#9e947a" />
        <rect x="66.9" y="208" width="205.4" height="129.6" rx="6" fill="#4c6976" stroke="#e7edea" />
        <!-- T2 s výkusem a C -->
        <path
          class="inner"
          d="M40 166H112C126.4 166 121.6 221.2 136 221.2H203.2C217.6 221.2 212.8 166 227.2 166H299.2V332Q299.2 346 285 346H54Q40 346 40 332Z"
        />
        <circle cx="251.2" cy="191.2" r="14.4" class="snap" />
        <!-- kapsa na mince přes celou šířku (P + T3, y 50–90), všitá do U-švu těla -->
        <path d="M40 250H299.2V332Q299.2 346 285 346H54Q40 346 40 332Z" class="t3" />
        <path class="seam" d="M137.2 257.2V324.4M202 257.2V324.4" />
        <g id="coins" class="state" opacity="0">
          <circle cx="92.8" cy="300.4" r="33" fill="#cfc4a0" />
          <circle cx="246.4" cy="300.4" r="31.2" fill="#cfc4a0" />
        </g>
        <circle cx="169.6" cy="269.2" r="14.4" class="snap" id="b-stud" opacity="0" />
        <path class="seam" d="M48.4 173V337.6H290.8V173" />
        <!-- víčko zavřené: ohyb y 48, volná hrana y 68, oba konce šikmo -->
        <g id="lid-closed" class="state">
          <path d="M58 245.2H281.2L275.2 283.6Q275.2 293.2 265.6 293.2H73.6Q64 293.2 64 283.6Z" class="leather" />
          <circle cx="169.6" cy="269.2" r="14.4" class="snap" />
          <circle cx="169.6" cy="269.2" r="6" class="hole" />
          <text x="188" y="276" font-size="18">B</text>
        </g>
        <!-- víčko zvednuté asi kolmo (zkrácený pohled) -->
        <g id="lid-open" class="state" opacity="0">
          <path d="M58 245.2H281.2L278 236H61Z" class="inner" />
          <text x="306" y="244" font-size="16">víčko</text>
          <text x="188" y="276" font-size="16">B</text>
        </g>
        <!-- klopa T1 (zavřená), ohyb na y 130 -->
        <g id="flap">
          <path
            class="leather"
            d="M40 130H299.2V202Q299.2 221.2 280 221.6L59 230.4Q40 230.8 40 211.6Z"
          />
          <path class="seam" d="M48.4 137.2V222.4L290.8 212.8V137.2" />
          <circle cx="251.2" cy="191.2" r="14.4" class="snap" />
          <circle cx="251.2" cy="191.2" r="6" class="hole" id="c-hole" opacity="0" />
        </g>
        <text x="270" y="198" font-size="20" id="c-label">C</text>
      </svg>
      <p id="caption" aria-live="polite">
        Zapnuté B i C. Klopa se šikmou hranou končí nad víčkem kapsy na mince.
      </p>
      <p><a href="/projekty/obrat/konstrukce.svg">Konstrukční nákres</a></p>
    </main>
    <script>
      const captions = {
        closed: 'Zapnuté B i C. Klopa se šikmou hranou končí nad víčkem kapsy na mince.',
        cards:
          'Otevřete jen C. Karty a bankovky vyndáte z kapsy s výkusem. Kapsa na mince zůstává zavřená.',
        coins:
          'Otevřete jen B a zvedněte víčko asi do kolmé polohy (víc k vyndání mincí není potřeba). Mince jsou ve dvou dutinách vlevo a vpravo od B. C zůstává zapnutý.',
      };
      const svg = document.querySelector('svg');
      const show = (id, on) => (document.getElementById(id).style.opacity = on ? 1 : 0);
      function setState(state) {
        svg.setAttribute('class', state);
        const open = state === 'coins';
        show('lid-closed', !open);
        show('lid-open', open);
        show('coins', open);
        show('b-stud', open);
        show('c-hole', state === 'cards');
        document.getElementById('c-label').textContent = state === 'cards' ? '' : 'C';
        document.getElementById('caption').textContent = captions[state];
        document
          .querySelectorAll('button')
          .forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === state)));
      }
      document
        .querySelectorAll('button')
        .forEach((b) => b.addEventListener('click', () => setState(b.dataset.state)));
      // Hidepath: „Zpět do lekce“ = krok zpět v historii, když se sem přišlo z aplikace.
      document.querySelector('[data-back]').addEventListener('click', (e) => {
        let origin = '';
        try {
          origin = document.referrer ? new URL(document.referrer).origin : '';
        } catch {}
        if (origin === location.origin && history.length > 1) {
          e.preventDefault();
          history.back();
        }
      });
    </script>
  </body>
</html>
