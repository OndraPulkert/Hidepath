<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otvory dna naplocho</title>
<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
<!-- Self-hostované fonty aplikace (public/fonts), aby stránka fungovala i offline v PWA. -->
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  color-scheme:light;
  --bg:#f3efe9;--panel:#fffdf9;--stage:#f7f2ea;--ink:#2a211b;--muted:#6c6158;--line:#ddd5cc;
  --accent:#b3261e;--ok:#2f6b3a;--btn:#2a211b;--btn-ink:#fffdf9;
  --ui:#b8773f;--ui-d:#8a5228;--ui-hi:#d39a63;
  /* kůže Blu: modře probarvená lícová useň 1,2 mm (barvy schematické) */
  --lic:#2f5f8f;--lic-d:#1d3d5e;--lic-hi:#4f82b3;
  --rub:#b7c6d4;--rub-d:#8597a9;--rub-fib:#9fb1c3;
  --hole:#141a21;--graphite:#4f545a;--steel:#a3abb3;--steel-d:#5c656e;
  --chip-lic:#2f5f8f;--chip-rub:#b7c6d4;
  --board:#eceff1;--board-d:#aab2ba;--thread2:#c0601a;--halo:#ffffff;
  --skin:#e9b996;--skin-d:#b98563;--mallet:#d8c7a6;--mallet-d:#8f7a55;--wood:#7b5a3a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#16120f;--panel:#1f1915;--stage:#241d18;--ink:#ece4dc;--muted:#a89a8e;--line:#3a3029;
  --accent:#ff8a80;--ok:#7cc28a;--btn:#ece4dc;--btn-ink:#16120f;
  --ui:#a96c38;--ui-d:#7a4822;--ui-hi:#c08654;
  --lic:#2b557f;--lic-d:#1a3550;--lic-hi:#4775a2;
  --rub:#a3b2c0;--rub-d:#718395;--rub-fib:#8d9fb1;--chip-lic:#2b557f;--chip-rub:#a3b2c0;
  --hole:#0b0f13;--graphite:#3f4449;--steel:#9099a2;--steel-d:#4d555d;
  --board:#a9b1b8;--board-d:#6c747c;--thread2:#e8995a;--halo:#ece9e1;
  --skin:#d6a684;--skin-d:#a57454;--mallet:#c4b291;--mallet-d:#7a6744;--wood:#6b4c32;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16120f;--panel:#1f1915;--stage:#241d18;--ink:#ece4dc;--muted:#a89a8e;--line:#3a3029;
  --accent:#ff8a80;--ok:#7cc28a;--btn:#ece4dc;--btn-ink:#16120f;
  --ui:#a96c38;--ui-d:#7a4822;--ui-hi:#c08654;
  --lic:#2b557f;--lic-d:#1a3550;--lic-hi:#4775a2;
  --rub:#a3b2c0;--rub-d:#718395;--rub-fib:#8d9fb1;--chip-lic:#2b557f;--chip-rub:#a3b2c0;
  --hole:#0b0f13;--graphite:#3f4449;--steel:#9099a2;--steel-d:#4d555d;
  --board:#a9b1b8;--board-d:#6c747c;--thread2:#e8995a;--halo:#ece9e1;
  --skin:#d6a684;--skin-d:#a57454;--mallet:#c4b291;--mallet-d:#7a6744;--wood:#6b4c32;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Albert Sans",system-ui,sans-serif;padding:22px 16px 44px;overflow-x:hidden}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.55rem;line-height:1.2;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:6px 0 0;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.stagewrap{position:relative;background:var(--stage);border-radius:8px;overflow:hidden}
#stage{display:block;width:100%;height:auto;aspect-ratio:3/2}
.badge{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;letter-spacing:.06em;transition:opacity .2s}
.badge i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.2)}
.badge small{font-weight:500;letter-spacing:0;color:var(--muted);font-size:12px}
.badge[hidden]{display:none}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.controls button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:0}
.controls button.play{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls svg{width:18px;height:18px;fill:currentColor}
.counter{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.prog{display:flex;gap:6px;align-items:stretch}
.pseg{flex:1;display:grid;gap:4px;min-width:0;cursor:pointer;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left}
.pseg .bars{display:flex;gap:2px;height:6px}
.pseg .bars span{flex:1;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.pseg .bars span b{position:absolute;inset:0;background:var(--ui);transform-origin:left;transform:scaleX(0)}
.pseg .pl{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.pl span{display:none}}
.pseg.on .pl{color:var(--ink);font-weight:600}
.cap{min-height:6.6em}
.cap .no{display:inline-block;font-weight:700;color:var(--ui-d);margin-right:6px;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .cap .no{color:var(--ui-hi)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cap .no{color:var(--ui-hi)}}
.cap h2{display:inline;font-size:1.05rem;margin:0}
.cap p{margin:4px 0 0;color:var(--ink)}
.cap .tip{display:block;margin-top:6px;color:var(--muted);font-size:14px}
.cap .tip b{color:var(--accent);font-weight:700}
.note{font-size:13px;color:var(--muted);margin:0}
/* svg text */
.t{font:600 4.1px "Albert Sans",sans-serif;fill:var(--ink)}
.ts{font:500 3.7px "Albert Sans",sans-serif;fill:var(--muted)}
.tw{font:700 4.6px "Albert Sans",sans-serif;fill:var(--ink)}
.ta{font:700 4.1px "Albert Sans",sans-serif;fill:var(--accent)}
.tok{font:700 4.1px "Albert Sans",sans-serif;fill:var(--ok)}
.lead-l{stroke:var(--muted);stroke-width:.25;fill:none}
@media (min-width:700px){.t,.ta,.tok{font-size:2.8px}.ts{font-size:2.5px}.tw{font-size:3.2px}}
.panelbox{fill:var(--panel);stroke:var(--line);stroke-width:.35}
.pillbg{fill:var(--panel);stroke:var(--line);stroke-width:.3;opacity:.95}
@media (max-width:520px){.badge small{display:none}.cap{min-height:9.5em}.counter{width:100%;margin-left:0;order:9}}
/* Hidepath: návrat do lekce */
.backlink{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;justify-self:start}
.backlink:hover{text-decoration:underline}
.backlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>

<div class="wrap">
<header>
<a class="backlink" href="/" data-back>← Zpět do lekce</a>
<h1>Otvory dna naplocho</h1>
<p class="lead">Projekt 02, mince 50 Kč, kůže 1,2 mm. Otvory dna na plochém pásu před složením: přední panel z líce, zadní a vnitřní z rubu (lekce 5; v malém lekce 4).</p>
</header>

<section class="card" aria-label="Animace postupu">
  <div class="stagewrap">
    <svg id="stage" viewBox="0 0 135 90" role="img" aria-label="Animovaný postup prosekání otvorů dna na plochém pásu"></svg>
    <div class="badge" id="badge" hidden><i id="chip"></i><span id="side">LÍC</span><small id="sidesub"></small></div>
  </div>
  <div class="prog" id="prog"></div>
  <div class="controls">
    <button id="bRestart" aria-label="Od začátku" title="Od začátku"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
    <button id="bPrev" aria-label="Předchozí krok" title="Předchozí krok"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
    <button id="bPlay" class="play" aria-label="Přehrát" title="Přehrát / pozastavit"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="bNext" aria-label="Další krok" title="Další krok"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <span class="counter" id="counter">krok 1 / 13</span>
  </div>
  <div class="cap" aria-live="polite"><span class="no" id="capNo">A1</span><h2 id="capT"></h2><p id="capB"></p></div>
</section>
<p class="note">Vidličky, palička a šikmé zářezy jsou schematické. „Tip“ označuje, co lekce neuvádí.</p>
</div>

<script>
(()=>{
// ---------- geometry (mm) ----------
// T = souřadnice šablony PÁS pro kůži 1,2 mm (docs/generated/pouzdro-mince-sablona-kuze-1-2mm.svg), pohled na líc
const STRIP="M10 20 A10 10 0 0 1 20 10 L33 10 A10 10 0 0 1 43 20 L43 53.07 A39 34 0 0 0 82 87.07 L97.69 87.07 A34 34 0 0 0 131.606 55.399 A2.5 2.5 0 0 1 134.1 53.07 L244.35 53.07 A6 6 0 0 1 250.35 59.07 L250.35 151.17 A6 6 0 0 1 244.35 157.17 L16 157.17 A6 6 0 0 1 10 151.17 Z";
const FY=53.07, FB=157.17, PW=72, PH=104.1;
const BX0=10, AX0=82, FX=97.69, BXF=169.69, IX0=178.35, IX1=250.35;      // zadní | ohyb A | přední | ohyb B | vnitřní
const LA=15.69, LB=8.66;
const CA=(AX0+FX)/2, CB=(BXF+IX0)/2;                                         // osy ohybů
const MIRX=BX0+IX1;                                                          // pás otočený jako stránka: x → 260,35 − x
const SEAM_Y=153.67, NH=17, PITCH=4;
const holes=x0=>Array.from({length:NH},(_,i)=>+(x0+4+PITCH*i).toFixed(2));
const HB=holes(BX0), HF=holes(FX), HI=holes(IX0);                             // 14…78 | 101,69…165,69 | 182,35…246,35
const SNAP=[153.19,62.57], PX=112.44, PY=94.87;
// propíchnuté značky z lekce 5 (kromě teček dna): konce čar ohybů asi 1 mm od hrany, rohy kapsy asi 1 mm dovnitř, střed dříku
const FOLD_LINES=[[AX0,87.07,FB],[FX,87.07,FB],[BXF,FY,FB],[IX0,FY,FB]];
const MARKS=[...FOLD_LINES.flatMap(([x,y0,y1])=>[[x,y0+1],[x,y1-1]]),
  [PX+10-6.36,PY+10-6.36],[PX+42.5-10+6.36,PY+10-6.36],[PX+6-3.54,PY+36+3.54],[PX+42.5-6+3.54,PY+36+3.54],SNAP];

// ---------- helpers ----------
const cl=t=>Math.max(0,Math.min(1,t));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const es=(t,a,b)=>ease(seg(t,a,b));
const L=(a,b,t)=>a+(b-a)*t;
const f=n=>(+n).toFixed(2);
const G=(tr,s,extra='')=>`<g transform="${tr}" ${extra}>${s}</g>`;
const camT=c=>`translate(${f(c.sx)} ${f(c.sy)}) scale(${f(c.k)}) translate(${f(-c.cx)} ${f(-c.cy)})`;
const tv=(c,x,y)=>[c.sx+(x-c.cx)*c.k,c.sy+(y-c.cy)*c.k];
let UID=0;const uid=p=>`${p}${++UID}`;
const range=n=>Array.from({length:n},(_,i)=>i);

function lbl(x,y,t,cls='t',anchor='start'){return `<text x="${f(x)}" y="${f(y)}" class="${cls}" text-anchor="${anchor}">${t}</text>`}
function pill(x,y,t,cls='t',anchor='start'){return `<g class="pill"><rect class="pillbg" rx="1.2" x="${f(x)}" y="${f(y-4)}" width="1" height="1"/>${lbl(x,y,t,cls,anchor)}</g>`}
function lead(x1,y1,x2,y2){return `<path d="M${f(x1)} ${f(y1)} L${f(x2)} ${f(y2)}" class="lead-l"/><circle cx="${f(x2)}" cy="${f(y2)}" r=".5" fill="var(--muted)"/>`}
function tick(x,y,s=1){return `<path d="M${x-1.6*s} ${y} l${1.2*s} ${1.2*s} l${2.4*s} -2.6" stroke="var(--ok)" stroke-width="${.7*s}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`}
function cross(x,y,r=1,w=.5){return `<path d="M${f(x-r)} ${f(y-r)} L${f(x+r)} ${f(y+r)} M${f(x-r)} ${f(y+r)} L${f(x+r)} ${f(y-r)}" stroke="var(--accent)" stroke-width="${w}" stroke-linecap="round"/>`}
function inset(title,body,{x=86,y=6,w=47,h=78}={}){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" class="panelbox"/><text x="${x+3}" y="${y+5.5}" class="ts" style="font-weight:700;letter-spacing:.06em">${title}</text>${body}`}
function notes(lines,y0=18,step=5.6,x=89){return lines.map((l,i)=>lbl(x,y0+i*step,l[0],l[1]||'ts')).join('')}
function clipMain(body,w=84){const id=uid('cm');return `<clipPath id="${id}"><rect x="0" y="0" width="${f(w)}" height="90"/></clipPath><g clip-path="url(#${id})">${body}</g>`}
// šikmý zářez vidličky: „/“ = pohled na stranu, ze které se sekalo; z druhé strany „\“
function slit(x,y,dir,d=.45,w=.42,col='var(--hole)'){return dir==='/'?`<path d="M${f(x-d)} ${f(y+d)} L${f(x+d)} ${f(y-d)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`:`<path d="M${f(x-d)} ${f(y-d)} L${f(x+d)} ${f(y+d)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`}

// ---------- strip (T coords; flip s = 1 líc nahoru, −1 rub nahoru, otočeno jako stránka) ----------
const BOARD=`<rect x="-40" y="-20" width="340" height="215" rx="3" fill="var(--board)" stroke="var(--board-d)" stroke-width=".6"/>`;
const flipT=s=>`translate(${f(MIRX/2)} 0) scale(${f(Math.abs(s)<.02?.02*Math.sign(s||1):s)} 1) translate(${f(-MIRX/2)} 0)`;
// st = {B:Set, F:Set, I:Set} proseknuté otvory (indexy 0–16 v pořadí T x); o.d/o.w velikost zářezu, o.dot poloměr tečky
function strip(s,st,o={}){
  const rub=s<0, d=o.d??.75, w=o.w??.42, dot=o.dot??.42;
  let g=`<path d="${STRIP}" fill="${rub?'url(#rubP)':'url(#licS)'}" stroke="${rub?'var(--rub-d)':'var(--lic-d)'}" stroke-width=".4"/>`;
  if(rub) g+=FOLD_LINES.map(([x,y0,y1])=>`<path d="M${x} ${f(y0+1)} V${f(y1-1)}" stroke="var(--graphite)" stroke-width="${f(o.pencil??.3)}" opacity=".75"/>`).join('');
  g+=MARKS.map(([x,y])=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(dot*.8)}" fill="var(--hole)" opacity=".75"/>`).join('');
  const row=(hs,set,dir)=>hs.map((x,i)=>set&&set.has(i)?slit(x,SEAM_Y,dir,d,w):`<circle cx="${x}" cy="${SEAM_Y}" r="${f(dot)}" fill="var(--hole)" opacity=".85"/>`).join('');
  g+=row(HB,st.B,'\\')+row(HF,st.F,'/')+row(HI,st.I,'\\');   // v T (pohled na líc): přední „/“, zadní a vnitřní „\“
  return G(flipT(s),g);
}
const ALL=new Set(range(NH));
const S0={B:new Set(),F:new Set(),I:new Set()};

// ---------- tools ----------
function chiselPlan(n){ // pohled shora, místní mm, hroty podél x (vystředěné), držadlo k −y
  const w=(n-1)*4+2.4;
  let s=`<rect x="${f(-w/2)}" y="-4.2" width="${f(w)}" height="3" rx=".5" fill="var(--steel)" stroke="var(--steel-d)" stroke-width=".2"/><rect x="-1.6" y="-14" width="3.2" height="9.8" rx="1" fill="var(--steel)" stroke="var(--steel-d)" stroke-width=".2"/>`;
  for(let i=0;i<n;i++){const x=(i-(n-1)/2)*4;s+=`<path d="M${f(x-.6)} .6 L${f(x+.6)} -.6" stroke="var(--steel-d)" stroke-width=".55" stroke-linecap="round"/><path d="M${f(x)} -1.2 V0" stroke="var(--steel-d)" stroke-width=".35"/>`}
  return s;
}
function burst(x,y,k=1){return [[-1,-.4],[1,-.4],[-.6,-1],[.6,-1],[0,-1.15]].map(([a,b])=>`<path d="M${f(x+a*2.2*k)} ${f(y+b*2.2*k)} L${f(x+a*4.4*k)} ${f(y+b*4.4*k)}" stroke="var(--accent)" stroke-width="${f(.45*k)}" stroke-linecap="round"/>`).join('')}

// řada úderů: order = indexy otvorů v pořadí, jak jde vidlička; strikes = [[začátek v pořadí, počet hrotů]]
const STR17=[[0,6],[5,6],[10,6],[15,2]];
function runRow(order,strikes,u,before=new Set()){
  const N=strikes.length; let v=cl(u)*N, gi=Math.min(N-1,Math.floor(v)), gp=u>=1?1:v-gi;
  const done=new Set(before);
  strikes.forEach(([a,n],j)=>{if(j<gi||(j===gi&&gp>=.5))for(let i=a;i<a+n;i++)done.add(order[i])});
  return {gi,gp,done};
}
// vidlička nad řadou: xsView = pohledové x otvorů v pořadí (mm), vrací SVG v souřadnicích scény
function chiselOnRow(c,xsView,strikes,r,o={}){
  const ctr=j=>{const [a,n]=strikes[j];let m=0;for(let i=a;i<a+n;i++)m+=xsView[i];return m/n};
  const {gi,gp}=r;
  if(gp>=1&&o.hideAtEnd!==false) return '';
  const x1=ctr(gi), x0=gi>0?ctr(gi-1):x1;
  const mv=es(gp,0,.3);
  const x=L(x0,x1,mv);
  const lift=gp<.3?3:gp<.45?L(3,0,seg(gp,.3,.45)):gp<.6?0:L(0,3,seg(gp,.6,.95));
  const op=gi===0?seg(gp,0,.15):1;
  const [sx,sy]=tv(c,x,SEAM_Y);
  let s=G(`translate(${f(sx)} ${f(sy-lift*c.k)}) scale(${f(c.k)})`,chiselPlan(strikes[gi][1]),`opacity="${f(op)}"`);
  if(gp>.46&&gp<.62) s+=burst(sx,sy-14*c.k,c.k*.9);
  // první hrot do posledního hotového otvoru
  if(gi>0&&gp>.12&&gp<.62){const [hx,hy]=tv(c,xsView[strikes[gi][0]],SEAM_Y);s+=`<circle cx="${f(hx)}" cy="${f(hy)}" r="${f(1.7*c.k)}" fill="none" stroke="var(--accent)" stroke-width=".45"/>`}
  return s;
}

// ---------- side view of the chisel + mallet (schéma, scéna) ----------
function malletAt(x,y,a=0){ // (x,y) = střed úderné plochy dole
  return G(`translate(${f(x)} ${f(y)}) rotate(${f(a)} 26 -14)`,`<path d="M8 -6 L30 -16" stroke="var(--wood)" stroke-width="2" stroke-linecap="round"/><rect x="-10" y="-11" width="20" height="11" rx="2.4" fill="var(--mallet)" stroke="var(--mallet-d)" stroke-width=".35"/>`);
}
function sideChisel(cx,tipY,n=6,pitch=6.6,o={}){
  const yb=tipY-6, w=(n-1)*pitch+8;
  let s='';
  for(let i=0;i<n;i++){const x=cx+(i-(n-1)/2)*pitch;s+=`<path d="M${f(x-1.4)} ${f(yb)} L${f(x+1.4)} ${f(yb)} L${f(x)} ${f(tipY)} Z" fill="var(--steel)" stroke="var(--steel-d)" stroke-width=".25"/>`}
  s+=`<rect x="${f(cx-w/2)}" y="${f(yb-6)}" width="${f(w)}" height="6" rx=".8" fill="var(--steel)" stroke="var(--steel-d)" stroke-width=".3"/>`;
  s+=`<rect x="${f(cx-3.6)}" y="${f(yb-30)}" width="7.2" height="24" rx="1" fill="var(--steel)" stroke="var(--steel-d)" stroke-width=".3"/>`;
  s+=`<rect x="${f(cx-5)}" y="${f(yb-33)}" width="10" height="3.2" rx=".8" fill="var(--steel-d)"/>`;
  if(o.hand!==false){ // ruka drží u spodku
    s+=`<rect x="${f(cx-10)}" y="${f(yb-17)}" width="20" height="10" rx="4.5" fill="var(--skin)" stroke="var(--skin-d)" stroke-width=".35"/>`;
    s+=[0,1,2].map(i=>`<path d="M${f(cx-7+i*.2)} ${f(yb-14.3+i*2.6)} H${f(cx+8)}" stroke="var(--skin-d)" stroke-width=".3" opacity=".8"/>`).join('');
  }
  return {s,top:yb-33};
}

// ---------- mini fold (schéma nebo cvičný proužek) ----------
// g: x0, H (výška pásu), seam (y řady), Z/A/P/B/V intervaly, hZ/hP/hV x otvorů (pohled na líc)
function foldMini(g,k,ox,oy,pB,pA,o={}){
  const X=x=>ox+(x-g.x0)*k, Y=y=>oy+y*k;
  const cA=(g.A[0]+g.A[1])/2, cB=(g.B[0]+g.B[1])/2;
  const sA=Math.cos(Math.PI*pA), sB=Math.cos(Math.PI*pB);
  const d=o.d??1.2, bad=!!o.bad;
  const rect=(a,b,face,extra='')=>`<rect x="${f(X(a))}" y="${f(Y(0))}" width="${f((b-a)*k)}" height="${f(g.H*k)}" fill="${face==='rub'?'url(#rubP)':'url(#licG)'}" stroke="${face==='rub'?'var(--rub-d)':'var(--lic-d)'}" stroke-width=".3" ${extra}/>`;
  // světlý lem pod barevným zářezem, aby byl vidět na modrém líci i na světlém rubu
  const sl=(xs,dir,col,w)=>xs.map(x=>(col==='var(--hole)'?'':slit(X(x),Y(g.seam),dir,d,w+.35,'var(--halo)'))+slit(X(x),Y(g.seam),dir,d,w,col)).join('');
  const dZV=bad?'/':'\\';
  const flip=(c,s,body)=>G(`translate(${f(X(c))} 0) scale(${f(Math.abs(s)<.02?.02*Math.sign(s||1):s)} 1) translate(${f(-X(c))} 0)`,body);
  const grpV=(slitsOnly)=>flip(cB,sB,(slitsOnly?'':rect(g.B[0],g.V[1],sB<0?'rub':'lic',`stroke-dasharray="${sB<0?'1 .6':'0'}"`))+sl(g.hV,dZV,'var(--thread2)',.62));
  const grpZ=(slitsOnly)=>flip(cA,sA,(slitsOnly?'':rect(g.Z[0],g.A[1],sA<0?'rub':'lic',`stroke-dasharray="${sA<0?'1 .6':'0'}"`))+sl(g.hZ,dZV,'var(--ok)',.42));
  let s='';
  if(sA<0) s+=`<g opacity=".55">${grpZ(false)}</g>`;
  if(sB<0) s+=`<g opacity=".55">${grpV(false)}</g>`;
  s+=rect(g.P[0],g.P[1],'lic')+sl(g.hP,'/','var(--hole)',.9);
  if(sB<0) s+=grpV(true);            // průhled: zářezy panelů za předním
  if(sA<0) s+=grpZ(true);
  if(sB>=0) s+=grpV(false);
  if(sA>=0) s+=grpZ(false);
  return s;
}
// schéma: 4 otvory na panel místo 17, poměry ohybů zachované zhruba
const MINI={x0:0,H:15,seam:12.5,Z:[0,22],A:[22,28],P:[28,50],B:[50,54],V:[54,76]};
MINI.hP=[31,36,41,46].map(x=>x+.5);MINI.hZ=MINI.hP.map(x=>2*25-x);MINI.hV=MINI.hP.map(x=>2*52-x);

// panely 30, ohyb A 15,69, ohyb B 8,66, 6 otvorů na panel, krajní 5 mm od čar ohybů i od konců

  g+=PR.marks.map(([x,y])=>`<circle cx="${f(PX_(x))}" cy="${f(PY_(y))}" r=".3" fill="var(--hole)" opacity=".75"/>`).join('');
  const row=(hs,set,dir)=>hs.map((x,i)=>set.has(i)?slit(PX_(x),PY_(PR.seam),dir,.55,.38):`<circle cx="${f(PX_(x))}" cy="${f(PY_(PR.seam))}" r=".32" fill="var(--hole)"/>`).join('');

    mirrorB:HI.map(x=>+(2*CB-x).toFixed(2)).sort((a,b)=>a-b).every((x,i)=>Math.abs(x-HF[i])<.01),
    practice:{holes:PR.hP.length,edge:+(PR.hP[0]-PR.P[0]).toFixed(2),mirrorA:PR.hZ.every((x,i)=>Math.abs(2*((PR.A[0]+PR.A[1])/2)-x-PR.hP[5-i])<.01),mirrorB:PR.hV.every((x,i)=>Math.abs(2*((PR.B[0]+PR.B[1])/2)-x-PR.hP[5-i])<.01)}}};
if(!reduce&&'IntersectionObserver' in window){const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&!auto){auto=true;io.disconnect();go(0,0);setPlay(true)}})},{threshold:.45});io.observe(svg)}
})();
</script>
