<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820"><style>text{font-family:Arial,sans-serif;fill:#342a23}.h{font-size:22px;font-weight:bold}.t{font-size:16px}.s{font-size:14px}.cut{fill:#a9672f;stroke:#5e3519;stroke-width:2}.in{fill:#c58a52;stroke:#5e3519;stroke-width:2}.lid{fill:#b8783e;stroke:#5e3519;stroke-width:2}.st{fill:none;stroke:#f2d6ab;stroke-width:1.4;stroke-dasharray:5 4}.snap{fill:#d8b66b;stroke:#765a27;stroke-width:2}.coin{fill:#cfc4a0;stroke:#6f6a55;stroke-width:1.5}</style><rect width="1320" height="820" fill="#faf6ef"/><text x="40" y="44" class="h">OBRAT R09 · zjednodušená konstrukce</text><text x="40" y="70" class="t">Zavřená 108 × 90 mm · jedna useň 1,2 mm · střih 1:1 na listech 1 a 2 · prototyp zatím neověřený</text><text x="40" y="120" class="h">01 · zavřená</text><rect class="cut" x="40" y="230" width="259.2" height="216" rx="14.399999999999999"/><path d="M48.4 268.4V437.6H290.8V268.4" class="st"/><rect class="cut" x="40" y="345.2" width="259.2" height="100.8" rx="14.399999999999999"/><path d="M97.6 352.4V437.6H270.4V352.4" class="st"/><path d="M184 359.6V437.6" class="st"/><path d="M290.8 349.2V437.6" class="st"/><circle cx="70" cy="414.79999999999995" r="14.399999999999999" class="snap"/><text x="88" y="419.79999999999995" class="s">A</text><path class="cut" d="M40 230H299.2V302Q299.2 321.2 280 320.9L59.2 330.7Q40 330.8 40 311.6Z"/><path d="M48.4 230V322.40000000000003L290.8 312.8V230" class="st"/><circle cx="251.2" cy="294.8" r="14.399999999999999" class="snap"/><text x="269.2" y="299.8" class="s">C</text><text x="350" y="120" class="h">02 · otevřené jen C</text><rect class="cut" x="350" y="230" width="259.2" height="216" rx="14.399999999999999"/><path d="M358.4 268.4V437.6H600.8000000000001V268.4" class="st"/><rect x="372" y="258.8" width="205.79999999999998" height="144" fill="#ddd3b5" stroke="#9e947a"/><rect x="380" y="297.2" width="205.43999999999997" height="129.6" rx="6" fill="#aab6b8" stroke="#e7edea"/><rect x="382" y="300.8" width="205.43999999999997" height="129.6" rx="6" fill="#80969c" stroke="#e7edea"/><rect x="384" y="304.4" width="205.43999999999997" height="129.6" rx="6" fill="#4c6976" stroke="#e7edea"/><rect x="386" y="308" width="205.43999999999997" height="129.6" rx="6" fill="#294754" stroke="#e7edea"/><path class="in" d="M350 268.4H422C436.4 268.4 431.6 321.2 446 321.2H513.2C527.6 321.2 522.8 268.4 537.2 268.4H609.2V432Q609.2 446 595.2 446H364Q350 446 350 432Z"/><rect class="cut" x="350" y="345.2" width="259.2" height="100.8" rx="14.399999999999999"/><path d="M407.6 352.4V437.6H580.4V352.4" class="st"/><path d="M494 359.6V437.6" class="st"/><path d="M600.8000000000001 349.2V437.6" class="st"/><circle cx="380" cy="414.79999999999995" r="14.399999999999999" class="snap"/><text x="398" y="419.79999999999995" class="s">A</text><circle cx="561.2" cy="294.8" r="14.399999999999999" class="snap"/><text x="579.2" y="299.8" class="s">C – patice</text><path class="cut" d="M350 230V160Q350 144 366 144H593.2Q609.2 144 609.2 160V230Z"/><circle cx="561.2" cy="165.2" r="14.399999999999999" class="snap"/><circle cx="561.2" cy="165.2" r="5" fill="#4a3620"/><text x="579.2" y="170.2" class="s">C – objímka</text><text x="660" y="120" class="h">03 · otevřené A a B</text><rect class="cut" x="660" y="230" width="259.2" height="216" rx="14.399999999999999"/><path d="M668.4 268.4V437.6H910.8000000000001V268.4" class="st"/><path class="cut" d="M660 230H919.2V302Q919.2 321.2 900 320.9L679.2 330.7Q660 330.8 660 311.6Z"/><path d="M668.4 230V322.40000000000003L910.8000000000001 312.8V230" class="st"/><circle cx="871.2" cy="294.8" r="14.399999999999999" class="snap"/><text x="889.2" y="299.8" class="s">C</text><circle cx="690" cy="414.79999999999995" r="14.399999999999999" class="snap"/><text x="708" y="419.79999999999995" class="s">A – patice</text><rect class="in" x="902.4000000000001" y="345.2" width="259.2" height="100.8" rx="8"/><path d="M1152 352.4 L922.8000000000001 352.4 L922.8000000000001 446 L1112.4 446 L1112.4 395.6 L1152 395.6 Z" fill="#b47640" stroke="#5e3519" stroke-width="1.5"/><path d="M931.2 352.4V437.6H1104V352.4" class="st"/><path d="M1017.6 359.59999999999997V437.6" class="st"/><circle class="coin" cx="1060.8000000000002" cy="403.6" r="30"/><circle class="coin" cx="974.4000000000001" cy="403.6" r="30"/><circle cx="1132.8000000000002" cy="371.6" r="14.399999999999999" class="snap"/><text x="1150.8000000000002" y="376.6" class="s">B – patice</text><circle cx="1131.6000000000001" cy="414.79999999999995" r="14.399999999999999" class="snap"/><circle cx="1131.6000000000001" cy="414.79999999999995" r="5" fill="#4a3620"/><text x="1149.6000000000001" y="419.79999999999995" class="s">A – objímka</text><rect class="lid" x="920.4000000000001" y="294.8" width="241.2" height="50.4" rx="6"/><circle cx="1132.8000000000002" cy="318.8" r="14.399999999999999" class="snap"/><circle cx="1132.8000000000002" cy="318.8" r="5" fill="#4a3620"/><text x="1150.8000000000002" y="323.8" class="s">B – objímka</text><text x="914.8000000000001" y="468" class="s">závěs = pravý šev těla · víčko ohnuté z pásu</text><path d="M40 506H1280" stroke="#c9bfae"/><text x="40" y="530" class="h">04 · díly a pořadí</text><text x="40" y="564" class="t">T1 záda + klopa (1 ohyb) · T2 přední stěna s výkusem · P pás + víčko (1 ohyb) · T3 předek mincí · 2 × K kryt.</text><text x="40" y="592" class="t">Všechny díly z jedné usně 1,2 mm, rovné řezy a zaoblené rohy; všechny švy se šijí naplocho.</text><text x="40" y="620" class="t">1. Mincovní modul: patice B do jazýčku T3 → T3 přilepit a přišít na P → ohnout víčko → objímka B obtiskem.</text><text x="40" y="648" class="t">2. Patice A a C do T2, kryty K na rub. 3. T2 na T1, konec P do pravého švu, šít U-šev.</text><text x="40" y="676" class="t">4. Objímky C a A podle obtisku. 5. Zkoušky: C samo, A + B samo, třesení, tloušťka.</text><text x="40" y="704" class="t">Zavřený řez nad mincí: záda → obsah → T2 → víčko → T3 → mince → P (5 vrstev usně).</text><text x="40" y="732" class="t">Proti předloze 03: stejná klopa se šikmou hranou, C, pás se třemi poli a A; B je schovaný pod pásem.</text><text x="40" y="760" class="t">Jiné: šev závěsu na pravém boku pásu, horní hrana pásu je ohyb víčka. Nákres není střih.</text></svg>
