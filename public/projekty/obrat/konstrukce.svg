th="205.79999999999998" height="144" fill="#ddd3b5" stroke="#9e947a"/><rect x="410" y="297.2" width="205.43999999999997" height="129.6" rx="6" fill="#aab6b8" stroke="#e7edea"/><rect x="412" y="300.8" width="205.43999999999997" height="129.6" rx="6" fill="#80969c" stroke="#e7edea"/><rect x="414" y="304.4" width="205.43999999999997" height="129.6" rx="6" fill="#4c6976" stroke="#e7edea"/><rect x="416" y="308" width="205.43999999999997" height="129.6" rx="6" fill="#294754" stroke="#e7edea"/><path class="in" d="M380 266H452C466.4 266 461.6 321.2 476 321.2H543.2C557.6 321.2 552.8 266 567.2 266H639.2V432Q639.2 446 625.2 446H394Q380 446 380 432Z"/><path class="in" d="M380 350H639.2V431.6Q639.2 446 624.8000000000001 446H394.4Q380 446 380 431.6Z"/><path d="M388.4 273.2V437.6H630.8000000000001V273.2" class="st"/><path d="M477.2 357.2V424.40000000000003" class="st"/><path d="M542 357.2V424.40000000000003" class="st"/><path class="lid" d="M398 345.2L402.8092665479436 383.6741323835488Q404 393.2 413.6 393.2H605.6Q615.2 393.2 616.3907334520565 383.6741323835488L621.2 345.2Z"/><circle cx="509.6" cy="369.2" r="14.399999999999999" class="snap"/><text x="527.6" y="374.2" class="s">B</text><circle cx="591.2" cy="291.2" r="14.399999999999999" class="snap"/><text x="651.2" y="296.2" class="s">C – patice</text><path class="cut" d="M380 230V160Q380 144 396 144H623.2Q639.2 144 639.2 160V230Z"/><circle cx="591.2" cy="168.8" r="14.399999999999999" class="snap"/><circle cx="591.2" cy="168.8" r="5" fill="#4a3620"/><text x="651.2" y="173.8" class="s">C – objímka</text><text x="720" y="120" class="h">03 · otevřené jen B</text><rect class="cut" x="720" y="230" width="259.2" height="216" rx="14.399999999999999"/><path d="M728.4 273.2V437.6H970.8000000000001V273.2" class="st"/><path class="in" d="M720 350H979.2V431.6Q979.2 446 964.8000000000001 446H734.4Q720 446 720 431.6Z"/><path d="M728.4 273.2V437.6H970.8000000000001V273.2" class="st"/><path d="M817.2 357.2V424.40000000000003" class="st"/><path d="M882 357.2V424.40000000000003" class="st"/><rect x="738" y="345.2" width="223.2" height="4.8" fill="#d9a877" stroke="#5e3519" stroke-width="1"/><circle class="coin" cx="772.8" cy="402.20000000000005" r="33"/><circle class="coin" cx="926.4" cy="404" r="31.2"/><circle cx="849.6" cy="369.2" r="14.399999999999999" class="snap"/><text x="995.2" y="374.2" class="s">B – patice</text><path class="cut" d="M720 230H979.2V302Q979.2 321.2 960 320.9L739.2 330.7Q720 330.8 720 311.6Z"/><path d="M728.4 237.2V322.40000000000003L970.8000000000001 312.8V237.2" class="st"/><circle cx="931.2" cy="291.2" r="14.399999999999999" class="snap"/><text x="949.2" y="296.2" class="s">C</text><path class="lid" d="M738 345.2L744 301.6972262222408H955.2L961.2 345.2Z"/><ellipse cx="849.6" cy="323.4486131111204" rx="14.399999999999999" ry="13.050832133327757" class="snap"/><ellipse cx="849.6" cy="323.4486131111204" rx="5" ry="4.531538935183249" fill="#4a3620"/><text x="995.2" y="328.4486131111204" class="s">B – objímka</text><text x="995.2" y="249.2" class="s">víčko odklopené</text><text x="995.2" y="267.2" class="s">naplno, B se opře o klopu</text><text x="995.2" y="407.6" class="s">dvě dutiny 37 mm,</text><text x="995.2" y="425.6" class="s">mezi nimi pole s B</text><path d="M40 506H1280" stroke="#c9bfae"/><text x="40" y="530" class="h">04 · díly a pořadí</text><text x="40" y="564" class="t">T1 záda + klopa (1 ohyb) · T2 přední stěna s výkusem · P zadní díl kapsy + víčko (1 ohyb) · T3 předek kapsy · kryt K Ø 17.</text><text x="40" y="592" class="t">Všechny díly z jedné usně 1,2 mm, rovné řezy a zaoblené rohy; všechny švy se šijí naplocho.</text><text x="40" y="620" class="t">1. Kapsa na mince: patice B do T3 → T3 přilepit na rub P → dělicí švy ušít, U-linii jen prorazit → dutiny vytvarovat přes mince, víčko ohnout → objímka B.</text><text x="40" y="648" class="t">2. Patice C do T2, kryt K na rub. 3. T2 na T1, kapsu na líc T2, U-šev těla jednou nití přes díry kapsy.</text><text x="40" y="676" class="t">4. Objímka C podle obtisku. 5. Zkoušky: C samo, B samo, třesení, tloušťka.</text><text x="40" y="704" class="t">Zavřený řez nad mincí: záda → obsah → T2 → P → mince → T3 → víčko (5 vrstev usně).</text><text x="40" y="732" class="t">Proti předloze 03: stejná klopa se šikmou hranou a C; kapsa na mince přes celou šířku, B uprostřed.</text><text x="40" y="760" class="t">Jiné: kapsa je přišitá v U-švu těla, víčko je ohnutý horní okraj zadního dílu P. Nákres není střih.</text></svg>
